/* 履歴の一覧（見本3・4）：［＋ 新しいチャット］、今日／昨日／今週／それより前 にまとめて、題名（2行まで）・時刻（今日と昨日は時:分、ほかは月/日）・写真・記録済み */
function histHtml() {
  const t0 = new Date();
  const day = n => new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() - n).getTime();
  const groups = [['今日', day(0)], ['昨日', day(1)], ['今週', day(6)], ['それより前', -Infinity]];
  let html = `<div class="hist"><button type="button" class="newc" data-act="chat-new">${ICON.add}新しいチャット</button>`;
  if (!CHATS.length) html += '<div class="hnone">まだ履歴はありません</div>';
  let g = -1;
  for (const c of CHATS) {
    const t = Date.parse(c.updatedAt), d = new Date(t);
    const gi = Number.isFinite(t) ? groups.findIndex(x => t >= x[1]) : groups.length - 1;
    if (gi !== g) { g = gi; html += `<div class="hg">${groups[gi][0]}</div>`; }
    const when = !Number.isFinite(t) ? '' : gi <= 1 ? `${d.getHours()}:${pad(d.getMinutes())}` : `${d.getMonth() + 1}/${d.getDate()}`;
    const on = c === CUR, cid = esc(c.id);
    html += `<div class="hi${on ? ' on' : ''}" data-cid="${cid}"><button type="button" class="hio" data-act="chat-open" data-cid="${cid}"${on ? ' aria-current="true"' : ''}>`
      + `<span class="t">${esc(c.title)}</span><span class="m">${when}${c.photo ? ICON.cam : ''}${c.recorded ? '<span class="rb">記録済み</span>' : ''}</span></button>`
      + `<button type="button" class="del" data-act="chat-del" data-cid="${cid}" aria-label="このチャットを消す">${ICON.x}</button></div>`;
  }
  return html + '<div class="hnote">この端末だけに保存（直近50件）。写真は小さい写真だけ残します。</div></div>';
}
/* 一覧を出す所：パソコンは左のメニューの下、スマホは開いている引き出しの中だけ（同じ一覧を2つ置かない）。変わっていなければ書き換えない */
const WIDE = window.matchMedia('(min-width:1024px)');
let DRAWER_OPEN = false;
function renderHist() {
  const h = histHtml();
  for (const [el, show] of [[$('#histSide'), WIDE.matches], [$('#histDrawer'), DRAWER_OPEN]]) {
    const html = show ? h : '';
    if (el._h === html) continue;
    const y = el.scrollTop;
    el.innerHTML = html;
    el._h = html;
    el.scrollTop = y;
  }
}
/* スマホの引き出し。開いている間は、うしろの画面を動かさない・押せないようにする */
const BEHIND = ['.top', '#view', '.chatbar', '.tabs'];
function openDrawer() {
  if (WIDE.matches || DRAWER_OPEN) return;
  DRAWER_OPEN = true;
  $('#scrim').hidden = false;
  $('#drawer').hidden = false;
  document.documentElement.classList.add('dlock');
  BEHIND.forEach(s => { const el = $(s); if (el) el.inert = true; });
  $('#histBtn').setAttribute('aria-expanded', 'true');
  renderHist();
  const on = $('#histDrawer .hi.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
  $('#drawer .dh .hbtn').focus({ preventScroll: true });
  // スマホの「戻る」（Android の戻る・iPhone の左端からのスワイプ）で、アプリから出ずに引き出しを閉じるよう、戻り先を1つ足す。
  // 閉じて戻るときに、ブラウザが開いたときの位置へ画面を戻さないようにする（開いたチャットのいちばん下・新しいチャットの上を出したまま）
  try { history.scrollRestoration = 'manual'; history.pushState({ drawer: 1 }, ''); } catch (e) { /* 足せなくても、✕・外側で閉じられる */ }
}
/* back：閉じたあと［≡］に戻す（✕・外側・Esc で閉じたとき）。popped：「戻る」で閉じた（足した戻り先は、もう戻った） */
function closeDrawer(back, popped) {
  if (!DRAWER_OPEN) return;
  DRAWER_OPEN = false;
  $('#scrim').hidden = true;
  $('#drawer').hidden = true;
  document.documentElement.classList.remove('dlock');
  BEHIND.forEach(s => { const el = $(s); if (el) el.inert = false; });
  $('#histBtn').setAttribute('aria-expanded', 'false');
  renderHist();
  if (back) $('#histBtn').focus({ preventScroll: true });
  // ✕・外側・チャットを開いた などで閉じた：開いたときに足した戻り先を消す（残すと、次の「戻る」が何もしないように見える）
  if (!popped && history.state && history.state.drawer) history.back();
}
window.addEventListener('popstate', () => { if (!(history.state && history.state.drawer)) closeDrawer(true, true); });
// 引き出しを開いたまま再読み込みした：引き出しは閉じているので、その戻り先の印を消す（✕で閉じたときに、アプリから戻ってしまわないように）
if (history.state && history.state.drawer) { try { history.replaceState(null, ''); } catch (e) { /* 何もしない */ } }
const onWide = () => { closeDrawer(); renderHist(); };   // 画面が広くなったら引き出しは閉じて、左の一覧にする
if (WIDE.addEventListener) WIDE.addEventListener('change', onWide); else WIDE.addListener(onWide);
/* 新しいチャット：空のチャットにして「探す」の上から（いまのチャットが空なら、そのまま。空のチャットは残さない） */
function newChat() {
  closeDrawer();
  setCur(null);
  MODE = 'search';
  TAB = 'search'; DETAIL = null; RETURN = null;
  FT.touched.clear();
  render();
  window.scrollTo(0, 0);
  if (WIDE.matches) $('#chatIn').focus({ preventScroll: true });
}
/* 履歴から開く：残した答えをそのまま出す（AIには聞かない・探し直さない）。いちばん下（最後の答え）を出す */
function openChat(id) {
  const c = CHATS.find(x => x.id === id);
  if (!c) return;
  closeDrawer();
  setCur(c);
  MODE = 'search';
  TAB = 'search'; DETAIL = null; RETURN = null;
  FT.touched.clear();
  render();
  window.scrollTo(0, document.body.scrollHeight);
}
/* 消す（確かめてから）。開いていたチャットなら、新しいチャットにする。press：長押しから */
const LP = { timer: null, x: 0, y: 0, fired: false, at: 0 };   // 長押し（スマホ）
function deleteChat(id, press) {
  const c = CHATS.find(x => x.id === id);
  if (!c) return;
  const ok = confirm(`「${c.title}」を消しますか？`);
  if (press) LP.at = Date.now();   // 確かめの画面を閉じた直後のタップ（長押しを離したとき）は、その下の行を開く操作にしない
  if (!ok) return;
  dropChat(c);
  if (CUR === c) {
    setCur(null);
    MODE = 'search';   // 新しいチャットになる
    if (TAB === 'search' && !DETAIL) { render(); window.scrollTo(0, 0); return; }
    renderCam();
  }
  renderHist();
}
/* スマホ：一覧の行を長押し（0.55秒。10px 以上動かしたり離したりしたら、やめる）で消す。パソコン：右クリックでも消せる */
document.addEventListener('pointerdown', e => {
  LP.fired = false;
  clearTimeout(LP.timer); LP.timer = null;
  const it = e.pointerType !== 'mouse' && e.target.closest ? e.target.closest('.hi') : null;
  if (!it) return;
  LP.x = e.clientX; LP.y = e.clientY;
  LP.timer = setTimeout(() => { LP.timer = null; LP.fired = true; deleteChat(it.dataset.cid, true); }, 550);
});
const lpStop = () => { clearTimeout(LP.timer); LP.timer = null; };
document.addEventListener('pointermove', e => { if (LP.timer && Math.hypot(e.clientX - LP.x, e.clientY - LP.y) > 10) lpStop(); });
document.addEventListener('pointerup', lpStop);
document.addEventListener('pointercancel', lpStop);
document.addEventListener('contextmenu', e => {
  const it = e.target.closest ? e.target.closest('.hi') : null;
  if (!it) return;
  e.preventDefault();
  if (LP.fired) return;   // 長押しのほうで、もう聞いた
  // スマホの長押しの途中（Android は長押しでもこれが来る）：ここで聞く（長押しの時間を待たない・2回聞かない）
  const press = !!LP.timer;
  lpStop();
  if (press) LP.fired = true;
  deleteChat(it.dataset.cid, press);
});

/* =========================================================
   13. 画面：記録する
   ========================================================= */
/* 文章からの下書き（13-2）の状態も持つ。draftText：書いた文章、context：チャットで聞いた内容、draft：AIの結果、aiFilled：AIが入れた欄。
   autoLine：号機を前回の号機で自動で入れただけか（AIの下書きで置き換えてよい。チャットで書いた号機・押して選んだ号機は置き換えない）。
   pre.line があるときは pre.autoLine に従う（チャットで号機を書かず、前回の号機が入っただけなら true）。
   autoAt：発生日時が自動で入ったままか（入力やチップで触ると false。保存のとき autoFields に入れる）。
   記録の新しい項目（結果・原因の種類 など。既定値は REC_DEFAULTS）と、aiNote：直近の振り分けのAIのメモ、rawText0：直す記録にもとからあった原文、
   modelHints：写真から読めた型式の候補 も持つ。pre で前の記録とのつながり（relatedId・relation）なども渡せる */
function newForm(pre) {
  const F = Object.assign(formDefaults(), { editId: null, occurredAt: nowLocal(), author: shown('author') ? META.author : '', line: shown('line') ? META.lastLine : '',
    area: '', equipment: '', symptom: '', cause: '', action: '', parts: [], photos: [], extra: {},
    draftText: '', context: '', draft: null, aiFilled: [], aiNote: '', rawText0: '', modelHints: [] }, pre || {});
  F.autoLine = !!F.line && (pre && pre.line ? !!pre.autoLine : true);
  F.autoAt = !(pre && pre.occurredAt);
  return F;
}
const formDefaults = () => Object.fromEntries(FORM_KEYS.map(k => [k, clone(REC_DEFAULTS[k])]));
function formFromRecord(r) {
  const auto = r.autoFields || [];
  const F = Object.assign(formDefaults(), { editId: r.id, occurredAt: r.occurredAt, author: r.author, line: r.line, area: r.area, equipment: r.equipment,
    symptom: r.symptom, cause: r.cause, action: r.action, parts: clone(r.parts || []), photos: clone(r.photos || []), extra: clone(r.extra || {}),
    // AIの印は、記録に残っている「AIが入れて人が直していない欄」から（直すと外れる）。自動で入ったままの欄（発生日時・号機）も引き継ぐ。
    // チャットで聞いた内容・AIのメモ・原文は、直して保存しても消さない（文章で書き直したときだけ原文を入れ替える）
    draftText: '', context: r.context || '', draft: null, aiFilled: (r.aiFilled || []).slice(), aiNote: r.aiNote || '', rawText0: r.rawText || '', modelHints: [],
    autoLine: auto.includes('line') && !!r.line, autoAt: auto.includes('occurredAt') });
  for (const k of FORM_KEYS) if (r[k] !== undefined) F[k] = clone(r[k]);
  F.lookupShown = !!String(r.lookupNote || '').trim();   // 調べたことのある記録は、消して直していても欄を出したまま
  F.orig = formSnap(F);   // 開いたときの値（直している途中の入力があるかを見分ける。formHasInput）
  return F;
}
/* 記録を直す画面で、入力があったかを比べる値（開いたときの値 FORM.orig と比べる） */
const formSnap = F => ({ occurredAt: F.occurredAt, author: F.author, line: F.line, area: F.area, equipment: F.equipment, symptom: F.symptom, cause: F.cause,
  action: F.action, parts: (F.parts || []).map(p => [p.name, p.model, p.photo ? p.photo.id : '']), photos: (F.photos || []).map(p => p.id), extra: cleanExtra(F.extra),
  draftText: F.draftText, ...Object.fromEntries(FORM_KEYS.map(k => [k, clone(F[k])])), aiFilled: (F.aiFilled || []).slice().sort(), autoAt: !!F.autoAt, autoLine: !!F.autoLine });
/* 入力中の記録があるか（破棄してよいか聞くとき）。新しい記録は、何か入れたか。記録を直しているときは、開いたときから値を変えたか
   （直している途中の原因や結果も、ほかの記録の［直す］や［続きを書く］で黙って消さない） */
const formHasInput = () => {
  if (!FORM) return false;
  if (FORM.editId) return !!FORM.orig && JSON.stringify(formSnap(FORM)) !== JSON.stringify(FORM.orig);
  return !!(FORM.equipment || FORM.symptom || FORM.cause || FORM.action || FORM.parts.length || FORM.photos.length
    || Object.values(FORM.extra || {}).some(v => String(v).trim()) || String(FORM.draftText || '').trim()
    || String(FORM.failed || '').trim() || FORM.causeType || FORM.result || FORM.downtime || (FORM.symptomTags || []).length || FORM.relatedId
    || String(FORM.lookupNote || '').trim());
};
/* 入力中の記録を破棄してよいか聞く（入力が無ければ聞かずに true）。what：「新しく書きます」「この記録を直します」 */
const discardOk = what => !formHasInput() || confirm((FORM.editId ? '直している途中の記録があります。破棄して' : '入力中の記録があります。破棄して') + what + 'か？');
const chip = (kind, v, on, label, cls) => `<button type="button" class="chip${cls ? ' ' + cls : ''}${on ? ' on' : ''}" data-f="${kind}" data-v="${esc(v)}">${esc(label || v)}</button>`;
const reqMark = f => (f.required ? '<span class="req">必須</span>' : '');
/* AIが下書きした欄（13-2）は、見出しの横に「AI」の印を出し、欄に印のクラスを付ける。人がその欄を直すと外す */
const aiMarked = f => !!(FORM && (FORM.aiFilled || []).includes(f.id));
const aiMark = f => (aiMarked(f) ? '<span class="aimark" title="AIが下書きした欄">AI</span>' : '');
const fBox = f => `<div class="f${aiMarked(f) ? ' aifill' : ''}" data-fid="${esc(f.id)}">`;
const dropAi = id => {
  if (!FORM) return;
  FORM.aiFilled = (FORM.aiFilled || []).filter(x => x !== id);
  // 部品の欄を人が直したら、AIが入れた部品も人が確かめた部品として扱う（押し直しても入れ替えない）
  if (id === 'parts') FORM.parts.forEach(p => { delete p.ai; });
};
/* 描き直さずに、その欄の印だけを外す（文字を入れている途中の欄を描き直さないため） */
function unmarkAi(id) {
  if (!FORM || !(FORM.aiFilled || []).includes(id)) return;
  dropAi(id);
  const box = document.querySelector(`#view .f[data-fid="${CSS.escape(id)}"]`);
  if (box) { box.classList.remove('aifill'); box.querySelectorAll('.aimark').forEach(m => m.remove()); }
}
const noOptions = '<p class="muted" style="font-size:14px;margin:4px 0 0">選択肢がありません（「設定」で追加できます）</p>';
const withCurrent = (list, cur) => (cur && !list.includes(cur) ? list.concat(cur) : list);   // 設定から消した値の記録を直すときも、選んである値は出す
/* 1つだけ選ぶ欄（原因の種類・結果・停止時間）のチップ。もう一度押すと外す（onFormChip） */
const pickChips = (kind, cur) => `<div class="chips">${PICKS[kind].map(([v, l]) => chip(kind, v, cur === v, l)).join('')}</div>`;
/* 発生日時のチップ [何分前, 名前] */
const WHEN_CHIPS = [['0', 'いま'], ['30', '30分前'], ['60', '1時間前'], ['120', '2時間前']];
/* 入力項目ごとの入力欄（もともとある項目）。並びと名前・必須は「設定」のとおり */
const FORM_PARTS = {
  occurredAt: (f, F) => `${fBox(f)}<label class="l" for="fDate">${esc(f.label)}</label><input id="fDate" class="inp mono" type="datetime-local" value="${esc(F.occurredAt)}">
      <div class="chips">${WHEN_CHIPS.map(([v, l]) => chip('when', v, false, l, 'sug')).join('')}</div></div>`,
  // 前回の号機が自動で入っているだけのときは、そう分かるように小さく出す
  line: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}${F.autoLine && F.line ? '<span class="lnote">前回の号機（違えば押して直す）</span>' : ''}</span>${LINES.length || F.line
    ? `<div class="chips grid4">${withCurrent(LINES, F.line).map(l => chip('line', l, F.line === l, l.replace(/ライン$/, ''))).join('')}</div>` : noOptions}</div>`,
  area: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span>${Object.keys(AREAS).length || F.area
    ? `<div class="chips">${withCurrent(Object.keys(AREAS), F.area).map(a => chip('area', a, F.area === a)).join('')}</div>` : noOptions}</div>`,
  equipment: (f, F) => {
    const eqList = equipOfArea(F.area);
    return `${fBox(f)}<label class="l" for="fEquip">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label>
      <input id="fEquip" class="inp" maxlength="40" placeholder="${F.area ? '下から選ぶか、入力してください' : '先に' + esc(shortLabel(fieldById('area'))) + 'を選ぶと候補が出ます'}" value="${esc(F.equipment)}">
      ${eqList.length ? `<div class="chips" id="eqChips">${eqList.map(e => chip('equip', e, canonEquip(F.equipment) === e, '', 'sug')).join('')}</div>` : ''}
      <div id="eqNear">${nearHtml(F)}</div>
    </div>`;
  },
  symptom: (f, F) => `${fBox(f)}<label class="l" for="fSym">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label>
      <textarea id="fSym" class="inp" maxlength="300" placeholder="例）袋を吸わず、チャックが開かない">${esc(F.symptom)}</textarea>
      <div id="symTags">${symTagsHtml(F)}</div>
      <div id="sameHint">${sameHtml(F)}</div>
      <div id="simHint"></div>
    </div>`,
  causeType: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span>${pickChips('causeType', F.causeType)}</div>`,
  cause: (f, F) => `${fBox(f)}<label class="l" for="fCause">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label><input id="fCause" class="inp" maxlength="300" placeholder="${f.required ? '' : '分からなければ空欄でOK'}" value="${esc(F.cause)}"></div>`,
  action: (f, F) => `${fBox(f)}<label class="l" for="fAction">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label><textarea id="fAction" class="inp" maxlength="300" placeholder="例）吸盤を新品に交換した">${esc(F.action)}</textarea></div>`,
  failed: (f, F) => `${fBox(f)}<label class="l" for="fFailed">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label><input id="fFailed" class="inp" maxlength="300" placeholder="試したけど直らなかったこと（あれば）" value="${esc(F.failed)}"></div>`,
  result: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span>${pickChips('result', F.result)}</div>`,
  downtime: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span>${pickChips('downtime', F.downtime)}</div>`,
  parts: f => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span><div id="partsBox">${partsHtml()}</div></div>`,
  // 写真から読み取ったこと（「この内容で記録する」で写真の読み取りから入れた文。× で消せる）
  photos: (f, F) => `${fBox(f)}<span class="l">${esc(f.label)}${reqMark(f)}${aiMark(f)}</span><div id="photoBox">${photosHtml()}</div>
      ${F.photoText ? `<div class="ptext"><span>写真から読み取ったこと：${esc(F.photoText)}</span><button type="button" class="x2" data-act="ptext-clear" aria-label="写真から読み取ったことを消す">✕</button></div>` : ''}</div>`,
  author: (f, F) => `${fBox(f)}<label class="l" for="fAuthor">${esc(f.label)}${reqMark(f)}${aiMark(f)}</label><input id="fAuthor" class="inp" maxlength="20" placeholder="名前" value="${esc(F.author)}"></div>`,
};
/* 症状の言葉のチップ。押すと文に足し、症状の種類（symptomTags）にも入れる（on の見た目）。もう一度押すと種類から外す（文はそのまま）。
   設定から消した言葉でも、選んである種類は出す。AIが選んだ種類（人がまだ触っていない）は、列の頭に小さな印 */
function symTagsHtml(F) {
  const tags = F.symptomTags || [], words = SYMPTOM_WORDS.concat(tags.filter(t => !SYMPTOM_WORDS.includes(t)));
  if (!words.length) return '';
  const ai = tags.length && (F.aiFilled || []).includes('symptomTags');
  return `<div class="chips${ai ? ' aitags' : ''}">${ai ? '<span class="aitag" title="AIが選んだ症状の種類">AI</span>' : ''}${words.map(w => chip('sym', w, tags.includes(w), '', 'sug')).join('')}</div>`;
}
/* 設備の近い候補：入れた設備名が、選んだ場所の一覧（と別名）に無く、一覧に近い名前があれば3つまで（止めない。押さなくても保存できる）。
   近い：部分一致（2文字以上）か、norm したあとの似ている度合い（2文字ずつの組）が 0.5 以上 */
function nearEquips(F) {
  const name = String(F.equipment || '').trim(), q = norm(name), list = equipOfArea(F.area);
  if (!q || !list.length || list.some(e => sameEquip(e, name))) return [];
  const g = grams(name);
  const score = n => {
    const x = norm(n);
    if (!x) return 0;
    if (q.length >= 2 && (x.includes(q) || q.includes(x))) return 1;
    return dice(g, grams(n));
  };
  return list.map(e => ({ e, s: Math.max(...[e, ...aliasesOf(e)].map(score)) })).filter(x => x.s >= 0.5)

/* ---------------------------------------------------------
   14-1. 見直し待ち（主任が記録を整える。書き足すほど、AIの答えが正確になる）
   対象：本物の記録（サンプル・削除済みは除く）。理由：原因が空・原因の種類が空か「不明」・結果が空・結果が「様子見」のまま1日以上・
   停止時間が空・設備名が一覧（と別の呼び方）に無い・発生日時が自動のまま・AIが入れた欄が人に確かめられていない。
   「使わない」にした項目は理由にしない（チームで使わないと決めた欄で、手間を増やさない）。
   件数が多くても見やすいよう、古い順に並べ、理由で絞り込め、一度に REVIEW_STEP 件ずつ出す
   --------------------------------------------------------- */
// 様子見のまま、これだけ経ったら出す（1日。発生日時から。最後に保存した時刻からにすると、ほかの項目を直しただけで消えてしまうため）
const WATCH_STALE_MS = 86400000;
const REVIEW_STEP = 30;
/* 理由の種類 [キー, 絞り込みのチップの名前（今の項目の名前で作る）] */
const REVIEW_KINDS = [
  ['cause', () => fname('cause') + 'なし'], ['causeType', () => fname('causeType') + '（なし・不明）'], ['result', () => fname('result') + 'なし'],
  ['watch', () => labelOf(RESULTS, 'watch') + 'のまま'], ['downtime', () => fname('downtime') + 'なし'], ['equip', () => fname('equipment') + 'が一覧に無い'],
  ['at', () => fname('occurredAt') + 'が自動'], ['ai', () => 'AIが入れたまま'],
];
/* 項目の短い名前（「設定」で名前を変えていれば、その名前） */
const fname = id => shortLabel(fieldById(id) || builtinOf(id));
/* 設備名が、その場所の一覧（と別の呼び方）にあるか。場所が一覧に無い（消した）ときは、どこかの場所の一覧にあればよい */
function equipKnown(r) {
  if (!String(r.equipment || '').trim()) return false;
  const lists = own(AREAS, r.area) ? [equipOfArea(r.area)] : Object.values(AREAS);
  return lists.some(l => l.some(e => sameEquip(e, r.equipment)));
}
/* AIが入れて、まだ人が確かめていない欄の名前（消した項目は数えない） */
function aiLeft(r) {
  return (r.aiFilled || []).map(id => { if (id === 'symptomTags') return '症状の種類'; const f = fieldById(id); return f && !f.deleted ? shortLabel(f) : ''; }).filter(Boolean);
}
/* 見直し待ちの理由 [{ k, label }]（k は REVIEW_KINDS のキー） */
function reviewReasons(r) {
  const why = [], add = (k, label) => why.push({ k, label });
  if (shown('cause') && !String(r.cause || '').trim()) add('cause', fname('cause') + 'なし');
  if (shown('causeType') && (!r.causeType || r.causeType === '不明')) add('causeType', fname('causeType') + (r.causeType ? 'が「不明」' : 'なし'));
  if (shown('result')) {
    const since = Date.parse(r.occurredAt);
    if (!r.result) add('result', fname('result') + 'なし');
    else if (r.result === 'watch' && Number.isFinite(since) && Date.now() - since >= WATCH_STALE_MS) {
      add('watch', `${labelOf(RESULTS, 'watch')}のまま${Math.floor((Date.now() - since) / 86400000)}日`);
    }
  }
  if (shown('downtime') && !r.downtime) add('downtime', fname('downtime') + 'なし');
  if (!equipKnown(r)) add('equip', fname('equipment') + 'が一覧に無い');
  if ((r.autoFields || []).includes('occurredAt')) add('at', fname('occurredAt') + 'が自動のまま');
  const ai = aiLeft(r);
  if (ai.length) add('ai', 'AIが入れたまま（' + ai.join('・') + '）');
  return why;
}
/* 見直し待ちの記録 [{ r, why }]（場所を選んでいればその場所だけ。古い順）。この画面でその場で直した記録は、理由が無くなっても残す */
const reviewList = () => RECORDS.filter(r => !r.deleted && !r.sample && (!FT.area || r.area === FT.area))
  .map(r => ({ r, why: reviewReasons(r) })).filter(x => x.why.length || FT.touched.has(x.r.id))
  .sort((a, b) => (a.r.occurredAt || '').localeCompare(b.r.occurredAt || '') || String(a.r.id).localeCompare(String(b.r.id)));
function reviewHtml(all) {
  const live = all.filter(x => x.why.length);
  if (!all.length) return '<p class="muted" style="margin-top:16px">見直し待ちの記録はありません。</p>';
  const count = k => live.filter(x => x.why.some(w => w.k === k)).length;
  const fchip = (k, label, n) => `<button type="button" class="chip pill${FT.reason === k ? ' on' : ''}" data-act="ft-reason" data-v="${esc(k)}">${esc(label)}<span class="mono">${n}</span></button>`;
  const list = all.filter(x => !FT.reason || x.why.some(w => w.k === FT.reason) || FT.touched.has(x.r.id));
  let html = `<div class="rvfl" id="rvfl">理由で絞り込む</div><div class="chips rvf" role="group" aria-labelledby="rvfl">${fchip('', 'すべて', live.length)}${REVIEW_KINDS.filter(([k]) => count(k) || FT.reason === k).map(([k, l]) => fchip(k, l(), count(k))).join('')}</div>`;
  html += list.length ? list.slice(0, FT.limit).map(x => reviewItem(x.r, x.why)).join('') : '<p class="muted" style="margin-top:16px">この理由の記録はありません。</p>';
  if (list.length > FT.limit) html += `<button type="button" class="btn sub rvmore" data-act="rv-more">さらに表示（残り ${list.length - FT.limit}件）</button>`;
  return html;
}
/* 1件：記録の行（押すと詳細）・理由の札・その場で押せるチップ（結果・原因の種類・停止時間。理由のある項目と、この画面で直した項目だけ）・
   発生日時が自動のままなら［このままでよい］・［直す］ */
function reviewItem(r, why) {
  const has = k => why.some(w => w.k === k), done = FT.touched.get(r.id) || new Set(), id = esc(r.id);
  const pick = (k, v, label, on) => `<button type="button" class="chip sug${on ? ' on' : ''}" data-act="rv-set" data-id="${id}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}">${esc(label)}</button>`;
  const group = k => (done.has(k) || has(k) || (k === 'result' && has('watch'))
    ? `<div class="rvg"><span class="rvk">${esc(fname(k))}</span>${PICKS[k].map(([v, l]) => pick(k, v, l, r[k] === v)).join('')}</div>` : '');
  return `<div class="rvi">${recCard(r)}
    <div class="rvw">${why.length ? why.map(w => `<span class="badge">${esc(w.label)}</span>`).join('') : '<span class="badge ok">見直し済み</span>'}</div>
    ${group('result')}${group('causeType')}${group('downtime')}
    <div class="chips rva">${has('at') ? `<button type="button" class="chip sug" data-act="rv-set" data-id="${id}" data-k="at" data-v="1">${esc(fname('occurredAt'))}はこのままでよい</button>` : ''}<button type="button" class="chip" data-act="rv-edit" data-id="${id}">直す</button></div>
  </div>`;
}
/* 見直し待ち（と記録の詳細）で押したチップで、その記録のその項目だけを直して保存・同期する（updatedAt を新しくする。必須の検査はしない）。
   k：result・causeType・downtime（v は選んだ値）、at（発生日時はこのままでよい）、ai（AIが入れた欄を確かめた）。
   選んである値を押しても何もしない（この画面では値を消さない。外すときは［直す］から）。
   記録は1件まるごと送るので、この端末が最新を読む前に、ほかの端末が同じ記録の別の項目（原因など）を直していると、端末の古い値で上書きして
   消してしまう。そこで、押して直した項目を記録に覚えておき（_fix。_fixBase はもとにした記録の更新日時）、送る前に共有先の最新の記録を読んで、
   その上に直した項目だけをかけ直してから送る（syncNow・rebaseFix） */
async function reviewFix(id, k, v) {
  const r = RECORDS.find(x => x.id === id);
  if (!r || r.deleted || r.sample) return;
  let msg, op;
  if (k === 'at') {
    if (!(r.autoFields || []).includes('occurredAt')) return;
    op = { k };
    msg = fname('occurredAt') + 'はこのままにしました';
  } else if (k === 'ai') {
    if (!(r.aiFilled || []).length) return;
    op = { k, base: r.aiFilled.slice() };   // 確かめた欄（見えていた印）
    msg = 'AIが入れた欄を、確かめたことにしました';
  } else if (own(PICKS, k) && labelOf(PICKS[k], v)) {
    if (r[k] === v) return;
    op = { k, v, base: r[k] || '' };   // 押す前の値（ほかの端末が同じ項目を直したかを見分ける）
    msg = `「${fname(k)}：${labelOf(PICKS[k], v)}」を保存しました`;
  } else return;
  op.at = new Date().toISOString();
  applyFix(r, op);
  // 覚えるのは共有しているときだけ。「直す」画面の変更をまだ送っていない記録は、今までどおり記録まるごとを送る
  if (GAS_URL && (!r._dirty || r._fix)) { if (!r._fix) { r._fix = []; r._fixBase = r.updatedAt; } r._fix.push(op); }
  r.updatedAt = op.at; r._dirty = true;
  // 同じ記録を記録する画面で直している途中なら、その画面にも同じ値を入れる（あとで保存したときに、押した値を戻さないように）。
  // 開いたときの値（FORM.orig）にも入れる（もう保存した値なので、直している途中の入力には数えない）
  if (FORM && FORM.editId === id) {
    const o = FORM.orig || {};
    if (k === 'at') FORM.autoAt = o.autoAt = false;
    else if (k === 'ai') { FORM.aiFilled = []; o.aiFilled = []; }
    else { FORM[k] = o[k] = v; dropAi(k); o.aiFilled = (o.aiFilled || []).filter(x => x !== k); }
  }
  await dbPut(r);
  if (TAB === 'flow' && !DETAIL && FT.mode === 'review') FT.touched.set(id, (FT.touched.get(id) || new Set()).add(k));
  toast(msg);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  syncNow();
}
/* 直した項目（op）を記録 t にかける。srvAt：共有先の最新の記録にかけ直すときの、その記録の更新日時。
   選ぶ項目は、この端末で押したあとに、ほかの端末が同じ項目を直していれば、そちらを残す（あとから直した方が勝つ。記録の保存と同じ決まり） */
function applyFix(t, op, srvAt) {
  if (op.k === 'at') { if ((t.autoFields || []).includes('occurredAt')) t.autoFields = t.autoFields.filter(x => x !== 'occurredAt'); return; }
  if (op.k === 'ai') { if (t.aiFilled) t.aiFilled = t.aiFilled.filter(x => !op.base.includes(x)); return; }   // 確かめた欄だけ外す
  if (srvAt && (t[op.k] || '') !== op.base && srvAt > op.at) return;
  t[op.k] = op.v;
  if (t.aiFilled) t.aiFilled = t.aiFilled.filter(x => x !== op.k);   // 人が選んだので、AIの印は外す（キーが無い記録には足さない＝サーバーの値を消さない）
}
/* 共有先の最新の記録 raw の上に、この端末で直した項目（_fix）をかけ直して、送る記録 local を作り直す（未送信のまま） */
function rebaseFix(local, raw) {
  const srv = fromWire(raw);
  if (!srv) return;
  keepLocal(srv, raw, local);   // 前の版の Code.gs は新しい項目を返さない（端末の値を使う）
  keepImages(srv, local);
  local._fix.forEach(op => applyFix(srv, op, srv.updatedAt));
  // 更新日時は共有先の記録より新しくする（端末の時計が遅れていても、直した項目が「古い保存」として捨てられないように）
  const at = new Date(Math.max(Date.now(), (Date.parse(srv.updatedAt) || 0) + 1)).toISOString();
  Object.assign(local, srv, { updatedAt: at, _dirty: true, _fix: local._fix, _fixBase: srv.updatedAt });
}
/* 記録を直す画面を開く（詳細の［直す］・見直し待ちの［直す］）。入力中の記録（新しい記録・直している途中の記録）があれば、破棄してよいか聞く。
   同じ記録を直している途中なら、その画面のまま開く（入れた値を記録の値で作り直さない）。
   フローの画面（見直し待ち など）から開いたときは、戻り先を覚えておく（保存してもどる・やめる で、その行へ戻る。backTo） */
function editRecord(id) {
  const r = findRec(id);
  if (!r || r.sample || r.deleted) return;
  const back = TAB === 'flow' ? (DETAIL ? RETURN : backPoint(id)) : null;
  if (FORM && FORM.editId === id && formHasInput()) { if (back) FORM.backTo = back; }
  else {
    if (!discardOk('この記録を直します')) return;
    FORM = formFromRecord(r);
    FORM.backTo = back;
  }
  TAB = 'record'; DETAIL = null; RETURN = null; render(); window.scrollTo(0, 0);
}

let SET_ADD_OPEN = false;
const OPEN_AREAS = new Set();   // 設定の画面で開いている場所（描き直しても閉じない）   // 「入力項目を追加」を開いたままにする（追加のあと描き直しても閉じない）
/* 設定の画面の「追加」 */
function addFromForm(form) {
  const kind = form.dataset.add, key = form.dataset.key || '';
  if (kind === 'field') { addField(); return; }
  const v = form.querySelector('input').value.replace(/\s+/g, ' ').trim();
  if (!v) { toast('名前を入れてください'); return; }
  // 症状の言葉に区切りの文字は使えない（症状の種類はシートで「、」でつなぐので、読み戻すと割れる）
  if (kind === 'symptoms' && /[、,，]/.test(v)) { toast('症状の言葉に「、」「,」は使えません（「・」を使ってください）'); return; }
  const op = kind === 'lines' || kind === 'symptoms' ? { op: 'add', list: kind, value: v }
    : kind === 'areas' ? (OPEN_AREAS.add(v), { op: 'addArea', value: v })
    : kind === 'equip' ? { op: 'addEquip', area: key, value: v }
    : { op: 'addOption', id: key, value: v };
  const ok = editConfig(op);
  if (!ok) { if (ok === false) toast('追加できませんでした（同じ名前があるか、登録できる数の上限です）'); return; }
  toast(`「${v}」を追加しました`);
  // 続けて追加できるよう、同じ入力欄に戻る
  const again = [...document.querySelectorAll('form.sadd')].find(f => f.dataset.add === kind && (f.dataset.key || '') === key);
  if (again) again.querySelector('input').focus();
}
function addField() {
  const label = $('#nfLabel').value.replace(/\s+/g, ' ').trim();
  const type = (document.querySelector('input[name="nfType"]:checked') || {}).value || 'text';
  const options = type === 'choice' ? [...new Set($('#nfOpts').value.split(/[、,，\n]/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean))] : [];
  const unit = type === 'number' ? $('#nfUnit').value.replace(/\s+/g, ' ').trim().slice(0, 10) : '';   // 単位は数字の項目だけ（任意）
  if (GAS_URL && SYNC.configOk === false) { toast('サーバーの Code.gs が前の版のため、入力項目は足せません（先に Code.gs を新しい版にしてください）'); return; }
  if (!label) { toast('項目の名前を入れてください'); return; }
  if (FIELDS.some(f => !f.deleted && f.label === label)) { toast('同じ名前の項目があります'); return; }
  if (type === 'choice' && !options.length) { toast('選択肢を1つ以上入れてください'); return; }
  if (unit && oldRecServer()) { toast(OLD_CFG_MSG); return; }   // 前の版の Code.gs は単位を消してしまう（入れた単位が黙って消えないよう、足す前に知らせる）
  const id = 'x_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  SET_ADD_OPEN = false;
  const ok = editConfig({ op: 'addField', field: { id, label, type, options, unit, required: $('#nfReq').checked } });
  if (ok) toast(`項目「${label}」を追加しました`);
  else if (ok === false) toast('追加できませんでした（入力項目は40個までです）');
}
/* 設定の画面のボタン（消す・並べ替え・名前・必須・使う/使わない） */
function onSettingsAct(act, t) {
  const v = t.dataset.v, f = t.dataset.id ? fieldById(t.dataset.id) : null;
  const keep = '（これまでの記録は消えません）';
  // 前の版の Code.gs は新しい4つの項目を知らない：名前・必須・使う／使わない・並べ替え（動かす項目か、となりが新しい項目）を変えても、同期で黙って戻るので止めて知らせる
  if (oldRecServer() && ((f && NEW_BUILTIN.includes(f.id) && /^cf-(rename|req|hide|show|restore)$/.test(act))
    || (act === 'cf-move' && t.dataset.list === 'fields' && [v, neighborOf(CONF, 'fields', v, +t.dataset.dir)].some(x => NEW_BUILTIN.includes(x))))) { toast(OLD_CFG_MSG); return; }
  switch (act) {
    case 'cf-move': {
      const target = neighborOf(CONF, t.dataset.list, v, +t.dataset.dir);
      if (target != null) editConfig({ op: 'move', list: t.dataset.list, value: v, dir: +t.dataset.dir, target });
      break;
    }
    case 'cf-remove': if (confirm(`「${v}」を消しますか？${keep}`)) editConfig({ op: 'remove', list: t.dataset.list || t.dataset.key, value: v }); break;
    case 'cf-rm-area': {
      const ar = CONF.areas.find(x => x.name === v);
      if (!ar) break;
      if (CONF.areas.length <= 1) { toast(shortLabel(fieldById('area')) + 'は1つ以上必要です'); break; }
      if (confirm(`「${v}」と、その${shortLabel(fieldById('equipment'))}の候補${ar.equip.length}件を消しますか？${keep}`)) editConfig({ op: 'removeArea', value: v });
      break;
    }
    case 'cf-rm-equip': if (confirm(`「${t.dataset.key}」の「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeEquip', area: t.dataset.key, value: v }); break;
    case 'cf-rm-opt': if (confirm(`選択肢「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeOption', id: t.dataset.key, value: v }); break;
    case 'cf-rename': {
      if (!f) break;
      const name = prompt('新しい名前（20文字まで）', f.label);
      const nv = name == null ? '' : name.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!nv || nv === f.label) break;
      if (FIELDS.some(x => x !== f && !x.deleted && x.label === nv)) { toast('同じ名前の項目があります'); break; }
      editConfig({ op: 'setField', id: f.id, label: nv });
      break;
    }
    case 'cf-req': if (f) editConfig({ op: 'setField', id: f.id, required: !f.required }); break;
    case 'cf-unit': {   // 数字の項目の単位（空にすると単位なし）
      if (!f || f.type !== 'number') break;
      if (oldRecServer()) { toast(OLD_CFG_MSG); break; }
      // 記録には数字だけが残るので、単位を変えると、これまでの記録の値も新しい単位で表示し、AIにも送る。値のある記録があれば、そう知らせる
      // （書きまちがいを直すなら変えてよい。計器が変わって値の大きさが変わるなら、新しい項目を足してもらう）
      const n = f.unit ? RECORDS.filter(r => !r.deleted && String((r.extra || {})[f.id] || '').trim()).length : 0;
      const u = prompt('単位（10文字まで。空にすると単位なし）' + (n ? `\nこれまでの記録（${n}件）の値も、この単位で表示し、AIにも送ります。計器が変わって値の大きさが変わるときは、単位を変えずに新しい項目を足してください` : ''), f.unit || '');
      const nu = u == null ? null : u.replace(/\s+/g, ' ').trim().slice(0, 10);
      if (nu == null || nu === (f.unit || '')) break;
      editConfig({ op: 'setField', id: f.id, unit: nu });
      break;
    }
    case 'cf-add-alias': {   // 設備の別の呼び方を足す（v：設備の正式名）
      if (oldRecServer()) { toast(OLD_CFG_MSG); break; }
      const name = prompt(`「${v}」の別の呼び方（20文字まで。現場でそう呼んでいる名前）`, '');
      const w = name == null ? '' : name.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!w) break;
      const why = aliasProblem(v, w);
      if (why) { toast(why); break; }
      const ok = editConfig({ op: 'addAlias', equip: v, value: w });
      if (ok) toast(`「${w}」を「${v}」の別の呼び方にしました`);
      else if (ok === false) toast('足せませんでした（呼び方は1つの' + shortLabel(fieldById('equipment')) + 'に10個まで、呼び方のある' + shortLabel(fieldById('equipment')) + 'は60個までです）');
      break;
    }
    case 'cf-rm-alias': if (confirm(`「${t.dataset.key}」の呼び方「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeAlias', equip: t.dataset.key, value: v }); break;
    case 'cf-hide': if (f && confirm(`「${f.label}」を、記録する画面に出さないようにしますか？（これまでの記録の値は残ります。「使う」で戻せます）`)) editConfig({ op: 'removeField', id: f.id }); break;
    case 'cf-del-field': if (f && confirm(`項目「${f.label}」を消しますか？（これまでの記録の値は残ります。「消した項目」から元に戻せます）`)) editConfig({ op: 'removeField', id: f.id }); break;
    case 'cf-show': case 'cf-restore': if (f) editConfig({ op: 'restoreField', id: f.id }); break;
  }
}

  const partsBlock = (r.parts || []).map((p, i) => `<div>${esc(p.name) || '<span class="muted">部品名なし</span>'}${p.model ? `　<b>型式：${esc(p.model)}</b>` : ''}

    + FIELDS.filter(f => isCustom(f) && (r.extra || {})[f.id]).map(f => xrow(`${esc(f.label)}${f.deleted ? '<br><span class="muted">（使っていない項目）</span>' : ''}`,

  const prev = r.relatedId ? findRec(r.relatedId) : null, rel = labelOf(RELATIONS, r.relation);

  const nextBlock = next.length ? `<div class="h3">この記録につながる記録（${next.length}件）</div>${next.map(x => recCard(x, false, labelOf(RELATIONS, x.relation))).join('')}` : '';

function recFromChat(m) {

  if (!discardOk('新しく書きます')) return;
  const c = chatOf(m), msgs = c ? c.messages : CHAT;
  const base = m.kind !== 'lookup' ? m : msgs.slice(0, Math.max(0, msgs.indexOf(m))).reverse().find(x => x && x.role === 'bot' && x.kind !== 'lookup') || null;
  FORM = newForm(base ? base.prefill : undefined);
  if (base) {
    // チャットで聞いた内容（写真のときは、ひとこと。無ければ写真から読み取った探す言葉）も、文章からの下書きのときにAIに渡す
    FORM.context = String((base.photo ? base.text || base.query : base.query) || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    // 送った写真も記録に付ける（履歴から開いたチャットは小さい写真だけなので、それを付ける）
    if (base.photo) FORM.photos = [{ id: newId('p'), data: base.photo.data || base.photo.thumb, thumb: base.photo.thumb, driveId: null }];
    // 写真から読み取ったこと（読み取りが終わっていて、確かさが low でないときだけ）と、読めた文字からの型式の候補
    const v = base.photo && base.vision && base.vision.state === 'done' ? base.vision.data : null;
    if (v && v.confidence !== 'low') {
      FORM.photoText = [v.abnormality ? '見えた異常：' + v.abnormality : '', v.texts.length ? '読めた文字：' + v.texts.join('、') : ''].filter(Boolean).join('／').slice(0, 300);
      FORM.modelHints = modelCandidates(v.texts);
    }
    // 聞き直しの質問に答えていれば、その答えもチャットで聞いた内容に足す（300字まで）
    const qa = narrowAnswers(base);
    if (qa.length) FORM.context = (FORM.context + '／AIの質問への答え：' + qa.map(x => x.q + '→' + x.a).join('、')).slice(0, 300);
    // このメッセージのAIの答え（AI履歴の ID）も記録に残す：作業手順①、なければ いちばん新しい聞き直し、なければ 対処案

    // 確かめて違った候補は「効かなかった対処」へ（人が確かめたことなので、AIが入れた欄にはしない）

    const lk = msgs.filter(x => x && x.kind === 'lookup' && x.look && x.look.state === 'done' && x.look.historyId).pop();
    if (lk) FORM.aiHistoryId = lk.look.historyId;
  }
  FORM.chatId = (c || {}).id || '';   // 保存したら、このチャットに「記録済み」を付ける
  TAB = 'record'; DETAIL = null; render(); window.scrollTo(0, 0);
}

  // （「前回の号機（違えば押して直す）」やAIの印を見て押し直したときに、値が消えないように）

      if (ta) { ta.value = F.symptom; ta.focus(); }
      unmarkAi('symptom');
      if (tags.length < MAX_TAGS) tags.push(v); else toast('症状の種類は' + MAX_TAGS + 'つまでです（文には足しました）');
    }
    dropAi('symptomTags');   // 人が選び直した種類は、AIの印を外す
    const st = $('#symTags');
    if (st) st.innerHTML = symTagsHtml(F);
    updateHint();
    return;
  }
  else if (kind === 'when') {   // 発生日時のチップ（いま・○分前）。触ったので「人が入れた」にする（autoFields に入れない）
    F.occurredAt = localStamp(new Date(Date.now() - (+v || 0) * 60000));
    F.autoAt = false;
    const d = $('#fDate');
    if (d) d.value = F.occurredAt;
    updateHint();
    return;
  }
  const y = window.scrollY;
  renderForm();
  window.scrollTo(0, y);
}
/* 記録する画面の文字の欄と、FORM の項目。fDraft：文章からの下書き（13-2）の文章。描き直しても消えないよう、FORM に持つ */
const FORM_INPUTS = { fDate: 'occurredAt', fAuthor: 'author', fEquip: 'equipment', fSym: 'symptom', fCause: 'cause', fAction: 'action', fFailed: 'failed', fDraft: 'draftText', fLookup: 'lookupNote' };
/* かな漢字変換の途中の欄（AIの結果で描き直すときに、その欄の値は書き換えない） */
let COMPOSING = null;
document.addEventListener('compositionstart', e => { COMPOSING = e.target; });
document.addEventListener('compositionend', () => { COMPOSING = null; });
document.addEventListener('focusout', e => { if (e.target === COMPOSING) COMPOSING = null; });
document.addEventListener('input', e => {
  if (TAB !== 'record' || DETAIL || !FORM) return;
  const t = e.target;
  const map = FORM_INPUTS;
  // 人が直した欄は、AIの印を外す
  if (map[t.id]) {
    FORM[map[t.id]] = t.value;
    unmarkAi(map[t.id]);
    if (t.id === 'fDate') FORM.autoAt = false;   // 発生日時を触った →「人が入れた」（autoFields に入れない）
    if (t.id === 'fEquip') document.querySelectorAll('#eqChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === canonEquip(t.value)));
    if (t.id === 'fEquip' || t.id === 'fSym' || t.id === 'fDate') updateHint();   // 似たトラブル・設備の近い候補・7日以内の同じトラブル
  } else if (t.dataset.pf && FORM.parts[+t.dataset.i]) {
    FORM.parts[+t.dataset.i][t.dataset.pf] = t.value;
    unmarkAi('parts');
  } else if (t.dataset.xf) {
    FORM.extra[t.dataset.xf] = t.value;
    unmarkAi(t.dataset.xf);
  }
});
/* 設定の画面の「追加」（号機・場所・設備・症状の言葉・選択肢・入力項目） */
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-add]');
  if (!form) return;
  e.preventDefault();
  addFromForm(form);
});
document.addEventListener('toggle', e => {
  const el = e.target;
  if (!el.classList) return;
  if (el.classList.contains('addf')) SET_ADD_OPEN = el.open;
  if (el.classList.contains('dguide')) DRAFT_GUIDE_OPEN = el.open;
  if (el.classList.contains('rawd')) RAW_OPEN = el.open ? DETAIL : null;
  if (el.classList.contains('sarea')) { if (el.open) OPEN_AREAS.add(el.dataset.area); else OPEN_AREAS.delete(el.dataset.area); }
  if (el.classList.contains('rkmore')) { const m = CHAT[+el.dataset.mi]; if (m && m.moreOpen !== el.open) { m.moreOpen = el.open; chatChanged(m, true); } }   // 「ほかの候補」の開け閉めは吹き出しに覚える
}, true);
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#chatIn'), photo = PENDING;
  if (curMode() === 'lookup') {   // 調べもの（Web）：文字だけ送る（撮った写真は残しておく）。オフラインなら送らずに知らせる（入れた文字は残す）
    if (!inp.value.trim() || notReady()) return;
    if (!navigator.onLine) { toast('オフラインのため、Webで調べられません'); return; }
    sendChat(inp.value, null, 'lookup');
    inp.value = '';
    return;
  }
  if (!inp.value.trim() && !photo) return;
  if (notReady()) return;
  PENDING = null;
  sendChat(inp.value, photo);
  inp.value = '';
});
$('#camBtn').addEventListener('click', openCamera);
$('#camIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  toast('写真を準備しています…');
  try {
    PENDING = await makePhoto(f, true);
    MODE = 'search';   // 写真は「探す」で送る（「調べる」の間に［撮り直す］で撮ったときも、写真が見えるように）
    renderCam();
    $('#toast').classList.remove('show');   // 入力欄の上に写真が出たので「準備しています」は消す
  } catch (err) { toast(err.message); }
});
$('#syncChip').addEventListener('click', () => {
  if (!GAS_URL) { toast('共有の設定がまだなので、この端末の中だけに保存しています'); return; }
  if (!KEY || SYNC.state === 'key') { askKey(); return; }
  syncNow(true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#lb').classList.remove('show'); closeDrawer(true); } });
async function deleteRecord(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  if (!confirm(GAS_URL ? 'この記録を消しますか？（共有しているので、全員の画面から消えます）' : 'この記録を消しますか？')) return;
  r.deleted = true; r.updatedAt = new Date().toISOString(); r._dirty = true;
  delete r._fix; delete r._fixBase;   // 消した記録を、共有先の（消していない）記録の上に作り直して送らない
  await dbPut(r);
  const b = RETURN && RETURN.tab === TAB ? RETURN : null;
  DETAIL = null; RETURN = null;
  toast('消しました');
  render();
  if (b) goBackTo(b);   // フローの一覧から開いた記録：一覧のその位置へ戻る
  syncNow();
}

/* =========================================================
   17. サンプル（使い始めから中身があるように。保存も送信もしません）
   外装工程の点検項目をもとにした例です
   ========================================================= */
function buildSamples() {
  const rows = [
    // [何日前, ライン, 場所, 設備, 症状, 原因, 対処, 交換部品[名前, 型式]]
    [2, '3号ライン', '充填部', 'チャック開口吸盤', '袋を吸わず、チャックが開かない', '吸盤の破れ', '吸盤を新品に交換', [['チャック開口吸盤', 'SP-VP15']]],
    [9, '2号ライン', '充填部', 'チャック開口吸盤', 'チャックが開口しない（袋を吸着しない）', '吸盤の破れ（亀裂）', '吸盤を交換', [['チャック開口吸盤', 'SP-VP15']]],
    [16, '4号ライン', '充填部', 'チャック開口吸盤', '袋の吸着が弱い', '真空ホースの抜け', 'ホースを差し直して真空圧を確認', []],
    [27, '3号ライン', '充填部', 'チャック開口吸盤', '袋を吸わない', '', '吸盤を清掃して様子を見た', []],
    [5, '3号ライン', '充填部', 'チャック開口鉄爪', 'チャックが開かない', 'レギュレーター圧力が60kPa未満', 'レギュレーターを60kPa以上に調整', []],
    [12, '5号ライン', '充填部', 'アーム爪', '袋を掴めず落下する', 'アーム爪の開き量不足', '爪の開き量を調整', []],
    [20, '2号ライン', '充填部', 'トップシール', 'シール目が付かない（シール不良）', 'ヒーターカートリッジの断線', 'ヒーターカートリッジを交換', [['ヒーターカートリッジ', 'SP-HC200']]],
    [7, '4号ライン', '製袋部', 'ボビン', 'フィルムが蛇行する', 'ボビンブレーキの効きが弱い', 'ボビンブレーキを調整', []],
    [25, '3号ライン', '製袋部', '後サーボギア', '後サーボギアから異音', 'グリス切れ', 'グリスアップ', []],
    [31, '2号ライン', '製袋部', 'Rカット', 'Rカットの切れが悪く、異音がする', '刃の摩耗', 'Rカット刃を交換', [['Rカット刃', 'SP-RC30']]],
    [14, '5号ライン', '製袋部', '熱電対', 'シール温度が上がらない', '熱電対の断線', '熱電対を交換', [['熱電対', 'SP-TC-K']]],
    [10, '3号ライン', '均しコンベア', 'タイミングベルト', 'ベルトが蛇行して異音がする', 'ベルトの摩耗', 'タイミングベルトを交換', [['タイミングベルト', 'SP-TB600']]],
    [3, '4号ライン', '化粧箱機', '真空ポンプ', '箱立て吸引が弱い（40kPa未満）', 'フィルターの目詰まり', 'フィルターを清掃', []],
    [18, '2号ライン', '化粧箱機', 'テープユニット', 'テープが貼れない', 'テープの通し方が違う', 'テープを通し直した', []],
    [22, '5号ライン', '外箱機', 'ケースシーラー', 'テープが切れる', 'テープの通し方が悪い', 'テープを通し直して高さを確認', []],
  ];
  const base = new Date();
  return rows.map(([days, line, area, equipment, symptom, cause, action, parts], i) => {
    const d = new Date(base.getTime() - days * 86400000);
    d.setHours(9 + (i % 8), (i * 17) % 60, 0, 0);
    const occurredAt = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return { id: 's_' + pad(i + 1), sample: true, occurredAt, line, area, equipment, symptom, cause, action, author: 'サンプル',
      parts: parts.map(([name, model]) => ({ name, model, photo: null })), photos: [], deleted: false };
  });
}

/* =========================================================
   18. 起動
   ========================================================= */
(async function boot() {
  SAMPLES = buildSamples();
  try {
    await dbOpen();
    RECORDS = (await dbAll()) || [];
    META.author = (await metaGet('author')) || '';
    META.lastLine = (await metaGet('lastLine')) || '';
    const ss = await metaGet('showSamples');
    META.showSamples = ss !== false;
    META.oldRecNoted = (await metaGet('oldRecNoted')) === true;
    KEY = (await metaGet('key')) || '';
    const cfg = await metaGet('config');
    if (cfg && typeof cfg === 'object') {
      CFG.base = cfg.base || null;
      CFG.rev = Math.max(0, Math.floor(Number(cfg.rev)) || 0);
      CFG.pending = Array.isArray(cfg.pending) ? cfg.pending : [];
      // 「端末内のみ」で試していた設定は、共有を始めたら、共有先にまだ設定が無いときだけ最初の設定として送る
      if (GAS_URL && cfg.local && CFG.base) { CFG.pending = [{ op: 'seed', config: CFG.base }]; CFG.base = null; CFG.rev = 0; }
    }
    applyConfig();
    // チャットの履歴（12-2。記録とは別の保存 trouble_log_chats から。開けなかったときは空）。壊れたものは使わない。開いたときは、いつも新しいチャット（はじめの画面）から
    CHATS = ((await idb('chats', 'readonly', s => s.getAll())) || []).map(chatFromStore).filter(Boolean).sort(byUpdated);
    setCur(null);
    capChats();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('この端末ではデータを保存できません（プライベートブラウズ等）');
  }
  document.body.inert = false;   // 版を上げるのを、ほかのタブを閉じるまで待っていた間は押せなかった（4. の onblocked。いまは版を上げないので起きない）。読み終えたので戻す
  BOOTED = true;                 // ここからチャットを送れる（inert が効かない古い iPhone でも、送るのはここまで待たせる）
  FORM = newForm();
  render();
  syncNow();
  window.addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    keepAwake();   // 調べものを待っている途中に戻った：画面を消さない印を付け直す
    // 開いたままの記録する画面に戻ったとき：何も入れていなければ、自動の発生日時をいまにする（描き直さずに、日時の欄だけ）
    if (TAB === 'record' && !DETAIL && refreshAutoAt()) { const d = $('#fDate'); if (d) d.value = FORM.occurredAt; updateHint(); }
    if (Date.now() - lastSyncTry > 15000) syncNow();
  });
  setInterval(() => { if (!document.hidden) syncNow(); }, AUTO_SYNC_MS);
})();
</script>
