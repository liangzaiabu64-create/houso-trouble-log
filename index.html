<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トラブル記録">
<title>トラブル記録（包装工程）</title>
<!--
  トラブル記録（包装工程）
  ・その日のトラブルを記録する（設備・場所・症状・原因・対処・交換部品の型式と写真）
  ・記録が増えると、同じ設備の同じトラブルが自動で「フロー」にまとまる
  ・起きていることを文章で送ると、過去の記録から原因と対処を探す（チャット検索）
  ・その場で撮った写真も送れる（AIの設定があれば、写真から設備・見える異常・型式を読み取って探す）
  保存：端末内（IndexedDB）に控えを持ち、GAS_URL を設定するとスプレッドシート＋ドライブで共有する
-->
<style>
  /* 見た目の決まり：温かみのある白地・濃い文字・強調色は1色（押すボタンと「まず確認」だけ）
     文字は読みやすさ重視の UD フォント（BIZ UDPゴシック）。見出しは明朝、型式や日時は等幅 */
  :root{
    --bg:#F5F3EE; --card:#FFFFFF; --ink:#1E1D1A; --ink2:#3B3934; --ink3:#5B5850; --ink4:#6B675E;
    --line:rgba(30,28,24,.12); --line2:rgba(30,28,24,.22);
    --fill:#ECE8DF; --tag:#E9E4D8; --me:#E9E5DB; --soft:#F2EFE8;
    --accent:#A94E28; --accent-soft:#F4E6DD;
    --ok:#3F7D4E; --ok-soft:#E4EFE6; --warn:#8A5A12; --warn-soft:#F7EBD7; --ng:#A93A2F; --ng-soft:#F6E1DC;
    --r:14px; --tabh:64px; --side:232px;
    --sans:'BIZ UDPGothic','BIZ UDPゴシック','Hiragino Sans','Noto Sans JP','Yu Gothic UI',Meiryo,sans-serif;
    --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
  button,input,textarea{font:inherit;color:inherit}
  input,textarea{font-size:16px} /* 16px未満だと iPhone で入力時に画面が拡大される */
  button{cursor:pointer}
  b,strong{font-weight:700}
  svg{flex:none}
  :focus-visible{outline:3px solid rgba(169,78,40,.5);outline-offset:2px}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .mono{font-family:var(--mono);font-weight:500}

  /* ---------- 枠組み ---------- */
  .top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:0 16px;padding-top:env(safe-area-inset-top)}
  .top .in{max-width:780px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
  .brand{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink3);margin-left:8px}
  .sync{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line2);border-radius:999px;
    padding:0 12px;background:var(--card);font-size:13px;white-space:nowrap}
  .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#9C9A92;flex:none}
  .sync.ok::before{background:var(--ok)}
  .sync.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:700}
  .sync.warn::before{background:#C58A1E}
  .sync.err{background:var(--ng-soft);border-color:transparent;color:var(--ng);font-weight:700}
  .sync.err::before{background:var(--ng)}
  main{max-width:780px;margin:0 auto;padding:20px 20px calc(var(--tabh) + 32px + env(safe-area-inset-bottom))}
  body.chat main{padding-bottom:calc(var(--tabh) + 100px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabs .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tabs button{border:0;background:none;min-height:var(--tabh);padding:8px 4px;font-size:13px;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .tabs .ic{display:flex}
  .tabs button.on{color:var(--accent);font-weight:700}
  .chatbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:15;display:none;
    padding:8px 12px 12px;background:var(--bg)}
  body.chat .chatbar{display:block}
  .chatbar form{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;
    background:var(--card);border:1px solid var(--line2);border-radius:24px;box-shadow:0 1px 3px rgba(30,28,24,.06)}
  .chatbar form:focus-within{border-color:var(--ink3)}
  .chatbar input{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;padding:0}
  .chatbar form button{flex:none;width:44px;height:44px;border:0;border-radius:50%;padding:0;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center}
  /* 写真を撮って送る（入力欄の左のカメラ・送る前の確認） */
  .crow{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .crow form{flex:1;min-width:0;margin:0}
  .cambtn{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink2);
    padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(30,28,24,.06)}
  .camprev{max-width:780px;margin:0 auto 8px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;
    background:var(--card);border:1px solid var(--line);border-radius:16px}
  .camprev[hidden]{display:none}
  .camprev img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;display:block}
  .camprev .ct{flex:1;min-width:0;font-size:13px;line-height:1.55;color:var(--ink3)}
  .camprev .ct b{display:block;color:var(--ink);font-size:14px}
  .camprev .x2{width:44px;flex:none}
  body.chat.campending main{padding-bottom:calc(var(--tabh) + 180px + env(safe-area-inset-bottom))}

  /* ---------- 共通部品 ---------- */
  .ttl{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.4;margin:4px 0 6px}
  .sub{margin:0 0 8px;color:var(--ink3);font-size:14px;line-height:1.7}
  .muted{color:var(--ink4)}
  .badge{display:inline-block;font-size:12px;font-weight:400;padding:1px 8px;border-radius:6px;background:var(--tag);color:#4A463F;
    margin-left:6px;vertical-align:2px;line-height:1.6}
  .badge.sample{background:var(--tag);color:#4A463F}
  .badge.dirty{background:var(--warn-soft);color:var(--warn);font-weight:700}
  .btn{border:0;border-radius:12px;padding:0 18px;font-weight:700;min-height:48px;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.pri{background:var(--accent);color:#fff;width:100%;min-height:54px;font-size:17px}
  .btn.sub{background:var(--card);border:1px solid var(--line2)}
  .btn.danger{background:var(--card);border:1px solid var(--ng);color:var(--ng)}
  .btn.sm{min-height:44px;padding:0 14px;font-size:14px}
  .btn.dash{border-style:dashed;background:transparent;color:var(--ink2);font-weight:400}
  .btnrow{display:flex;gap:8px;margin-top:16px}
  .btnrow .btn{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px;font-size:15px;
    display:inline-flex;align-items:center;gap:8px;line-height:1.4}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .chip.sug{background:var(--fill);border-color:transparent;min-height:40px;font-size:14px;border-radius:10px}
  .chip.sug.on{background:var(--ink);color:#fff}
  .chip.pill{border-radius:999px;min-height:40px;font-size:14px}
  .chips.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .chips.grid4 .chip{justify-content:center;min-height:48px;font-size:16px;padding:0 4px}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;margin:0 0 16px;
    font-weight:700;font-size:14px;line-height:1.7}
  .banner.ok{background:var(--ok-soft);color:#2F5E3B}
  .banner .btn{margin-top:8px}
  .toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;
    max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .lb{position:fixed;inset:0;z-index:60;background:rgba(20,19,18,.92);display:none;align-items:center;justify-content:center;padding:16px}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:8px}

  /* ---------- 記録の一覧（行） ---------- */
  .rc{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--line);padding:14px 4px;margin:0;border-radius:0}
  .rc:hover{background:rgba(30,28,24,.03)}
  .rc.hl{background:var(--accent-soft)}
  .rc .t{font-weight:700;font-size:16px;line-height:1.5}
  .rc .m{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--ink3);line-height:1.6}
  .rc .m .badge{margin-left:0}
  .rc .a{font-size:14px;line-height:1.6;color:var(--ink2)}

  /* ---------- 探す（会話） ---------- */
  .msg{display:flex;margin:20px 0;scroll-margin-top:76px}
  .msg.me{justify-content:flex-end}
  .bub{max-width:86%;min-width:0}
  .msg.me .bub{background:var(--me);padding:12px 16px;border-radius:18px 18px 6px 18px;white-space:pre-wrap;line-height:1.6}
  .msg.me .bub.img{padding:6px;width:232px}
  .msg.me .bub.img .ct{padding:6px 10px 4px}
  .chatimg{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:13px 13px 4px 13px;background:var(--fill);cursor:zoom-in}
  .msg.bot .bub{width:100%;max-width:100%;font-size:16.5px;line-height:1.8}
  .hello{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.4;margin:12px 0 8px}
  .hello-sub{margin:0;color:var(--ink3);font-size:15px;line-height:1.75}
  .found{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink3);margin-bottom:10px}
  .found::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .found .mono{font-size:13px;color:var(--ink4)}
  .lead{margin:0}
  .tip{margin-top:16px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:6px}
  .tipk{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .tipv{font-size:20px;line-height:1.5}
  .tipa{font-size:16px;line-height:1.7}
  .tip .pchips{margin-top:4px}
  .h3{font-size:13px;font-weight:700;color:var(--ink3);margin:24px 0 6px;letter-spacing:.04em;line-height:1.5}
  .bd{display:flex;flex-direction:column;gap:14px;margin-top:10px}
  .bd-row{display:flex;flex-direction:column;gap:6px}
  .bd-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px;line-height:1.5}
  .bd-top .mono{font-size:14px;white-space:nowrap}
  .bd-bar{height:6px;border-radius:3px;background:#E9E5DB;overflow:hidden}
  .bd-bar i{display:block;height:100%;border-radius:3px;background:#8C877C}
  .bd-row:first-child .bd-bar i{background:var(--accent)}
  .bd-act{font-size:14px;line-height:1.6;color:var(--ink2)}
  /* AIの対処案 */
  .chip.aichip{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-height:48px;padding:0 18px}
  .aibox{margin-top:20px;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    display:flex;flex-direction:column;gap:12px;line-height:1.7}
  .aibox .h3{margin:4px 0 0}
  .aibox .chips{margin-top:0}
  .aibox.err{border-color:transparent;background:var(--ng-soft);color:#5C1F18;font-size:15px}
  .aih{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;line-height:1.5}
  .aih svg{color:var(--accent)}
  .aibox.err .aih{color:var(--ng)}
  .aibox.err .aih svg{color:var(--ng)}
  .aih .badge{margin-left:auto}
  .aibox.busy .aih svg{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .ais{font-size:16px;line-height:1.8}
  .aisteps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:16px}
  .aisteps li{counter-increment:st;position:relative;padding-left:42px;margin:0;font-size:16px;line-height:1.7}
  .aisteps li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .aisteps li>b{font-size:17px}
  .air{font-size:13px;color:var(--ink3);margin-top:2px}
  .aigen{margin:0;padding-left:20px;font-size:15px;line-height:1.8;color:var(--ink2)}
  .aisafe{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:#3D2A12;font-size:15px;line-height:1.7}
  .aisafe svg{margin-top:3px}
  .aifoot{font-size:12px;line-height:1.7;color:var(--ink4)}
  /* 写真から読み取ったこと */
  .vbox{margin:0 0 18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    display:flex;flex-direction:column;gap:10px;line-height:1.7}
  .vbox .chips{margin-top:0}
  .vbox.err{border-color:transparent;background:var(--ng-soft);color:#5C1F18;font-size:15px}
  .vbox.err .aih,.vbox.err .aih svg{color:var(--ng)}
  .vbox.plain{background:transparent;border-style:dashed;font-size:15px;color:var(--ink2)}
  .vbox.busy .aih svg{animation:pulse 1.4s ease-in-out infinite}
  .vrow{display:flex;align-items:baseline;gap:4px;font-size:16px;line-height:1.7}
  .vrow .k{flex:none}
  .vrow .v{flex:1;min-width:0;overflow-wrap:anywhere}
  .vrow .pchips{margin-top:0}
  .vretake{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.7;color:var(--ink2)}
  .vq{font-size:13px;color:var(--ink3);margin:-4px 0 12px;overflow-wrap:anywhere}

  /* ---------- フロー ---------- */
  .flow{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
  .flow>summary{list-style:none;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .flow>summary::-webkit-details-marker{display:none}
  .flow[open]>summary{border-bottom:1px solid var(--line)}
  .fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .fa{font-size:13px;color:var(--ink3);line-height:1.5}
  .fa b{color:var(--ink)}
  .fc{font-family:var(--mono);font-weight:500;font-size:14px;white-space:nowrap}
  .fs{font-weight:700;font-size:17px;line-height:1.5}
  .fm{font-size:14px;line-height:1.6;color:var(--ink2)}
  .ftbody{padding:14px 16px 16px}
  .ft{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.6}
  .ft .ft{margin:8px 0 0 10px;padding-left:16px;border-left:1.5px solid #D6D1C4;gap:10px}
  .k{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;margin-right:8px;vertical-align:1px;line-height:1.6;
    background:var(--tag);color:var(--ink2)}
  .k.cau{background:var(--ink);color:#fff}
  .cnt{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink3);margin-left:8px;white-space:nowrap}
  .pchips,.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--soft);border-radius:8px;padding:4px 10px;line-height:1.5}
  .pchip .mono{font-size:12.5px}
  .rchip{min-height:36px;font-family:var(--mono);font-weight:500;font-size:12.5px;border:1px solid var(--line2);background:var(--card);
    border-radius:10px;padding:0 10px;color:var(--ink);display:inline-flex;align-items:center}
  .rchip.hl{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;margin:10px 0 2px}
  .seg button{border:0;background:none;border-radius:9px;min-height:40px;padding:0 16px;font-weight:700;font-size:14px;color:var(--ink3)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(30,28,24,.12)}
  .linkbtn{border:0;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0;
    font-size:14px;margin-top:8px}

  /* ---------- 詳細 ---------- */
  .steps{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:16px 0}
  .step{display:flex;gap:4px;align-items:baseline;padding:10px 0}
  .step .k{flex:none}
  .step .v{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px;line-height:1.7}
  .arrow{color:#B0ACA2;padding-left:16px;line-height:1;font-size:14px}
  .meta{font-size:13px;color:var(--ink3)}

  /* ---------- 入力 ---------- */
  .f{margin:22px 0}
  .l{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  .req{color:var(--accent);font-size:12px;font-weight:400;margin-left:6px}
  .inp{width:100%;border:1px solid var(--line2);border-radius:12px;padding:0 14px;min-height:48px;background:var(--card)}
  .inp:focus{border-color:var(--ink3)}
  textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.6}
  .part{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px 36px;gap:6px;align-items:center;margin-bottom:8px}
  .part .inp{padding:0 12px}
  .part input[data-pf="model"]{font-family:var(--mono)}
  .x2{border:0;background:none;color:var(--ink3);font-size:18px;min-height:44px;padding:0}
  .photos{display:flex;flex-wrap:wrap;gap:10px}
  .ph{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:var(--fill);padding:0;flex:none}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph.sm{width:48px;height:48px;border-radius:12px}
  .ph .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;
    background:rgba(20,19,18,.66);color:#fff;font-size:12px;line-height:26px;padding:0}
  .addph{width:96px;height:96px;border:1.5px dashed var(--line2);border-radius:14px;background:var(--card);
    color:var(--ink2);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
  .addph.sm{width:48px;height:48px;border-radius:12px}
  .hint{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:14px 16px;
    border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .hint .ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

<script>
'use strict';

/* 文字（BIZ UDPゴシックなど）は、画面が出てから読み込む。電波が弱くても表示を待たせず、読めなければ端末の文字で表示する */

  l.href = 'https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500&family=Shippori+Mincho:wght@600&display=swap';
  document.head.appendChild(l);
});

/* =========================================================
   1. 設定
   空のままだと「端末内のみ」で動きます（試用向け）。
   チームで共有するには「セットアップ手順.md」に沿って
   Apps Script の URL を貼り付けてください。
   ========================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2DcyGmKKJRNw_xKEVx6Ay-u89Q2dJDc-sW9_ZYdzXLrjDn_PEmBdhKFRpRlpsb_8/exec';

/* =========================================================
   2. マスタ（外装工程 日常点検チェックリストの言葉に合わせています）
   ここにあるのは「最初の値」です。号機（ライン）・場所・設備・症状の言葉・入力項目は、
   アプリの「設定」（右上）でいつでも追加・削除できます。共有しているときは、
   スプレッドシートのシート「設定」に保存され、チーム全員のアプリに反映されます（4-2）

const DEFAULT_LINES = ['2号ライン', '3号ライン', '4号ライン', '5号ライン'];
const DEFAULT_AREAS = {
  '製袋部': ['ボビン', 'ボビンブレーキ', 'フィルム繰出し', '熱電対', 'ヒーターカートリッジ', '後サーボローラー', '後サーボギア',
    'Rカット', '駆動チェーン', '減速機チェーン', 'シール', 'メクリ吸引', '受渡し吸引', 'テンション', 'チャック繰出しテンションバー', '印字検査装置'],
  '充填部': ['チャック開口吸盤', 'チャック開口鉄爪', 'レギュレーター', '第3開口吸盤', '案内ベラ', 'アーム爪', '6工程ユニット',

  '均しコンベア': ['タイミングベルト', 'コンベア'],
  '化粧箱機': ['真空ポンプ', 'テープユニット', 'シート吸引', '箱立て吸引', '移載チャック'],
  '外箱機': ['真空ポンプ', 'ケースシーラー', '集積', 'シート吸引', '積付'],
};
const AREA_ALIASES = { '製袋部': ['製袋'], '充填部': ['充填', '充てん'], '均しコンベア': ['均し', 'ならし'], '化粧箱機': ['化粧箱'], '外箱機': ['外箱'] };
const EQUIP_ALIASES = {
  'チャック開口吸盤': ['開口吸盤', 'チャック吸盤'], '第3開口吸盤': ['第三開口吸盤', '3開口吸盤', '第3吸盤'],
  'チャック開口鉄爪': ['鉄爪', '開口鉄爪'], '後サーボローラー': ['サーボローラー'], '後サーボギア': ['サーボギア', 'サーボギヤ'],
  'ヒーターカートリッジ': ['カートリッジヒーター'], 'チャック繰出しテンションバー': ['テンションバー'],
  '印字検査装置': ['印字検査'], 'タイミングベルト': ['タイミングベルト'], 'ケースシーラー': ['シーラー'], 'Rカット': ['アールカット'],
};
/* 症状をすばやく入れるための言葉 */
const DEFAULT_SYMPTOMS = ['異音', '吸着しない', '開口しない', '破れ', 'シール不良', '停止', '噛み込み', 'ズレ・蛇行', '漏れ', '汚れ'];
/* 入力項目。ここにあるのは、もともとある項目（「設定」で名前を変えたり、使わないようにしたりできる）。
   core は検索とフローの土台なので、消したり任意にしたりできない。「設定」で足した項目の id は x_ で始まる。

const BUILTIN_FIELDS = [
  { id: 'occurredAt', label: '発生日時', short: '発生日時', core: true },
  { id: 'line', label: 'ライン', short: 'ライン' },
  { id: 'area', label: '場所', short: '場所', core: true },

  { id: 'cause', label: '原因', short: '原因' },

/* =========================================================

   9-2. AIの対処案
   チャットの結果に「AIに対処案を聞く」を出す。関係する記録（最大15件・文字だけ）を
   サーバー（GAS）経由でAI（Claude／Azure OpenAI／OpenAI のうち、サーバーで選んだもの）に渡し、記録を根拠にした確認と対処の手順を返してもらう。

   前回からの間は、24時間未満なら時間（「8時間前」。夜の記録の翌朝にまた起きた、のように日付をまたいでも、どれだけもったかが分かる）、
   24時間以上なら発生日どうしの日数（「2日前」）。時刻の差を日数に丸めると、同じ日の13時間後が「1日前」、翌朝が「同じ日」になるため */
function relatedText(r) {

const extrasOf = r => FIELDS.filter(f => isCustom(f) && !f.deleted && f.label && String((r.extra || {})[f.id] || '').trim()).slice(0, 20)
  .map(f => ({ label: f.label.slice(0, 20), value: String(r.extra[f.id]).trim().slice(0, 60), unit: f.type === 'number' ? String(f.unit || '').slice(0, 10) : '' }));
/* まとまりの記録の「設定」で足した項目の内訳（選ぶ項目は値ごとの件数、数字の項目は件数・合計・平均。あわせて6件まで） */

  const out = [], round = v => Math.round(v * 100) / 100;

    if (out.length >= 6) break;
    const vals = recs.map(r => String((r.extra || {})[f.id] || '').trim()).filter(Boolean);
    if (f.type === 'choice' && vals.length) {
      const m = new Map();
      vals.forEach(v => m.set(v, (m.get(v) || 0) + 1));
      out.push({ label: f.label, kind: 'choice', counts: [...m].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([v, n]) => ({ v, n })) });
    } else if (f.type === 'number') {
      const nums = vals.map(numberOf).filter(v => v !== null).map(Number);
      if (!nums.length) continue;
      const sum = nums.reduce((a, b) => a + b, 0);

   記録は原因ごとの代表（新しい順）を先に入れる（似ている順の上位だけだと、多い原因が抜けることがあるため）。
   サンプルは、表示の設定にかかわらず渡さない（試用のための架空の例なので。サンプルしかなければ記録0件として聞く）。画面の検索結果・フローはそのまま */

    causes: f.causes.slice(0, 6).map(c => ({ label: c.label, count: c.count, causeTypes: types(c.ids),
      actions: c.actions.slice(0, 3).map(a => Object.assign({ label: a.label, count: a.count, parts: partsText(a.parts) }, results(a.ids))) })),
    extras: extrasStats(recsOf(f.ids)),   // いちばん近いまとまりの、選ぶ項目の内訳・数字の項目の合計と平均
  };

function loadImage(file) {

    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
function toJpeg(img, max, quality) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}

  if (withView) p.view = toJpeg(img, 480, 0.75);   // 会話の吹き出し用（描き直すたびに大きな画像を並べ直さないため）

    // サーバーは80秒以内に必ず返す（AIの時間切れも理由つきで返る）ので、それより長く待つ
    const res = await gasFetch({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'draft', key: KEY, text: F.draftText, context: F.context, masters: draftMasters() }) }, null, 100000);
    if (FORM !== F) return;   // 待っている間に保存した・やめた・別の記録を開いた → この結果は捨てる
    const d = draftData(res.draft);
    const { filled, kept } = applyDraft(F, d);
    F.draft = { state: 'done', msg: '', filled, kept, note: d.note, by: typeof res.by === 'string' ? res.by : '' };
    F.aiNote = d.note;   // 保存のとき記録に残す（直近の答えのメモ。あとで押し直してエラーになっても消さない）
    // どこを見ていても気づけるよう、上にも短く出す（結果の欄が画面の外・別の画面に居るときのため）
    const n = filled.length;
    toast(n ? `AIが ${n}${n < 10 ? 'つ' : '個'}の欄に下書きしました。確かめてから保存してください` : 'AIが入れられる欄はありませんでした');
  } catch (e) {
    if (e.code === 'key') { SYNC.state = 'key'; renderSync(); }
    if (FORM !== F) return;
    // アプリだけ新しくして、サーバーの Code.gs が前のままだと「知らない操作です」が返る
    F.draft = { state: 'error', msg: /知らない操作/.test(e.message) ? OLD_DRAFT_MSG : e.message, filled: [], kept: [], note: '' };
    if (e.code === 'key') toast(e.message);   // 合言葉が違うとこの欄は出さないので、理由を知らせる
  }
  if (TAB === 'record' && !DETAIL) {   // 別の画面を見ていたら書き換えない（戻ったときに表示される）
    // 待っている間にほかの欄へ文字を入れていたら、その欄は作り直さない（変換中の文字が二重になる・スマホのキーボードが閉じるため）
    const a = typingAt();
    if (a) {   // 上に結果のメッセージが出て下の欄が押し下げられても、入力中の欄が画面の中で動かないようにする
      const t0 = a.getBoundingClientRect().top;
      refreshForm(a);
      if (a.isConnected) window.scrollTo(0, window.scrollY + a.getBoundingClientRect().top - t0);
    } else redrawForm();
    if (!a || a.id === 'fDraft') showDraftResult();   // ほかの欄に入力している途中は、その欄が画面の外へ行かないよう動かさない
  }
}
/* ［置き換える］：すでに入っていた欄を、AIの案にする */
function useDraft(id) {
  const F = FORM, d = F && F.draft, k = d && (d.kept || []).find(x => x.id === id);
  if (!k) return;
  const ids = [id];
  if (isCustom(fieldById(id))) F.extra[id] = k.value;
  else if (['line', 'area', 'equipment', 'symptom', 'cause', 'action', 'failed', 'causeType', 'result', 'downtime'].includes(id)) {
    if (id === 'equipment' && equipOutOfArea(F.area, k.value)) { toast('選んである' + shortLabel(fieldById('area')) + 'の設備ではないため、置き換えられません'); return; }
    // 前の場所の設備は外す（場所を押して選び直したときと同じ）
    if (id === 'area' && equipLeaves(F.area, k.value, F.equipment)) { F.equipment = ''; dropAi('equipment'); }
    F[id] = k.value;
    if (id === 'line') F.autoLine = false;
    // 場所の案に同じ答えの設備が添えてあれば、設備の欄が空のときだけ一緒に入れる（人が入れた設備は上書きしない）
    if (id === 'area' && k.equip && shown('equipment') && !String(F.equipment || '').trim()) { F.equipment = k.equip; ids.push('equipment'); }
  } else return;
  F.aiFilled = [...new Set((F.aiFilled || []).concat(ids))];
  d.kept = d.kept.filter(x => !ids.includes(x.id));
  redrawForm();
}
/* 記録する画面を描き直す（スクロール位置と、文字を入れている欄のカーソルを保つ） */
function redrawForm() {
  const y = window.scrollY, a = document.activeElement;
  let sel = '';
  if (a && a.closest && a.closest('#view')) {
    if (a.id) sel = '#' + CSS.escape(a.id);
    else if (a.dataset.pf) {
      // 部品の欄は、番号ではなく部品そのもので探す（AIの下書きで部品の並びが変わることがあるため）。無くなっていればカーソルは戻さない
      const j = FORM.parts.indexOf(PARTS_SHOWN[+a.dataset.i]);
      if (j >= 0) sel = `[data-pf="${a.dataset.pf}"][data-i="${j}"]`;
    }
  }
  const before = sel ? a.value : '';
  let pos = null;
  try { if (sel && typeof a.selectionStart === 'number') pos = [a.selectionStart, a.selectionEnd]; } catch (e) { pos = null; }
  renderForm();
  window.scrollTo(0, y);
  const b = sel && document.querySelector('#view ' + sel);
  if (b) {
    b.focus({ preventScroll: true });
    if (pos && b.value !== before) pos = [b.value.length, b.value.length];   // 値が変わった欄（AIが入れた）は、カーソルを最後に置く（打った字がAIの値の頭に入らないように）
    try { if (pos) b.setSelectionRange(pos[0], pos[1]); } catch (e) { /* カーソルを置けない欄 */ }
  }
}
/* 記録する画面で、文字を入れている途中の欄（フォーカスのある文字の欄。選ぶ欄・ボタンは数えない） */
function typingAt() {
  const a = document.activeElement;
  if (!a || !a.closest || !a.closest('#view')) return null;
  return a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(radio|checkbox|button|submit|reset|file|image)$/.test(a.type)) ? a : null;
}
/* その入力欄に入れるはずの FORM の値（部品の欄は別に扱うので null） */
const formValueOf = a => (FORM_INPUTS[a.id] ? String(FORM[FORM_INPUTS[a.id]] == null ? '' : FORM[FORM_INPUTS[a.id]])
  : a.dataset.xf ? String(FORM.extra[a.dataset.xf] == null ? '' : FORM.extra[a.dataset.xf]) : null);
/* 入力中の欄 a を作り直さずに、記録する画面のほかの所を描き直す（AIの結果が返ったとき、待っている間に別の欄へ文字を入れていた）。
   作り直すと、かな漢字変換の途中の文字が確定した文字として残り（「たなか田中」のように二重になる）、スマホではキーボードが閉じるため。
   入力中の欄は、印と、AIが入れた値（まだ何も打っていない欄に入ったとき）だけを直す */
function refreshForm(a) {
  const F = FORM, tmp = document.createElement('div');
  const aPart = a.dataset.pf ? PARTS_SHOWN[+a.dataset.i] : null;   // 入力中の部品（描き直す前の並びで探す）
  const slot = $('#draftSlot'), dbox = slot && slot.querySelector('.dbox');
  if (slot) {
    tmp.innerHTML = draftBox(F);
    const nb = tmp.querySelector('.dbox');
    if (dbox && nb && dbox.contains(a)) {   // 文章の欄で言い直している途中：文章の欄は触らず、ボタンと結果のメッセージだけを入れ替える
      dbox.className = nb.className;
      dbox.querySelector('#draftBtn').replaceWith(nb.querySelector('#draftBtn'));
      dbox.querySelector('.dres').innerHTML = nb.querySelector('.dres').innerHTML;
    } else slot.innerHTML = tmp.innerHTML;
  }
  for (const box of document.querySelectorAll('#view .f[data-fid]')) {
    const f = fieldById(box.dataset.fid);
    if (!f) continue;
    const html = (FORM_PARTS[f.id] || customPart)(f, F);
    if (!box.contains(a)) { box.outerHTML = html; continue; }
    tmp.innerHTML = html;
    const nb = tmp.firstElementChild, l = box.querySelector('.l'), nl = nb.querySelector('.l');
    // 印（欄の印のクラスと、見出しの横の「AI」）
    box.className = nb.className;
    if (l && nl) { l.querySelectorAll('.aimark').forEach(m => m.remove()); nl.querySelectorAll('.aimark').forEach(m => l.appendChild(m)); }
    if (a.dataset.pf) { refreshParts(a, aPart); continue; }
    if (f.id === 'equipment') {   // 場所が変わったときの設備の候補と、入力欄の案内の文
      const ch = box.querySelector('#eqChips'), nch = nb.querySelector('#eqChips'), ni = nb.querySelector('#fEquip');
      if (ch) ch.remove();
      if (nch) box.appendChild(nch);
      if (ni) a.placeholder = ni.placeholder;
    }
    if (f.id === 'symptom') {   // 症状の種類（AIが選んだ種類と、その印）
      const st = box.querySelector('#symTags'), nst = nb.querySelector('#symTags');
      if (st && nst) st.innerHTML = nst.innerHTML;
    }
    // まだ何も打っていない欄にAIが入れたときだけ、値を入れてカーソルを最後に置く（変換中の欄は触らない）
    const v = formValueOf(a);
    if (v !== null && a !== COMPOSING && a.value !== v) {
      a.value = v;
      try { a.setSelectionRange(v.length, v.length); } catch (e) { /* カーソルを置けない欄 */ }
    }
  }
  updateHint();
}
/* 部品の欄で入力中：入力中の行は作り直さず、ほかの行だけを入れ替える（部品は番号ではなく、部品そのもので探す） */
function refreshParts(a, part) {
  const pbox = $('#partsBox'), row = a.closest('.part'), j = FORM.parts.indexOf(part);
  const tmp = document.createElement('div');
  tmp.innerHTML = partsHtml();
  if (!pbox) return;
  // 入力中の部品が無くなった（まだ何も書いていない行・人が確かめていないAIの部品が入れ替わった）→ ほかの部品にカーソルは移さない
  if (j < 0 || !row) { pbox.replaceChildren(...tmp.childNodes); return; }
  const fresh = [...tmp.children];
  [...pbox.childNodes].forEach(n => { if (n !== row) n.remove(); });
  fresh.slice(0, j).forEach(n => pbox.insertBefore(n, row));
  fresh.slice(j + 1).forEach(n => pbox.appendChild(n));
  row.querySelectorAll('[data-i]').forEach(e => { e.dataset.i = String(j); });
  row.querySelectorAll('[data-photo^="form:part:"]').forEach(e => { e.dataset.photo = 'form:part:' + j; });
}
/* 結果が下の「保存する」の帯に隠れないよう、見える所まで下げる（スマホでは、ボタンを出すために少しだけスクロールして押すことが多い）。

/* 話す順番の案内（たたんでおき、押すと開く）と、同じ順番の例文。言われた順に話すと、AIが欄に振り分けやすく、記録も正確になる */
const DRAFT_ORDER = ['どこで（号機・設備）', '何が起きた（いつから・何回）', '測った値（単位つき）', '直前に変えたこと（品種切替・フィルム交換 など）',

/* ---------------------------------------------------------
   14-1. 見直し待ち（主任が記録を整える。書き足すほど、AIの答えが正確になる）
   対象：本物の記録（サンプル・削除済みは除く）。理由：原因が空・原因の種類が空か「不明」・結果が空・結果が「様子見」のまま1日以上・
   停止時間が空・設備名が一覧（と別の呼び方）に無い・発生日時が自動のまま・AIが入れた欄が人に確かめられていない。
   「使わない」にした項目は理由にしない（チームで使わないと決めた欄で、手間を増やさない）。
   件数が多くても見やすいよう、古い順に並べ、理由で絞り込め、一度に REVIEW_STEP 件ずつ出す
   --------------------------------------------------------- */
// 様子見のまま、これだけ経ったら出す（1日。発生日時から。最後に保存した時刻からにすると、ほかの項目を直しただけで消えてしまうため）
const WATCH_STALE_MS = 86400000;
const REVIEW_STEP = 30;
/* 理由の種類 [キー, 絞り込みのチップの名前（今の項目の名前で作る）] */
const REVIEW_KINDS = [
  ['cause', () => fname('cause') + 'なし'], ['causeType', () => fname('causeType') + '（なし・不明）'], ['result', () => fname('result') + 'なし'],
  ['watch', () => labelOf(RESULTS, 'watch') + 'のまま'], ['downtime', () => fname('downtime') + 'なし'], ['equip', () => fname('equipment') + 'が一覧に無い'],
  ['at', () => fname('occurredAt') + 'が自動'], ['ai', () => 'AIが入れたまま'],
];
/* 項目の短い名前（「設定」で名前を変えていれば、その名前） */
const fname = id => shortLabel(fieldById(id) || builtinOf(id));
/* 設備名が、その場所の一覧（と別の呼び方）にあるか。場所が一覧に無い（消した）ときは、どこかの場所の一覧にあればよい */
function equipKnown(r) {
  if (!String(r.equipment || '').trim()) return false;
  const lists = own(AREAS, r.area) ? [equipOfArea(r.area)] : Object.values(AREAS);
  return lists.some(l => l.some(e => sameEquip(e, r.equipment)));
}
/* AIが入れて、まだ人が確かめていない欄の名前（消した項目は数えない） */
function aiLeft(r) {
  return (r.aiFilled || []).map(id => { if (id === 'symptomTags') return '症状の種類'; const f = fieldById(id); return f && !f.deleted ? shortLabel(f) : ''; }).filter(Boolean);
}
/* 見直し待ちの理由 [{ k, label }]（k は REVIEW_KINDS のキー） */
function reviewReasons(r) {
  const why = [], add = (k, label) => why.push({ k, label });
  if (shown('cause') && !String(r.cause || '').trim()) add('cause', fname('cause') + 'なし');
  if (shown('causeType') && (!r.causeType || r.causeType === '不明')) add('causeType', fname('causeType') + (r.causeType ? 'が「不明」' : 'なし'));
  if (shown('result')) {
    const since = Date.parse(r.occurredAt);
    if (!r.result) add('result', fname('result') + 'なし');
    else if (r.result === 'watch' && Number.isFinite(since) && Date.now() - since >= WATCH_STALE_MS) {
      add('watch', `${labelOf(RESULTS, 'watch')}のまま${Math.floor((Date.now() - since) / 86400000)}日`);
    }
  }
  if (shown('downtime') && !r.downtime) add('downtime', fname('downtime') + 'なし');
  if (!equipKnown(r)) add('equip', fname('equipment') + 'が一覧に無い');
  if ((r.autoFields || []).includes('occurredAt')) add('at', fname('occurredAt') + 'が自動のまま');
  const ai = aiLeft(r);
  if (ai.length) add('ai', 'AIが入れたまま（' + ai.join('・') + '）');
  return why;
}
/* 見直し待ちの記録 [{ r, why }]（場所を選んでいればその場所だけ。古い順）。この画面でその場で直した記録は、理由が無くなっても残す */
const reviewList = () => RECORDS.filter(r => !r.deleted && !r.sample && (!FT.area || r.area === FT.area))
  .map(r => ({ r, why: reviewReasons(r) })).filter(x => x.why.length || FT.touched.has(x.r.id))
  .sort((a, b) => (a.r.occurredAt || '').localeCompare(b.r.occurredAt || '') || String(a.r.id).localeCompare(String(b.r.id)));
function reviewHtml(all) {
  const live = all.filter(x => x.why.length);
  if (!all.length) return '<p class="muted" style="margin-top:16px">見直し待ちの記録はありません。</p>';
  const count = k => live.filter(x => x.why.some(w => w.k === k)).length;
  const fchip = (k, label, n) => `<button type="button" class="chip pill${FT.reason === k ? ' on' : ''}" data-act="ft-reason" data-v="${esc(k)}">${esc(label)}<span class="mono">${n}</span></button>`;
  const list = all.filter(x => !FT.reason || x.why.some(w => w.k === FT.reason) || FT.touched.has(x.r.id));

/* 1件：記録の行（押すと詳細）・理由の札・その場で押せるチップ（結果・原因の種類・停止時間。理由のある項目と、この画面で直した項目だけ）・

/* 見直し待ち（と記録の詳細）で押したチップで、その記録のその項目だけを直して保存・同期する（updatedAt を新しくする。必須の検査はしない）。
   k：result・causeType・downtime（v は選んだ値）、at（発生日時はこのままでよい）、ai（AIが入れた欄を確かめた）。
   選んである値を押しても何もしない（この画面では値を消さない。外すときは［直す］から）。
   記録は1件まるごと送るので、この端末が最新を読む前に、ほかの端末が同じ記録の別の項目（原因など）を直していると、端末の古い値で上書きして
   消してしまう。そこで、押して直した項目を記録に覚えておき（_fix。_fixBase はもとにした記録の更新日時）、送る前に共有先の最新の記録を読んで、
   その上に直した項目だけをかけ直してから送る（syncNow・rebaseFix） */
async function reviewFix(id, k, v) {
  const r = RECORDS.find(x => x.id === id);
  if (!r || r.deleted || r.sample) return;
  let msg, op;
  if (k === 'at') {
    if (!(r.autoFields || []).includes('occurredAt')) return;
    op = { k };
    msg = fname('occurredAt') + 'はこのままにしました';
  } else if (k === 'ai') {
    if (!(r.aiFilled || []).length) return;
    op = { k, base: r.aiFilled.slice() };   // 確かめた欄（見えていた印）
    msg = 'AIが入れた欄を、確かめたことにしました';
  } else if (own(PICKS, k) && labelOf(PICKS[k], v)) {
    if (r[k] === v) return;
    op = { k, v, base: r[k] || '' };   // 押す前の値（ほかの端末が同じ項目を直したかを見分ける）
    msg = `「${fname(k)}：${labelOf(PICKS[k], v)}」を保存しました`;
  } else return;
  op.at = new Date().toISOString();
  applyFix(r, op);
  // 覚えるのは共有しているときだけ。「直す」画面の変更をまだ送っていない記録は、今までどおり記録まるごとを送る
  if (GAS_URL && (!r._dirty || r._fix)) { if (!r._fix) { r._fix = []; r._fixBase = r.updatedAt; } r._fix.push(op); }
  r.updatedAt = op.at; r._dirty = true;
  // 同じ記録を記録する画面で直している途中なら、その画面にも同じ値を入れる（あとで保存したときに、押した値を戻さないように）。
  // 開いたときの値（FORM.orig）にも入れる（もう保存した値なので、直している途中の入力には数えない）
  if (FORM && FORM.editId === id) {
    const o = FORM.orig || {};
    if (k === 'at') FORM.autoAt = o.autoAt = false;
    else if (k === 'ai') { FORM.aiFilled = []; o.aiFilled = []; }
    else { FORM[k] = o[k] = v; dropAi(k); o.aiFilled = (o.aiFilled || []).filter(x => x !== k); }
  }
  await dbPut(r);
  if (TAB === 'flow' && !DETAIL && FT.mode === 'review') FT.touched.set(id, (FT.touched.get(id) || new Set()).add(k));
  toast(msg);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  syncNow();
}
/* 直した項目（op）を記録 t にかける。srvAt：共有先の最新の記録にかけ直すときの、その記録の更新日時。
   選ぶ項目は、この端末で押したあとに、ほかの端末が同じ項目を直していれば、そちらを残す（あとから直した方が勝つ。記録の保存と同じ決まり） */
function applyFix(t, op, srvAt) {
  if (op.k === 'at') { if ((t.autoFields || []).includes('occurredAt')) t.autoFields = t.autoFields.filter(x => x !== 'occurredAt'); return; }
  if (op.k === 'ai') { if (t.aiFilled) t.aiFilled = t.aiFilled.filter(x => !op.base.includes(x)); return; }   // 確かめた欄だけ外す
  if (srvAt && (t[op.k] || '') !== op.base && srvAt > op.at) return;
  t[op.k] = op.v;
  if (t.aiFilled) t.aiFilled = t.aiFilled.filter(x => x !== op.k);   // 人が選んだので、AIの印は外す（キーが無い記録には足さない＝サーバーの値を消さない）
}
/* 共有先の最新の記録 raw の上に、この端末で直した項目（_fix）をかけ直して、送る記録 local を作り直す（未送信のまま） */
function rebaseFix(local, raw) {
  const srv = fromWire(raw);
  if (!srv) return;
  keepLocal(srv, raw, local);   // 前の版の Code.gs は新しい項目を返さない（端末の値を使う）
  keepImages(srv, local);
  local._fix.forEach(op => applyFix(srv, op, srv.updatedAt));
  // 更新日時は共有先の記録より新しくする（端末の時計が遅れていても、直した項目が「古い保存」として捨てられないように）
  const at = new Date(Math.max(Date.now(), (Date.parse(srv.updatedAt) || 0) + 1)).toISOString();
  Object.assign(local, srv, { updatedAt: at, _dirty: true, _fix: local._fix, _fixBase: srv.updatedAt });
}
/* 記録を直す画面を開く（詳細の［直す］・見直し待ちの［直す］）。入力中の記録（新しい記録・直している途中の記録）があれば、破棄してよいか聞く。
   同じ記録を直している途中なら、その画面のまま開く（入れた値を記録の値で作り直さない）。
   フローの画面（見直し待ち など）から開いたときは、戻り先を覚えておく（保存してもどる・やめる で、その行へ戻る。backTo） */
function editRecord(id) {
  const r = findRec(id);
  if (!r || r.sample || r.deleted) return;
  const back = TAB === 'flow' ? (DETAIL ? RETURN : backPoint(id)) : null;
  if (FORM && FORM.editId === id && formHasInput()) { if (back) FORM.backTo = back; }
  else {
    if (!discardOk('この記録を直します')) return;
    FORM = formFromRecord(r);
    FORM.backTo = back;
  }
  TAB = 'record'; DETAIL = null; RETURN = null; render(); window.scrollTo(0, 0);
}

  if (GAS_URL && SYNC.configOk === false) { toast('サーバーの Code.gs が前の版のため、入力項目は足せません（先に Code.gs を新しい版にしてください）'); return; }
  if (!label) { toast('項目の名前を入れてください'); return; }
  if (FIELDS.some(f => !f.deleted && f.label === label)) { toast('同じ名前の項目があります'); return; }
  if (type === 'choice' && !options.length) { toast('選択肢を1つ以上入れてください'); return; }
  if (unit && oldRecServer()) { toast(OLD_CFG_MSG); return; }   // 前の版の Code.gs は単位を消してしまう（入れた単位が黙って消えないよう、足す前に知らせる）
  const id = 'x_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  SET_ADD_OPEN = false;
  const ok = editConfig({ op: 'addField', field: { id, label, type, options, unit, required: $('#nfReq').checked } });
  if (ok) toast(`項目「${label}」を追加しました`);
  else if (ok === false) toast('追加できませんでした（入力項目は40個までです）');
}
/* 設定の画面のボタン（消す・並べ替え・名前・必須・使う/使わない） */
function onSettingsAct(act, t) {
  const v = t.dataset.v, f = t.dataset.id ? fieldById(t.dataset.id) : null;
  const keep = '（これまでの記録は消えません）';
  // 前の版の Code.gs は新しい4つの項目を知らない：名前・必須・使う／使わない・並べ替え（動かす項目か、となりが新しい項目）を変えても、同期で黙って戻るので止めて知らせる
  if (oldRecServer() && ((f && NEW_BUILTIN.includes(f.id) && /^cf-(rename|req|hide|show|restore)$/.test(act))
    || (act === 'cf-move' && t.dataset.list === 'fields' && [v, neighborOf(CONF, 'fields', v, +t.dataset.dir)].some(x => NEW_BUILTIN.includes(x))))) { toast(OLD_CFG_MSG); return; }
  switch (act) {
    case 'cf-move': {
      const target = neighborOf(CONF, t.dataset.list, v, +t.dataset.dir);
      if (target != null) editConfig({ op: 'move', list: t.dataset.list, value: v, dir: +t.dataset.dir, target });
      break;
    }
    case 'cf-remove': if (confirm(`「${v}」を消しますか？${keep}`)) editConfig({ op: 'remove', list: t.dataset.list || t.dataset.key, value: v }); break;
    case 'cf-rm-area': {
      const ar = CONF.areas.find(x => x.name === v);
      if (!ar) break;
      if (CONF.areas.length <= 1) { toast(shortLabel(fieldById('area')) + 'は1つ以上必要です'); break; }
      if (confirm(`「${v}」と、その${shortLabel(fieldById('equipment'))}の候補${ar.equip.length}件を消しますか？${keep}`)) editConfig({ op: 'removeArea', value: v });
      break;
    }
    case 'cf-rm-equip': if (confirm(`「${t.dataset.key}」の「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeEquip', area: t.dataset.key, value: v }); break;
    case 'cf-rm-opt': if (confirm(`選択肢「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeOption', id: t.dataset.key, value: v }); break;
    case 'cf-rename': {
      if (!f) break;
      const name = prompt('新しい名前（20文字まで）', f.label);
      const nv = name == null ? '' : name.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!nv || nv === f.label) break;
      if (FIELDS.some(x => x !== f && !x.deleted && x.label === nv)) { toast('同じ名前の項目があります'); break; }
      editConfig({ op: 'setField', id: f.id, label: nv });
      break;
    }
    case 'cf-req': if (f) editConfig({ op: 'setField', id: f.id, required: !f.required }); break;
    case 'cf-unit': {   // 数字の項目の単位（空にすると単位なし）
      if (!f || f.type !== 'number') break;
      if (oldRecServer()) { toast(OLD_CFG_MSG); break; }
      // 記録には数字だけが残るので、単位を変えると、これまでの記録の値も新しい単位で表示し、AIにも送る。値のある記録があれば、そう知らせる
      // （書きまちがいを直すなら変えてよい。計器が変わって値の大きさが変わるなら、新しい項目を足してもらう）
      const n = f.unit ? RECORDS.filter(r => !r.deleted && String((r.extra || {})[f.id] || '').trim()).length : 0;
      const u = prompt('単位（10文字まで。空にすると単位なし）' + (n ? `\nこれまでの記録（${n}件）の値も、この単位で表示し、AIにも送ります。計器が変わって値の大きさが変わるときは、単位を変えずに新しい項目を足してください` : ''), f.unit || '');
      const nu = u == null ? null : u.replace(/\s+/g, ' ').trim().slice(0, 10);
      if (nu == null || nu === (f.unit || '')) break;
      editConfig({ op: 'setField', id: f.id, unit: nu });
      break;
    }
    case 'cf-add-alias': {   // 設備の別の呼び方を足す（v：設備の正式名）
      if (oldRecServer()) { toast(OLD_CFG_MSG); break; }
      const name = prompt(`「${v}」の別の呼び方（20文字まで。現場でそう呼んでいる名前）`, '');
      const w = name == null ? '' : name.replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!w) break;
      const why = aliasProblem(v, w);
      if (why) { toast(why); break; }
      const ok = editConfig({ op: 'addAlias', equip: v, value: w });
      if (ok) toast(`「${w}」を「${v}」の別の呼び方にしました`);
      else if (ok === false) toast('足せませんでした（呼び方は1つの' + shortLabel(fieldById('equipment')) + 'に10個まで、呼び方のある' + shortLabel(fieldById('equipment')) + 'は60個までです）');
      break;
    }
    case 'cf-rm-alias': if (confirm(`「${t.dataset.key}」の呼び方「${v}」を消しますか？${keep}`)) editConfig({ op: 'removeAlias', equip: t.dataset.key, value: v }); break;
    case 'cf-hide': if (f && confirm(`「${f.label}」を、記録する画面に出さないようにしますか？（これまでの記録の値は残ります。「使う」で戻せます）`)) editConfig({ op: 'removeField', id: f.id }); break;
    case 'cf-del-field': if (f && confirm(`項目「${f.label}」を消しますか？（これまでの記録の値は残ります。「消した項目」から元に戻せます）`)) editConfig({ op: 'removeField', id: f.id }); break;
    case 'cf-show': case 'cf-restore': if (f) editConfig({ op: 'restoreField', id: f.id }); break;
  }
}

/* =========================================================
   15. 画面：記録の詳細

function renderDetail() {

  const f = flowsOf(buildFlows(visibleRecords()), [r.id])[0];
  const partsBlock = (r.parts || []).map((p, i) => `<div>${esc(p.name) || '<span class="muted">部品名なし</span>'}${p.model ? `　<b>型式：${esc(p.model)}</b>` : ''}

  const extras = (downL || want('downtime') ? xrow(tag('downtime'), downL ? esc(downL) : none) : '')
    + FIELDS.filter(f => isCustom(f) && (r.extra || {})[f.id]).map(f => xrow(`${esc(f.label)}${f.deleted ? '<br><span class="muted">（使っていない項目）</span>' : ''}`,
      esc(r.extra[f.id]) + (f.type === 'number' && f.unit ? ' ' + esc(f.unit) : ''))).join('')
    + Object.keys(r.extra || {}).filter(k => !fieldById(k)).map(k => xrow('追加項目<br><span class="muted">（消した項目）</span>', esc(r.extra[k]))).join('');
  // 関連する記録（この記録をつないだ前の記録）と、この記録につながる記録（逆向き・古い順）。押すとその記録へ
  const prev = r.relatedId ? findRec(r.relatedId) : null, rel = labelOf(RELATIONS, r.relation);
  const prevBlock = !r.relatedId ? '' : `<div class="h3">関連する記録${rel ? `（${esc(rel)}）` : ''}</div>`
    + (prev && !prev.deleted ? recCard(prev) : `<p class="muted" style="font-size:14px;margin:4px 0">${prev ? '消した記録です' : 'この端末にない記録です'}</p>`);
  const next = r.sample ? [] : RECORDS.filter(x => !x.deleted && x.relatedId === r.id).sort((a, b) => (a.occurredAt || '').localeCompare(b.occurredAt || ''));
  const nextBlock = next.length ? `<div class="h3">この記録につながる記録（${next.length}件）</div>${next.map(x => recCard(x, false, labelOf(RELATIONS, x.relation))).join('')}` : '';
  // 確かめること（主任の見直し）：発生日時が自動のまま・AIが入れて人が確かめていない欄。押すと、その印だけを外して保存する。
  // 自動の発生日時は「記録する画面を開いた時刻」。記録した時刻も並べて出す（ずれていれば、起きた時刻ではないと気づけるように）
  const aiNames = aiLeft(r), made = new Date(r.createdAt);
  const madeAt = r.createdAt && !isNaN(made) ? `（記録した時刻：${fmtDate(localStamp(made))}）` : '';
  const checks = r.sample ? '' : ((r.autoFields || []).includes('occurredAt')
    ? `<div class="dchk"><span>${tag('occurredAt')}は人が入れておらず、記録する画面を開いた時刻（自動）のままです${esc(madeAt)}</span><button type="button" class="chip sug" data-act="dt-ok" data-k="at">この日時でよい</button></div>` : '')
    + (aiNames.length ? `<div class="dchk"><span>AIが入れて、まだ人が確かめていない欄：${esc(aiNames.join('・'))}</span><button type="button" class="chip sug" data-act="dt-ok" data-k="ai">確かめた</button></div>` : '');
  // 「保存しました」の帯は、その記録を見ている間、時刻（SAVED.until）まで残す（保存のあとの同期で描き直しても消さない）
  if (SAVED && (SAVED.id !== r.id || Date.now() >= SAVED.until)) SAVED = null;
  const banner = SAVED ? `<div class="banner ok" id="savedBanner">${SAVED.kind === 'edit' ? '直した内容を保存しました。' : '保存しました。'}${f && f.count > 1 ? `同じトラブルは <b>${f.count}件</b> になり、下のフローに加わりました。` : '下のフローに加わりました。'}</div>` : '';
  $('#view').innerHTML = `
    <button type="button" class="btn sub sm" data-act="back">${ICON.back}もどる</button>
    ${banner}
    <h2 class="ttl" style="margin-top:12px">${esc(r.equipment)}${r.sample ? '<span class="badge sample">サンプル</span>' : ''}${GAS_URL && r._dirty ? '<span class="badge dirty">未送信</span>' : ''}</h2>
    <div class="meta">${esc(fmtDate(r.occurredAt))}　${esc(r.line)}　${esc(r.area)}${r.author ? '　記録：' + esc(r.author) : ''}</div>
    ${checks}
    <div class="steps">
      <div class="step"><span class="k eq">${tag('equipment')}</span><div class="v">${esc(r.area)} › <b>${esc(r.equipment)}</b></div></div>
      <div class="arrow">↓</div>
      <div class="step"><span class="k sym">${tag('symptom')}</span><div class="v">${esc(r.symptom)}${tags.length ? sub('症状の種類', tags.map(esc).join('、')) : ''}</div></div>
      <div class="arrow">↓</div>
      <div class="step"><span class="k cau">${tag('cause')}</span><div class="v">${r.cause ? esc(r.cause) : none}${r.causeType || want('causeType') ? sub(tag('causeType'), r.causeType ? esc(r.causeType) : none) : ''}</div></div>
      <div class="arrow">↓</div>
      <div class="step"><span class="k act">${tag('action')}</span><div class="v">${r.action ? esc(r.action) : none}${r.failed ? sub(tag('failed'), esc(r.failed)) : ''}</div></div>
      ${partsBlock ? `<div class="arrow">↓</div><div class="step"><span class="k prt">${tag('parts')}</span><div class="v">${partsBlock}</div></div>` : ''}
      ${resultL || want('result') ? `<div class="arrow">↓</div><div class="step"><span class="k res">${tag('result')}</span><div class="v">${resultL ? `<b class="rs ${esc(r.result)}">${esc(resultL)}</b>` : none}</div></div>` : ''}
    </div>
    ${r.rawText ? `<details class="rawd"${RAW_OPEN === r.id ? ' open' : ''}><summary>話した原文を見る</summary><p class="rawt">${esc(r.rawText)}</p></details>` : ''}
    ${extras ? `<div class="h3">そのほかの項目</div><div class="xbox">${extras}</div>` : ''}
    ${photos || r.photoText ? `<div class="h3">写真</div>${photos ? `<div class="photos">${photos}</div>` : ''}${r.photoText ? `<div class="dv ptx"><span class="dk">写真から読み取ったこと：</span>${esc(r.photoText)}</div>` : ''}` : ''}
    ${prevBlock}${nextBlock}
    ${f ? `<div class="h3">このトラブルのフロー（同じ設備・同じ症状 ${f.count}件）</div>${flowCard(f, true, r.id)}` : ''}
    ${r.sample
      ? '<p class="muted" style="font-size:13px">サンプルの記録は直したり消したりできません。</p>'
      : `<div class="btnrow"><button type="button" class="btn sub" data-act="rel-new" data-v="continue">続きを書く</button><button type="button" class="btn sub" data-act="rel-new" data-v="recur">また起きた</button></div>
        <p class="muted" style="font-size:13px;margin:6px 0 0">［続きを書く］は原因まで、［また起きた］は症状までを写して、この記録につなぎます。</p>
        <div class="btnrow"><button type="button" class="btn sub" data-act="edit">直す</button><button type="button" class="btn danger" data-act="delete">消す</button></div>`}`;
}
let RAW_OPEN = null;   // 「話した原文を見る」を開いている記録（同期で描き直しても閉じない）
/* 「保存しました」の帯を出す。その記録を見ている間は SAVED_MS まで残す（保存のあとの同期で詳細を描き直しても消さない。時刻で消す） */
function showSaved(kind, id) {
  const s = SAVED = { kind, id, until: Date.now() + SAVED_MS };
  setTimeout(() => {
    if (SAVED !== s) return;   // 見るのをやめた・あとでもう一度保存した（そちらの時刻で消す）
    SAVED = null;
    const b = $('#savedBanner');
    if (b) b.remove();
  }, SAVED_MS);
}
/* 詳細の［続きを書く］［また起きた］で開く、記録する画面の下書き（この記録につなぐ。発生日時は いま＝自動）。
   続き：号機・場所・設備・症状（と症状の種類）・原因・原因の種類を写す。また起きた：号機・場所・設備・症状（と症状の種類）を写す。
   もとの記録でAIが入れて人が確かめていない欄は、写した欄にもAIの印を付ける（確かめていない値を、人が入れた値にしない） */
function followPre(r, relation) {
  const pre = { relatedId: r.id, relation, area: r.area || '', equipment: r.equipment || '', symptom: r.symptom || '', symptomTags: (r.symptomTags || []).slice(0, MAX_TAGS) };
  if (r.line) Object.assign(pre, { line: r.line, autoLine: false });   // 号機の無い記録なら、いつもどおり前回の号機（自動）
  if (relation === 'continue') Object.assign(pre, { cause: r.cause || '', causeType: r.causeType || '' });
  pre.aiFilled = (r.aiFilled || []).filter(id => (id === 'symptomTags' ? pre.symptomTags.length : String(pre[id] || '').trim()));
  return pre;
}

/* =========================================================
   16. 画面の切りかえと操作
   ========================================================= */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => {
    const on = b.dataset.tab === TAB && !DETAIL;
    b.classList.toggle('on', b.dataset.tab === TAB);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.body.classList.toggle('chat', TAB === 'search' && !DETAIL);
  const sb = $('#setBtn'), onSet = TAB === 'settings' && !DETAIL;
  sb.classList.toggle('on', onSet);
  if (onSet) sb.setAttribute('aria-current', 'page'); else sb.removeAttribute('aria-current');
  if (SAVED && SAVED.id !== DETAIL) SAVED = null;   // 「保存しました」の帯は、その記録を見ている間だけ
  if (DETAIL) renderDetail();
  else if (TAB === 'search') renderSearch();
  else if (TAB === 'record') renderForm();
  else if (TAB === 'settings') renderSettings();
  else renderFlowTab();
  renderSync();
  renderCam();
}
function goTab(tab) {
  TAB = tab; DETAIL = null; RETURN = null;
  FT.touched.clear();   // 見直し待ちでその場で直した行は、画面を離れたら残さない
  render();
  if (tab === 'search') window.scrollTo(0, document.body.scrollHeight); else window.scrollTo(0, 0);
}
/* 写真を付ける部品（番号ではなく部品そのもの。撮っている間に、AIの下書きで部品の並びが変わることがあるため） */
let PICK_PART = null;
const PART_GONE_MSG = '部品が入れ替わったため、写真を付けられませんでした。もう一度付けてください';
function pickImage(target, multiple) {
  const fi = $('#fileIn');
  fi.dataset.target = JSON.stringify(target);
  fi.multiple = !!multiple;
  fi.value = '';
  fi.click();
}
$('#fileIn').addEventListener('change', async e => {
  const fi = e.target, files = [...fi.files];
  let target = null;
  try { target = JSON.parse(fi.dataset.target || 'null'); } catch (err) { target = null; }
  if (!files.length || !target || !FORM) return;
  toast('写真を準備しています…');
  try {
    if (target.kind === 'photo') {
      for (const f of files) { if (FORM.photos.length >= 4) break; FORM.photos.push(await makePhoto(f)); }
      $('#photoBox').innerHTML = photosHtml();
    } else {
      // 押した部品が無くなっていたら（AIの下書きで空の行が消えた・保存した など）、ほかの部品には付けずに知らせる。写真を準備している間にも確かめる
      const part = PICK_PART;
      if (!part || !FORM.parts.includes(part)) { toast(PART_GONE_MSG); return; }
      const photo = await makePhoto(files[0]);
      if (!FORM.parts.includes(part)) { toast(PART_GONE_MSG); return; }
      part.photo = photo;
      delete part.ai;   // 写真を付けた部品は、AIを押し直しても入れ替えない（写真ごと消さない）
      $('#partsBox').innerHTML = partsHtml();
    }
    toast('写真を追加しました');
  } catch (err) { toast(err.message); }
});

document.addEventListener('click', e => {
  if ($('#lb').classList.contains('show')) { $('#lb').classList.remove('show'); return; }
  const t = e.target.closest('[data-tab],[data-rid],[data-q],[data-act],[data-f],[data-photo]');

  if (t.dataset.tab) { goTab(t.dataset.tab); return; }

    FORM.extra[t.dataset.xid] = FORM.extra[t.dataset.xid] === t.dataset.v && !aiMarked({ id: t.dataset.xid }) ? '' : t.dataset.v;
    dropAi(t.dataset.xid);   // 人が選び直した欄は、AIの印を外す
    const y = window.scrollY; renderForm(); window.scrollTo(0, y);

  }
  if (t.dataset.f) { onFormChip(t.dataset.f, t.dataset.v); return; }

  if (act === 'hint' || (!act && t.dataset.q)) { sendChat(t.dataset.q); return; }
  if (!act && t.dataset.rid) {
    if (TAB === 'flow' && !DETAIL) RETURN = backPoint(t.dataset.rid);   // フローの一覧から開いた：［もどる］でその行へ戻る
    DETAIL = t.dataset.rid; SAVED = null; render(); window.scrollTo(0, 0); return;
  }
  const i = +t.dataset.i;
  switch (act) {
    case 'key': askKey(); break;
    case 'ai': askAi(CHAT[+t.dataset.mi]); break;
    case 'vision': analyzePhoto(CHAT[+t.dataset.mi]); break;
    case 'cam': openCamera(); break;
    case 'cam-clear': PENDING = null; renderCam(); break;
    case 'back': {
      const b = RETURN && RETURN.tab === TAB ? RETURN : null;
      DETAIL = null; RETURN = null; render();
      if (TAB === 'search') window.scrollTo(0, document.body.scrollHeight);
      else if (b) goBackTo(b);   // フローの一覧から開いた詳細：一覧のその行へ戻る（上から探し直さなくてよいように）
      break;
    }
    case 'edit': editRecord(DETAIL); break;
    case 'rel-new': {   // 詳細の［続きを書く］［また起きた］：この記録につないだ新しい記録を書く（入力中の記録があれば、破棄してよいか聞く）
      const r = findRec(DETAIL);
      if (!r || r.sample || r.deleted || !labelOf(RELATIONS, t.dataset.v)) break;
      if (!discardOk('新しく書きます')) break;
      FORM = newForm(followPre(r, t.dataset.v)); TAB = 'record'; DETAIL = null; render(); window.scrollTo(0, 0);
      break;
    }
    case 'dt-ok': if (DETAIL) reviewFix(DETAIL, t.dataset.k, ''); break;   // 詳細の「確かめること」（この日時でよい・AIの欄を確かめた）
    case 'rv-set': reviewFix(t.dataset.id, t.dataset.k, t.dataset.v); break;
    case 'rv-edit': editRecord(t.dataset.id); break;
    case 'rv-more': { const y = window.scrollY; FT.limit += REVIEW_STEP; render(); window.scrollTo(0, y); break; }
    case 'delete': deleteRecord(DETAIL); break;
    case 'cancel-edit': {   // 見直し待ちなどから開いた直す画面なら、その一覧のその行へ戻る（ほかは今までどおり探す画面へ）
      const b = FORM && FORM.backTo;
      FORM = newForm(); DETAIL = null; TAB = b ? b.tab : 'search'; render();
      if (b) goBackTo(b);
      break;
    }
    case 'save': saveForm(); break;
    case 'draft': runDraft(); break;
    case 'draft-use': useDraft(t.dataset.k); break;
    case 'rec-from-chat': {
      const m = CHAT[+t.dataset.mi];
      if (!m) break;
      if (!discardOk('新しく書きます')) break;
      FORM = newForm(m.prefill);
      // チャットで聞いた内容（写真のときは、ひとこと。無ければ写真から読み取った探す言葉）も、文章からの下書きのときにAIに渡す
      FORM.context = String((m.photo ? m.text || m.query : m.query) || '').replace(/\s+/g, ' ').trim().slice(0, 300);
      if (m.photo) FORM.photos = [{ id: newId('p'), data: m.photo.data, thumb: m.photo.thumb, driveId: null }];   // 送った写真も記録に付ける
      // 写真から読み取ったこと（読み取りが終わっていて、確かさが low でないときだけ）と、読めた文字からの型式の候補
      const v = m.photo && m.vision && m.vision.state === 'done' ? m.vision.data : null;
      if (v && v.confidence !== 'low') {
        FORM.photoText = [v.abnormality ? '見えた異常：' + v.abnormality : '', v.texts.length ? '読めた文字：' + v.texts.join('、') : ''].filter(Boolean).join('／').slice(0, 300);
        FORM.modelHints = modelCandidates(v.texts);
      }
      if (m.ai && m.ai.state === 'done' && m.ai.historyId) FORM.aiHistoryId = m.ai.historyId;   // このメッセージのAIの対処案（AI履歴の ID）も記録に残す
      TAB = 'record'; DETAIL = null; render(); window.scrollTo(0, 0);
      break;
    }
    case 'ai-rate': rateAi(CHAT[+t.dataset.mi], t.dataset.v); break;
    case 'rel-link': {   // 7日以内の同じトラブルに［つなぐ］（もう一度押すと外す）
      const r = findRec(t.dataset.v);
      if (!FORM || !r) break;
      if (FORM.relatedId === r.id) { FORM.relatedId = ''; FORM.relation = ''; }
      else { FORM.relatedId = r.id; FORM.relation = r.result === 'fixed' ? 'recur' : 'continue'; }
      redrawForm();
      break;
    }
    case 'rel-clear': if (FORM) { FORM.relatedId = ''; FORM.relation = ''; redrawForm(); } break;
    case 'ptext-clear': if (FORM) { FORM.photoText = ''; redrawForm(); } break;
    case 'model-hint': {   // 型式の候補を押す → 部品（名前は空・型式にその文字）を足す
      const v = t.dataset.v;
      if (!FORM || FORM.parts.length >= 5 || FORM.parts.some(p => norm(p.model) === norm(v))) break;
      FORM.parts.push({ name: '', model: v, photo: null });
      $('#partsBox').innerHTML = partsHtml();
      unmarkAi('parts');   // 人が部品の欄を直した（AIの部品も人が確かめた部品として扱う）
      break;
    }
    case 'add-part': FORM.parts.push({ name: '', model: '', photo: null }); $('#partsBox').innerHTML = partsHtml(); break;
    case 'del-part': FORM.parts.splice(i, 1); $('#partsBox').innerHTML = partsHtml(); unmarkAi('parts'); break;
    case 'add-part-photo':
      // カメラを押した部品は、人が確かめた部品として扱う（撮っている間にAIの答えが返っても、この部品は入れ替えない）
      PICK_PART = FORM.parts[i] || null;
      if (PICK_PART) delete PICK_PART.ai;
      pickImage({ kind: 'part', i }, false);
      break;
    case 'del-part-photo': if (FORM.parts[i]) FORM.parts[i].photo = null; $('#partsBox').innerHTML = partsHtml(); break;
    case 'add-photo': pickImage({ kind: 'photo' }, true); break;
    case 'del-photo': FORM.photos.splice(i, 1); $('#photoBox').innerHTML = photosHtml(); break;
    // フローの切り替え・場所・見直し待ちの理由。見直し待ちは、出す数と、その場で直した行を最初に戻す
    case 'ft-mode': FT.mode = t.dataset.v; FT.reason = ''; FT.limit = REVIEW_STEP; FT.touched.clear(); render(); break;
    case 'ft-area': FT.area = t.dataset.v; FT.limit = REVIEW_STEP; FT.touched.clear(); render(); break;
    case 'ft-reason': FT.reason = t.dataset.v; FT.limit = REVIEW_STEP; FT.touched.clear(); render(); break;
    case 'toggle-samples': META.showSamples = !META.showSamples; metaSet('showSamples', META.showSamples); render(); break;
  }
});
function onFormChip(kind, v) {
  const F = FORM;
  // 1つだけ選ぶ欄は、もう一度押すと外す。ただし、自動で入った号機・AIの印の欄で、選んである値を押したときは、外さずに「人が確かめた」にする
  // （「前回の号機（違えば押して直す）」やAIの印を見て押し直したときに、値が消えないように）
  const toggled = (cur, keep) => (cur === v && !keep ? '' : v);
  // 人が押して選んだ欄は、AIの印を外す（号機は、AIの下書きで置き換えない）
  if (kind === 'line') { F.line = toggled(F.line, F.autoLine || aiMarked({ id: 'line' })); F.autoLine = false; dropAi('line'); }
  else if (own(PICKS, kind)) { F[kind] = toggled(F[kind], aiMarked({ id: kind })); dropAi(kind); }   // 原因の種類・結果・停止時間
  else if (kind === 'area') {
    const eq = canonEquip(F.equipment);
    if (F.area !== v && eq && equipOfArea(F.area).includes(eq) && !equipOfArea(v).includes(eq)) { F.equipment = ''; dropAi('equipment'); }   // 前の場所の設備は外す
    F.area = v;
    dropAi('area');
  }
  else if (kind === 'equip') { F.equipment = v; dropAi('equipment'); }
  else if (kind === 'sym') {
    // 症状の言葉：まだ種類に入っていなければ、文に足して症状の種類（symptomTags）にも入れる。入っていれば種類から外すだけ（文はそのまま）
    const tags = F.symptomTags || (F.symptomTags = []), ta = $('#fSym');
    if (tags.includes(v)) F.symptomTags = tags.filter(x => x !== v);
    else {
      F.symptom = F.symptom.trim() ? F.symptom.replace(/[、\s]+$/, '') + '、' + v : v;
      if (ta) { ta.value = F.symptom; ta.focus(); }
      unmarkAi('symptom');
      if (tags.length < MAX_TAGS) tags.push(v); else toast('症状の種類は' + MAX_TAGS + 'つまでです（文には足しました）');
    }
    dropAi('symptomTags');   // 人が選び直した種類は、AIの印を外す
    const st = $('#symTags');
    if (st) st.innerHTML = symTagsHtml(F);
    updateHint();
    return;
  }
  else if (kind === 'when') {   // 発生日時のチップ（いま・○分前）。触ったので「人が入れた」にする（autoFields に入れない）
    F.occurredAt = localStamp(new Date(Date.now() - (+v || 0) * 60000));
    F.autoAt = false;
    const d = $('#fDate');
    if (d) d.value = F.occurredAt;
    updateHint();
    return;
  }
  const y = window.scrollY;
  renderForm();
  window.scrollTo(0, y);
}
/* 記録する画面の文字の欄と、FORM の項目。fDraft：文章からの下書き（13-2）の文章。描き直しても消えないよう、FORM に持つ */
const FORM_INPUTS = { fDate: 'occurredAt', fAuthor: 'author', fEquip: 'equipment', fSym: 'symptom', fCause: 'cause', fAction: 'action', fFailed: 'failed', fDraft: 'draftText' };
/* かな漢字変換の途中の欄（AIの結果で描き直すときに、その欄の値は書き換えない） */
let COMPOSING = null;
document.addEventListener('compositionstart', e => { COMPOSING = e.target; });
document.addEventListener('compositionend', () => { COMPOSING = null; });
document.addEventListener('focusout', e => { if (e.target === COMPOSING) COMPOSING = null; });
document.addEventListener('input', e => {
  if (TAB !== 'record' || DETAIL || !FORM) return;
  const t = e.target;
  const map = FORM_INPUTS;
  // 人が直した欄は、AIの印を外す
  if (map[t.id]) {
    FORM[map[t.id]] = t.value;
    unmarkAi(map[t.id]);
    if (t.id === 'fDate') FORM.autoAt = false;   // 発生日時を触った →「人が入れた」（autoFields に入れない）
    if (t.id === 'fEquip') document.querySelectorAll('#eqChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === canonEquip(t.value)));
    if (t.id === 'fEquip' || t.id === 'fSym' || t.id === 'fDate') updateHint();   // 似たトラブル・設備の近い候補・7日以内の同じトラブル
  } else if (t.dataset.pf && FORM.parts[+t.dataset.i]) {
    FORM.parts[+t.dataset.i][t.dataset.pf] = t.value;
    unmarkAi('parts');
  } else if (t.dataset.xf) {
    FORM.extra[t.dataset.xf] = t.value;
    unmarkAi(t.dataset.xf);
  }
});
/* 設定の画面の「追加」（号機・場所・設備・症状の言葉・選択肢・入力項目） */
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-add]');
  if (!form) return;
  e.preventDefault();
  addFromForm(form);
});
document.addEventListener('toggle', e => {
  const el = e.target;
  if (!el.classList) return;
  if (el.classList.contains('addf')) SET_ADD_OPEN = el.open;
  if (el.classList.contains('dguide')) DRAFT_GUIDE_OPEN = el.open;
  if (el.classList.contains('rawd')) RAW_OPEN = el.open ? DETAIL : null;
  if (el.classList.contains('sarea')) { if (el.open) OPEN_AREAS.add(el.dataset.area); else OPEN_AREAS.delete(el.dataset.area); }
}, true);
$('#chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#chatIn'), photo = PENDING;
  if (!inp.value.trim() && !photo) return;
  PENDING = null;
  sendChat(inp.value, photo);
  inp.value = '';
});
$('#camBtn').addEventListener('click', openCamera);
$('#camIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  toast('写真を準備しています…');
  try {
    PENDING = await makePhoto(f, true);
    renderCam();
    $('#toast').classList.remove('show');   // 入力欄の上に写真が出たので「準備しています」は消す
  } catch (err) { toast(err.message); }
});
$('#syncChip').addEventListener('click', () => {
  if (!GAS_URL) { toast('共有の設定がまだなので、この端末の中だけに保存しています'); return; }
  if (!KEY || SYNC.state === 'key') { askKey(); return; }
  syncNow(true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('show'); });
async function deleteRecord(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return;
  if (!confirm(GAS_URL ? 'この記録を消しますか？（共有しているので、全員の画面から消えます）' : 'この記録を消しますか？')) return;
  r.deleted = true; r.updatedAt = new Date().toISOString(); r._dirty = true;
  delete r._fix; delete r._fixBase;   // 消した記録を、共有先の（消していない）記録の上に作り直して送らない
  await dbPut(r);
  const b = RETURN && RETURN.tab === TAB ? RETURN : null;
  DETAIL = null; RETURN = null;
  toast('消しました');
  render();
  if (b) goBackTo(b);   // フローの一覧から開いた記録：一覧のその位置へ戻る
  syncNow();
}

/* =========================================================
   17. サンプル（使い始めから中身があるように。保存も送信もしません）
   外装工程の点検項目をもとにした例です
   ========================================================= */
function buildSamples() {
  const rows = [
    // [何日前, ライン, 場所, 設備, 症状, 原因, 対処, 交換部品[名前, 型式]]
    [2, '3号ライン', '充填部', 'チャック開口吸盤', '袋を吸わず、チャックが開かない', '吸盤の破れ', '吸盤を新品に交換', [['チャック開口吸盤', 'SP-VP15']]],
    [9, '2号ライン', '充填部', 'チャック開口吸盤', 'チャックが開口しない（袋を吸着しない）', '吸盤の破れ（亀裂）', '吸盤を交換', [['チャック開口吸盤', 'SP-VP15']]],
    [16, '4号ライン', '充填部', 'チャック開口吸盤', '袋の吸着が弱い', '真空ホースの抜け', 'ホースを差し直して真空圧を確認', []],
    [27, '3号ライン', '充填部', 'チャック開口吸盤', '袋を吸わない', '', '吸盤を清掃して様子を見た', []],
    [5, '3号ライン', '充填部', 'チャック開口鉄爪', 'チャックが開かない', 'レギュレーター圧力が60kPa未満', 'レギュレーターを60kPa以上に調整', []],
    [12, '5号ライン', '充填部', 'アーム爪', '袋を掴めず落下する', 'アーム爪の開き量不足', '爪の開き量を調整', []],
    [20, '2号ライン', '充填部', 'トップシール', 'シール目が付かない（シール不良）', 'ヒーターカートリッジの断線', 'ヒーターカートリッジを交換', [['ヒーターカートリッジ', 'SP-HC200']]],
    [7, '4号ライン', '製袋部', 'ボビン', 'フィルムが蛇行する', 'ボビンブレーキの効きが弱い', 'ボビンブレーキを調整', []],
    [25, '3号ライン', '製袋部', '後サーボギア', '後サーボギアから異音', 'グリス切れ', 'グリスアップ', []],
    [31, '2号ライン', '製袋部', 'Rカット', 'Rカットの切れが悪く、異音がする', '刃の摩耗', 'Rカット刃を交換', [['Rカット刃', 'SP-RC30']]],
    [14, '5号ライン', '製袋部', '熱電対', 'シール温度が上がらない', '熱電対の断線', '熱電対を交換', [['熱電対', 'SP-TC-K']]],
    [10, '3号ライン', '均しコンベア', 'タイミングベルト', 'ベルトが蛇行して異音がする', 'ベルトの摩耗', 'タイミングベルトを交換', [['タイミングベルト', 'SP-TB600']]],
    [3, '4号ライン', '化粧箱機', '真空ポンプ', '箱立て吸引が弱い（40kPa未満）', 'フィルターの目詰まり', 'フィルターを清掃', []],
    [18, '2号ライン', '化粧箱機', 'テープユニット', 'テープが貼れない', 'テープの通し方が違う', 'テープを通し直した', []],
    [22, '5号ライン', '外箱機', 'ケースシーラー', 'テープが切れる', 'テープの通し方が悪い', 'テープを通し直して高さを確認', []],
  ];
  const base = new Date();
  return rows.map(([days, line, area, equipment, symptom, cause, action, parts], i) => {
    const d = new Date(base.getTime() - days * 86400000);
    d.setHours(9 + (i % 8), (i * 17) % 60, 0, 0);
    const occurredAt = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return { id: 's_' + pad(i + 1), sample: true, occurredAt, line, area, equipment, symptom, cause, action, author: 'サンプル',
      parts: parts.map(([name, model]) => ({ name, model, photo: null })), photos: [], deleted: false };
  });
}

/* =========================================================
   18. 起動
   ========================================================= */
(async function boot() {
  SAMPLES = buildSamples();
  try {
    await dbOpen();
    RECORDS = (await dbAll()) || [];
    META.author = (await metaGet('author')) || '';
    META.lastLine = (await metaGet('lastLine')) || '';
    const ss = await metaGet('showSamples');
    META.showSamples = ss !== false;
    META.oldRecNoted = (await metaGet('oldRecNoted')) === true;
    KEY = (await metaGet('key')) || '';
    const cfg = await metaGet('config');
    if (cfg && typeof cfg === 'object') {
      CFG.base = cfg.base || null;
      CFG.rev = Math.max(0, Math.floor(Number(cfg.rev)) || 0);
      CFG.pending = Array.isArray(cfg.pending) ? cfg.pending : [];
      // 「端末内のみ」で試していた設定は、共有を始めたら、共有先にまだ設定が無いときだけ最初の設定として送る
      if (GAS_URL && cfg.local && CFG.base) { CFG.pending = [{ op: 'seed', config: CFG.base }]; CFG.base = null; CFG.rev = 0; }
    }
    applyConfig();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    toast('この端末ではデータを保存できません（プライベートブラウズ等）');
  }
  FORM = newForm();
  render();
  syncNow();
  window.addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    // 開いたままの記録する画面に戻ったとき：何も入れていなければ、自動の発生日時をいまにする（描き直さずに、日時の欄だけ）
    if (TAB === 'record' && !DETAIL && refreshAutoAt()) { const d = $('#fDate'); if (d) d.value = FORM.occurredAt; updateHint(); }
    if (Date.now() - lastSyncTry > 15000) syncNow();
  });
  setInterval(() => { if (!document.hidden) syncNow(); }, AUTO_SYNC_MS);
})();
</script>
