<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トラブル記録">
<title>トラブル記録（包装工程）</title>
<!--
  トラブル記録（包装工程）
  ・その日のトラブルを記録する（設備・場所・症状・原因・対処・交換部品の型式と写真）
  ・記録が増えると、同じ設備の同じトラブルが自動で「フロー」にまとまる
  ・起きていることを文章で送ると、過去の記録から原因と対処を探す（チャット検索）
  ・その場で撮った写真も送れる（AIの設定があれば、写真から設備・見える異常・型式を読み取って探す）
  ・送ったチャットは、この端末に履歴として残し、あとで開き直せる（直近50件。写真は小さい写真だけ）
  ・入力欄の上で「調べる」にすると、型式・定格などをAIがWebで調べる（調べもの。サーバーが対応していて、AIが Claude のときだけ）
  保存：端末内（IndexedDB）に控えを持ち、GAS_URL を設定するとスプレッドシート＋ドライブで共有する（チャットの履歴は端末内だけ。記録とは別の保存）
-->
<style>
  /* 見た目の決まり：温かみのある白地・濃い文字・強調色は1色（押すボタンと、いま確かめる候補だけ）
     文字は読みやすさ重視の UD フォント（BIZ UDPゴシック）。見出しは明朝、型式や日時は等幅 */
  :root{
    --bg:#F5F3EE; --card:#FFFFFF; --ink:#1E1D1A; --ink2:#3B3934; --ink3:#5B5850; --ink4:#6B675E;
    --line:rgba(30,28,24,.12); --line2:rgba(30,28,24,.22);
    --fill:#ECE8DF; --tag:#E9E4D8; --me:#E9E5DB; --soft:#F2EFE8;
    --accent:#A94E28; --accent-soft:#F4E6DD;
    --ok:#3F7D4E; --ok-soft:#E4EFE6; --warn:#8A5A12; --warn-soft:#F7EBD7; --ng:#A93A2F; --ng-soft:#F6E1DC;
    --r:14px; --tabh:64px; --side:232px;
    --sans:'BIZ UDPGothic','BIZ UDPゴシック','Hiragino Sans','Noto Sans JP','Yu Gothic UI',Meiryo,sans-serif;
    --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
    --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
  button,input,textarea{font:inherit;color:inherit}
  input,textarea{font-size:16px} /* 16px未満だと iPhone で入力時に画面が拡大される */
  button{cursor:pointer}
  b,strong{font-weight:700}
  svg{flex:none}
  :focus-visible{outline:3px solid rgba(169,78,40,.5);outline-offset:2px}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .mono{font-family:var(--mono);font-weight:500}

  /* ---------- 枠組み ---------- */
  .top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:0 16px;padding-top:env(safe-area-inset-top)}
  .top .in{max-width:780px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
  .brand{flex:1;min-width:0;font-family:var(--serif);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink3);margin-left:8px}
  .sync{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line2);border-radius:999px;
    padding:0 12px;background:var(--card);font-size:13px;white-space:nowrap}
  .sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#9C9A92;flex:none}
  .sync.ok::before{background:var(--ok)}
  .sync.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:700}
  .sync.warn::before{background:#C58A1E}
  .sync.err{background:var(--ng-soft);border-color:transparent;color:var(--ng);font-weight:700}
  .sync.err::before{background:var(--ng)}
  main{max-width:780px;margin:0 auto;padding:20px 20px calc(var(--tabh) + 32px + env(safe-area-inset-bottom))}
  body.chat main{padding-bottom:calc(var(--tabh) + 100px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabs .in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tabs .in>button{border:0;background:none;min-height:var(--tabh);padding:8px 4px;font-size:13px;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .tabs .ic{display:flex}
  .tabs .in>button.on{color:var(--accent);font-weight:700}
  .chatbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:15;display:none;
    padding:8px 12px 12px;background:var(--bg)}
  body.chat .chatbar{display:block}
  .chatbar form{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;
    background:var(--card);border:1px solid var(--line2);border-radius:24px;box-shadow:0 1px 3px rgba(30,28,24,.06)}
  .chatbar form:focus-within{border-color:var(--ink3)}
  .chatbar input{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;padding:0}
  .chatbar form button{flex:none;width:44px;height:44px;border:0;border-radius:50%;padding:0;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center}
  /* 写真を撮って送る（入力欄の左のカメラ・送る前の確認） */
  .crow{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .crow form{flex:1;min-width:0;margin:0}
  .cambtn{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink2);
    padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(30,28,24,.06)}
  .camprev{max-width:780px;margin:0 auto 8px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;
    background:var(--card);border:1px solid var(--line);border-radius:16px}
  .camprev[hidden]{display:none}
  .camprev img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;display:block}
  .camprev .ct{flex:1;min-width:0;font-size:13px;line-height:1.55;color:var(--ink3)}
  .camprev .ct b{display:block;color:var(--ink);font-size:14px}
  .camprev .x2{width:44px;flex:none}
  body.chat.campending main{padding-bottom:calc(var(--tabh) + 180px + env(safe-area-inset-bottom))}

  /* ---------- 共通部品 ---------- */
  .ttl{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.4;margin:4px 0 6px}
  .sub{margin:0 0 8px;color:var(--ink3);font-size:14px;line-height:1.7}
  .muted{color:var(--ink4)}
  .badge{display:inline-block;font-size:12px;font-weight:400;padding:1px 8px;border-radius:6px;background:var(--tag);color:#4A463F;
    margin-left:6px;vertical-align:2px;line-height:1.6}
  .badge.sample{background:var(--tag);color:#4A463F}
  .badge.dirty{background:var(--warn-soft);color:var(--warn);font-weight:700}
  .btn{border:0;border-radius:12px;padding:0 18px;font-weight:700;min-height:48px;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.pri{background:var(--accent);color:#fff;width:100%;min-height:54px;font-size:17px}
  .btn.sub{background:var(--card);border:1px solid var(--line2)}
  .btn.danger{background:var(--card);border:1px solid var(--ng);color:var(--ng)}
  .btn.sm{min-height:44px;padding:0 14px;font-size:14px}
  .btn.dash{border-style:dashed;background:transparent;color:var(--ink2);font-weight:400}
  .btnrow{display:flex;gap:8px;margin-top:16px}
  .btnrow .btn{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px;font-size:15px;
    display:inline-flex;align-items:center;gap:8px;line-height:1.4}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .chip.sug{background:var(--fill);border-color:transparent;min-height:40px;font-size:14px;border-radius:10px}
  .chip.sug.on{background:var(--ink);color:#fff}
  .chip.pill{border-radius:999px;min-height:40px;font-size:14px}
  .chips.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .chips.grid4 .chip{justify-content:center;min-height:48px;font-size:16px;padding:0 4px}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;margin:0 0 16px;
    font-weight:700;font-size:14px;line-height:1.7}
  .banner.ok{background:var(--ok-soft);color:#2F5E3B}
  .banner .btn{margin-top:8px}
  .toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;
    max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  /* 拡大した写真は、どこを押しても閉じる（document の click で閉じる）。iPhone は、cursor:pointer が無いところをタップしても click が起きない（閉じない） */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(20,19,18,.92);display:none;align-items:center;justify-content:center;padding:16px;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:8px}

  /* ---------- 記録の一覧（行） ---------- */
  .rc{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--line);padding:14px 4px;margin:0;border-radius:0}
  .rc:hover{background:rgba(30,28,24,.03)}
  .rc.hl{background:var(--accent-soft)}
  .rc .t{font-weight:700;font-size:16px;line-height:1.5}
  .rc .m{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13px;color:var(--ink3);line-height:1.6}
  .rc .m .badge{margin-left:0}
  .rc .a{font-size:14px;line-height:1.6;color:var(--ink2)}

  /* ---------- 探す（会話） ---------- */
  .msg{display:flex;margin:20px 0;scroll-margin-top:76px}
  .msg.me{justify-content:flex-end}
  .bub{max-width:86%;min-width:0}
  .msg.me .bub{background:var(--me);padding:12px 16px;border-radius:18px 18px 6px 18px;white-space:pre-wrap;line-height:1.6}
  .msg.me .bub.img{padding:6px;width:232px}
  .msg.me .bub.img .ct{padding:6px 10px 4px}
  .chatimg{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:13px 13px 4px 13px;background:var(--fill);cursor:pointer}   /* 押すと拡大。cursor:pointer が無いと、iPhone ではタップしても押したことにならない */
  .msg.bot .bub{width:100%;max-width:100%;font-size:16.5px;line-height:1.8}
  .hello{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.4;margin:12px 0 8px}
  .hello-sub{margin:0;color:var(--ink3);font-size:15px;line-height:1.75}
  .found{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink3);margin-bottom:10px}
  .found::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .found .mono{font-size:13px;color:var(--ink4)}
  .lead{margin:0}
  .h3{font-size:13px;font-weight:700;color:var(--ink3);margin:24px 0 6px;letter-spacing:.04em;line-height:1.5}
  /* 可能性の高い順（①②③の候補）。強調色は、いま確かめる候補（いちばん可能性が高い・次に確認）だけ */
  .rk-lead{margin:0 0 4px}
  .rk-how{font-size:13px;line-height:1.7;color:var(--ink4);margin:0 0 14px}
  .rk{display:flex;flex-direction:column;gap:12px}
  .rcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px}
  .rcard.rnow{border:1.5px solid var(--accent)}
  .rn{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
    background:var(--fill);color:var(--ink2)}
  .rcard.rnow .rn{background:var(--accent);color:#fff}
  .rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .rl{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink4);line-height:1.5}
  .rcard.rnow .rl{color:var(--accent)}
  .rt{font-size:16.5px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
  .rcard.rnow .rt{font-size:18px}
  .rwhere{font-size:13.5px;line-height:1.6;color:var(--ink4);overflow-wrap:anywhere}
  .rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13.5px;line-height:1.7;color:var(--ink3)}
  .fix{display:inline-flex;align-items:center;gap:6px}
  .fixbar{display:inline-flex;width:72px;height:6px;border-radius:3px;background:#E9E5DB;overflow:hidden}
  .fixbar i{background:var(--ok)}
  .fixbar u{background:#C9B48A;text-decoration:none}
  .ra{font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
  .ra .ok{display:inline-block;font-size:12px;font-weight:700;color:#2F5E3B;background:var(--ok-soft);border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:1px}
  .rbody .pchips{margin-top:2px}
  .rng{align-self:flex-start;font-size:13.5px;line-height:1.6;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:4px 10px;overflow-wrap:anywhere}
  .rbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .rbtn .chip{min-height:40px;font-size:14px}
  .rbtn .chip svg{transition:transform .15s}
  .rbtn .chip[aria-expanded="true"] svg{transform:rotate(90deg)}
  .chip.ngb{color:var(--ink3)}
  .rkev{margin-top:4px;border-top:1px solid var(--line)}
  .rkev .more{font-size:13px;color:var(--ink4);padding-top:6px}
  /* 確認して違った候補 */
  .rcard.done{background:var(--soft);border-style:dashed}
  .rcard.done .rt{color:var(--ink4);text-decoration:line-through;text-decoration-color:rgba(30,28,24,.35)}
  .rcard.done .rn{background:transparent;border:1.5px solid var(--line2);color:var(--ink4)}
  .donel{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink3);background:var(--fill);
    border-radius:6px;padding:1px 8px;line-height:1.6}
  .chip.none{width:100%;justify-content:center;border-style:dashed;color:var(--ink2);font-weight:700}
  .rkmore{margin-top:12px;scroll-margin-top:76px}
  .rkmore>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
  .rkmore>summary::-webkit-details-marker{display:none}
  .rkmore>summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--ink3);border-bottom:1.8px solid var(--ink3);transform:rotate(45deg);margin:0 0 4px 2px}
  .rkmore[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
  .rkmore>.rk{margin-top:4px}
  /* 次の手（①〜③がどれも違ったとき） */
  .nx{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .nxh{font-size:17px;font-weight:700;line-height:1.5}
  .nxs{font-size:14px;line-height:1.7;color:var(--ink3);margin:-6px 0 0}
  .nxa{display:grid;grid-template-columns:36px minmax(0,1fr) 18px;gap:2px 12px;align-items:center;width:100%;margin:0;padding:12px;
    border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;line-height:1.5}
  .nxa.info{grid-template-columns:36px minmax(0,1fr)}
  .nxa .ic{grid-row:1 / span 2;width:36px;height:36px;border-radius:10px;background:var(--fill);color:var(--ink2);display:flex;align-items:center;justify-content:center}
  .nxa.pri{border-color:var(--accent);background:var(--accent-soft)}
  .nxa.pri .ic{background:var(--accent);color:#fff}
  .nxa .nt{font-size:15.5px;font-weight:700}
  .nxa .ns{grid-column:2;font-size:13.5px;color:var(--ink3);line-height:1.55}
  .nxa .ar{grid-row:1 / span 2;grid-column:3;color:var(--ink4);display:flex}
  /* AIの対処案 */
  .chip.aichip{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-height:48px;padding:0 18px}
  .aibox{margin-top:20px;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    display:flex;flex-direction:column;gap:12px;line-height:1.7}
  .aibox .h3{margin:4px 0 0}
  .aibox .chips{margin-top:0}
  .aibox.err{border-color:transparent;background:var(--ng-soft);color:#5C1F18;font-size:15px}
  .aih{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;line-height:1.5}
  .aih svg{color:var(--accent)}
  .aibox.err .aih{color:var(--ng)}
  .aibox.err .aih svg{color:var(--ng)}
  .aih .badge{margin-left:auto}
  .aibox.busy .aih svg{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .ais{font-size:16px;line-height:1.8}
  .aisteps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:16px}
  .aisteps li{counter-increment:st;position:relative;padding-left:42px;margin:0;font-size:16px;line-height:1.7}
  .aisteps li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .aisteps li>b{font-size:17px}
  .air{font-size:13px;color:var(--ink3);margin-top:2px}
  .aigen{margin:0;padding-left:20px;font-size:15px;line-height:1.8;color:var(--ink2)}
  .aisafe{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:#3D2A12;font-size:15px;line-height:1.7}
  .aisafe svg{margin-top:3px}
  .aifoot{font-size:12px;line-height:1.7;color:var(--ink4)}
  /* AIの作業手順（①②③のタブ・段階つきの手順）と、AIからの質問（聞き直し） */
  .ptabs{display:flex;gap:6px;flex-wrap:wrap}
  .ptabs button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:40px;line-height:1.4}
  .ptabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .ptabs button.done:not(.on){color:var(--ink4);border-style:dashed}
  .pload{display:flex;flex-direction:column;gap:2px;font-size:15px}
  .perr{padding:12px 14px;border-radius:12px;background:var(--ng-soft);color:#5C1F18;font-size:15px;line-height:1.7;overflow-wrap:anywhere}
  .perr .chips{margin-top:8px}
  .proc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
  .proc li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:16px}
  .proc li:last-child{padding-bottom:0}
  .proc li:not(:last-child)::after{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--line)}
  .pn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--card);z-index:1}
  .pb{min-width:0}
  .pk{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink4);line-height:1.5}
  .pt{font-size:16.5px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
  .pd{font-size:15px;line-height:1.7;color:var(--ink2);overflow-wrap:anywhere}
  .judge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:14px;line-height:1.6;margin-top:4px;overflow-wrap:anywhere}
  .judge b.okk{color:var(--ok)}
  .judge b.ngk{color:var(--ng)}
  .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .gen{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 8px;line-height:1.6;vertical-align:1px}
  .nextc{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:0;border:0;border-radius:12px;padding:10px 12px;background:var(--soft);
    font-size:14.5px;line-height:1.6;color:var(--ink2);text-align:left}
  .nextc span{flex:1;min-width:0;overflow-wrap:anywhere}
  .aifb.in{margin-top:0}
  .aifb.in .chip{background:var(--card);border-color:var(--line2)}
  .qa{display:flex;flex-direction:column;gap:6px}
  .qa .qt{font-size:15px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
  .qa .chips{margin-top:0}
  .qa .chip{min-height:40px;font-size:14px}
  .qa .chip:disabled{cursor:default}
  .qa .chip:disabled:not(.on){color:var(--ink4)}
  .nchk{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.7;color:var(--ink2)}
  .nchk .rchips{margin-top:4px}
  .aibox .h3 .gen{margin-left:6px;letter-spacing:0}
  .naskb{margin-top:12px}
  .nend{font-size:13px;line-height:1.7;color:var(--ink4);margin-top:10px}
  /* 調べもの（Web）（見本7〜9）。入力欄の上の切り替え［探す］［調べる］は、調べものに対応したサーバー（版5）でAIが使えるときだけ出す */
  .mode{max-width:780px;margin:0 auto 8px;display:flex;align-items:center;gap:6px;padding:0 2px}
  .mode[hidden]{display:none}
  .mode button{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);
    background:var(--card);font-size:14px;color:var(--ink2);font-weight:700;line-height:1}
  .mode button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .mode .mnote{margin-left:auto;min-width:0;font-size:12px;color:var(--ink4);white-space:nowrap}
  @media (max-width:359px){ .mode .mnote{display:none} }   /* 狭いスマホでは、折り返さないよう「1〜3分」の案内は出さない */
  .cambtn[hidden],.camprev.lkhide{display:none}   /* 「調べる」の間は写真を送らない（撮った写真は残しておき、「探す」に戻すと出す） */
  body.chat.lkon main{padding-bottom:calc(var(--tabh) + 142px + env(safe-area-inset-bottom))}   /* 切り替えの分だけ、入力欄が高くなる */
  body.chat.lkon.campending:not(.lkmode) main{padding-bottom:calc(var(--tabh) + 222px + env(safe-area-inset-bottom))}
  .msg.me .bub .mtag{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:2px;white-space:normal}
  .lkmeta{font-size:13px;color:var(--ink3);margin:-4px 0 2px;line-height:1.6}
  .lk{overflow-wrap:anywhere}
  .lk p{margin:0 0 10px;font-size:16px;line-height:1.8}
  .lk p:last-child{margin-bottom:0}
  .cite{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;margin:0 1px;border:0;border-radius:6px;
    background:var(--fill);color:var(--ink2);font-size:12px;font-weight:700;line-height:1;vertical-align:2px;font-family:var(--mono)}
  .lkpart{padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:700;line-height:1.6}
  .lknone{padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink2);font-size:14px;line-height:1.6}
  .srcs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
  .srcs li{scroll-margin-top:76px;scroll-margin-bottom:200px}
  .srcs a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--soft);color:inherit;text-decoration:none;transition:background .3s,border-color .3s}
  .srcs li.hl a{border-color:var(--accent);background:var(--accent-soft)}
  .srcs .n{grid-row:1 / span 2;width:24px;height:24px;border-radius:7px;background:var(--fill);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;color:var(--ink2)}
  .srcs .t{font-size:15px;font-weight:700;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
  .srcs .tag{display:inline-block;font-size:11px;font-weight:700;color:#4A463F;background:var(--tag);border-radius:5px;padding:0 6px;margin-left:6px;line-height:1.6;vertical-align:1px}
  .srcs .u{grid-column:2;font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere;line-height:1.5}
  .read{font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:flex-start;line-height:1.6}
  .read b{color:var(--ink2);font-weight:700;white-space:nowrap}
  .read .rdl{display:flex;flex-direction:column;gap:2px;min-width:0}
  .read a{color:var(--ink3);overflow-wrap:anywhere;text-underline-offset:3px;text-decoration-color:var(--line2)}
  .lkinfo{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#EEF3F7;color:#1F3A52;font-size:14.5px;line-height:1.65}
  .lkinfo svg{margin-top:2px}
  .lkwait{font-size:14.5px;line-height:1.7}
  .waitbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:4px}
  .waitbar i{display:block;height:100%;width:38%;border-radius:3px;background:var(--accent);opacity:.7;animation:lkbar 1.8s ease-in-out infinite}
  @keyframes lkbar{0%{transform:translateX(-105%)}100%{transform:translateX(265%)}}
  .lkerr{display:flex;flex-direction:column;gap:6px}
  .lkerr .lkagain{font-size:13.5px;color:#5C1F18;opacity:.85}
  /* 記録する画面と詳細の「調べたこと」（見本10） */
  .f .lnote2{display:block;font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:2px;line-height:1.6}
  textarea.inp.lkfield{min-height:230px;line-height:1.7}
  .lkhint{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
  .lkd{margin:2px 0 0;padding:10px 12px;border-radius:12px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:15px;color:var(--ink2)}
  .lkdn{font-size:12.5px;color:var(--ink3);margin:4px 0 16px;line-height:1.6}
  /* 写真から読み取ったこと */
  .vbox{margin:0 0 18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    display:flex;flex-direction:column;gap:10px;line-height:1.7}
  .vbox .chips{margin-top:0}
  .vbox.err{border-color:transparent;background:var(--ng-soft);color:#5C1F18;font-size:15px}
  .vbox.err .aih,.vbox.err .aih svg{color:var(--ng)}
  .vbox.plain{background:transparent;border-style:dashed;font-size:15px;color:var(--ink2)}
  .vbox.busy .aih svg{animation:pulse 1.4s ease-in-out infinite}
  .vrow{display:flex;align-items:baseline;gap:4px;font-size:16px;line-height:1.7}
  .vrow .k{flex:none}
  .vrow .v{flex:1;min-width:0;overflow-wrap:anywhere}
  .vrow .pchips{margin-top:0}
  .vretake{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.7;color:var(--ink2)}
  .vq{font-size:13px;color:var(--ink3);margin:-4px 0 12px;overflow-wrap:anywhere}

  /* ---------- チャットの履歴（パソコン：左のメニューの下。スマホ：上の［≡］で左から出す一覧） ---------- */
  .hbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink2);
    padding:0;display:flex;align-items:center;justify-content:center}
  .hist{display:flex;flex-direction:column;gap:2px}
  .newc{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0 0 8px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);
    background:var(--card);font-weight:700;font-size:15px;color:var(--ink);text-align:left}
  .hg{font-size:12px;font-weight:700;color:var(--ink4);letter-spacing:.04em;padding:10px 12px 4px;line-height:1.5}
  .hi{position:relative;border-radius:10px}
  .hio{display:flex;flex-direction:column;gap:2px;width:100%;min-height:44px;margin:0;padding:7px 12px;border:0;border-radius:10px;background:none;
    text-align:left;font-size:14px;line-height:1.4;color:var(--ink2);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .hio .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:anywhere}   /* 題名は2行まで */
  .hio .m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink4)}
  .hi.on{background:rgba(30,28,24,.07)}
  .hi.on .hio{color:var(--ink);font-weight:700}
  .hi.on .hio .m{color:var(--ink3)}   /* 色を付けた行の上でも読める濃さに */
  /* 消す［✕］は、マウスを乗せたとき（キーで選んだとき）だけ右に重ねて出す（ふだんは題名を幅いっぱいに出す） */
  .hi .del{position:absolute;right:6px;top:50%;margin-top:-13px;width:26px;height:26px;border:0;border-radius:8px;padding:0;background:var(--fill);
    color:var(--ink4);display:flex;align-items:center;justify-content:center;visibility:hidden}
  @media (hover:hover){ .hi:not(.on):hover{background:rgba(30,28,24,.04)} .hi:hover .hio{padding-right:38px} .hi:hover .del{visibility:visible} }
  .hi:focus-within .hio{padding-right:38px}
  .hi:focus-within .del{visibility:visible}
  .rb{font-size:10.5px;font-weight:700;color:#2F5E3B;background:var(--ok-soft);border-radius:5px;padding:0 5px;line-height:1.6}   /* 小さい字なので濃い緑（ほかの緑の札と同じ） */
  .hnone{font-size:13px;color:var(--ink4);padding:10px 12px;line-height:1.6}
  .hnote{font-size:11.5px;color:var(--ink4);padding:10px 12px 0;line-height:1.5}
  .hside{display:none}
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(30,28,24,.38);touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}   /* cursor:pointer が無いと、iPhone ではタップしても押したことにならない（閉じない） */
  .drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:84%;max-width:340px;background:#EEEBE3;box-shadow:4px 0 24px rgba(0,0,0,.18);
    padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .scrim[hidden],.drawer[hidden]{display:none}
  .drawer .dh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 10px}
  .drawer .dh b{font-size:17px}
  .dlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  html.dlock,html.dlock body{overflow:hidden}   /* 一覧を出している間は、うしろの画面を動かさない */
  /* スマホ：上に［≡］［＋］を出すので、「トラブル記録」が切れないよう詰める（包装工程・同期の時刻は出さない） */
  @media (max-width:1023px){
    .top .in{gap:6px}
    .brand{font-size:18px}
    .brand small,.sync .tm{display:none}
    .sync{padding:0 10px;gap:6px}
    /* 右上の文字が長いとき（合言葉を入力・未送信 など）は、もう少し詰める */
    .top.lng .in{gap:4px}
    .top.lng .brand{font-size:17px}
    .top.lng .sync{padding:0 8px}
    /* 「オフライン・未送信1」のように2つのことを出すときは、「・」のあとで2行に折る（1行だと「トラブル記録」が切れる） */
    .sync.two{white-space:normal;word-break:keep-all;max-width:96px;line-height:1.15;font-size:11.5px}
  }
  @media (max-width:380px){
    .top{padding-left:12px;padding-right:12px}
    .top .in{gap:4px}
    .brand,.top.lng .brand{font-size:16px}
    .sync{font-size:12px;padding:0 8px}
    .top.lng .sync{font-size:11px;gap:4px;padding:0 7px}
  }

  /* ---------- フロー ---------- */
  .flow{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
  .flow>summary{list-style:none;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .flow>summary::-webkit-details-marker{display:none}
  .flow[open]>summary{border-bottom:1px solid var(--line)}
  .fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .fa{font-size:13px;color:var(--ink3);line-height:1.5}
  .fa b{color:var(--ink)}
  .fc{font-family:var(--mono);font-weight:500;font-size:14px;white-space:nowrap}
  .fs{font-weight:700;font-size:17px;line-height:1.5}
  .fm{font-size:14px;line-height:1.6;color:var(--ink2)}
  .ftbody{padding:14px 16px 16px}
  .ft{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.6}
  .ft .ft{margin:8px 0 0 10px;padding-left:16px;border-left:1.5px solid #D6D1C4;gap:10px}
  .k{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;margin-right:8px;vertical-align:1px;line-height:1.6;
    background:var(--tag);color:var(--ink2)}
  .k.cau{background:var(--ink);color:#fff}
  .cnt{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink3);margin-left:8px;white-space:nowrap}
  .pchips,.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--soft);border-radius:8px;padding:4px 10px;line-height:1.5}
  .pchip .mono{font-size:12.5px}
  .rchip{min-height:36px;font-family:var(--mono);font-weight:500;font-size:12.5px;border:1px solid var(--line2);background:var(--card);
    border-radius:10px;padding:0 10px;color:var(--ink);display:inline-flex;align-items:center}
  .rchip.hl{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;margin:10px 0 2px}
  .seg button{border:0;background:none;border-radius:9px;min-height:40px;padding:0 16px;font-weight:700;font-size:14px;color:var(--ink3)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(30,28,24,.12)}
  .linkbtn{border:0;background:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0;
    font-size:14px;margin-top:8px}

  /* ---------- 詳細 ---------- */
  .steps{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:16px 0}
  .step{display:flex;gap:4px;align-items:baseline;padding:10px 0}
  .step .k{flex:none}
  .step .v{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px;line-height:1.7}
  .arrow{color:#B0ACA2;padding-left:16px;line-height:1;font-size:14px}
  .meta{font-size:13px;color:var(--ink3)}

  /* ---------- 入力 ---------- */
  .f{margin:22px 0}
  .l{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  .req{color:var(--accent);font-size:12px;font-weight:400;margin-left:6px}
  .inp{width:100%;border:1px solid var(--line2);border-radius:12px;padding:0 14px;min-height:48px;background:var(--card)}
  .inp:focus{border-color:var(--ink3)}
  textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.6}
  .part{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px 36px;gap:6px;align-items:center;margin-bottom:8px}
  .part .inp{padding:0 12px}
  .part input[data-pf="model"]{font-family:var(--mono)}
  .x2{border:0;background:none;color:var(--ink3);font-size:18px;min-height:44px;padding:0}
  .photos{display:flex;flex-wrap:wrap;gap:10px}
  .ph{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:var(--fill);padding:0;flex:none}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}   /* 押すと拡大。cursor:pointer が無いと、iPhone ではタップしても押したことにならない */
  .ph.sm{width:48px;height:48px;border-radius:12px}
  .ph .x{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;
    background:rgba(20,19,18,.66);color:#fff;font-size:12px;line-height:26px;padding:0}
  .addph{width:96px;height:96px;border:1.5px dashed var(--line2);border-radius:14px;background:var(--card);
    color:var(--ink2);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
  .addph.sm{width:48px;height:48px;border-radius:12px}
  .hint{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:14px 16px;
    border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .hint .ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .hint .hk{font-size:15px;font-weight:700;line-height:1.5}
  .hint .hs{font-size:13px;line-height:1.6;color:var(--ink3)}
  .hint svg{color:var(--ink3)}
  .savebar{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:5;margin:24px -20px 0;
    padding:12px 20px 14px;background:var(--bg);border-top:1px solid var(--line)}
  .savebar .two{display:grid;grid-template-columns:1fr 2fr;gap:8px}
  .savebar .note{margin:8px 0 0;text-align:center;font-size:12px;color:var(--ink3)}
  .err{color:var(--ng);font-weight:700;font-size:14px;margin:12px 0}
  .err:empty{display:none}
  @media (max-width:360px){ .part{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 48px 30px} }
  /* 詳細の「そのほかの項目」（設定で足した項目） */
  .xbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin:8px 0 16px}
  .xrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.6}
  .xrow:last-child{border-bottom:0}
  .xk{flex:none;width:38%;color:var(--ink3);font-size:14px}
  .xv{flex:1;min-width:0;overflow-wrap:anywhere}
  /* 文章で書く（AIが各欄に振り分け）。枠は AIの対処案（.aibox）と同じ */
  .dbox{margin:16px 0 4px;padding:16px;gap:10px}
  .dsub{margin:0;color:var(--ink3);font-size:14px;line-height:1.7}
  .dctx{margin:0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:14px;line-height:1.6;color:var(--ink2);overflow-wrap:anywhere}
  .dbox textarea.inp{min-height:112px}
  .dbox .btn{width:100%}
  .dbox .btn:disabled{opacity:.6;cursor:progress}
  .dres{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.7}
  .dres:empty{display:none}
  .dmsg{padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:#2F5E3B;font-weight:700}
  .dmsg.none{background:var(--soft);color:var(--ink2);font-weight:400}
  .dmsg.err{background:var(--ng-soft);color:#5C1F18;font-weight:400}

<script>
'use strict';

/* 文字（BIZ UDPゴシックなど）は、画面が出てから読み込む。電波が弱くても表示を待たせず、読めなければ端末の文字で表示する */
window.addEventListener('load', () => {
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500&family=Shippori+Mincho:wght@600&display=swap';
  document.head.appendChild(l);
});

/* =========================================================
   1. 設定
   空のままだと「端末内のみ」で動きます（試用向け）。
   チームで共有するには「セットアップ手順.md」に沿って
   Apps Script の URL を貼り付けてください。
   ========================================================= */
const GAS_URL = '';

/* =========================================================
   2. マスタ（外装工程 日常点検チェックリストの言葉に合わせています）
   ここにあるのは「最初の値」です。号機（ライン）・場所・設備・症状の言葉・入力項目は、
   アプリの「設定」（右上）でいつでも追加・削除できます。共有しているときは、
   スプレッドシートのシート「設定」に保存され、チーム全員のアプリに反映されます（4-2）
   ========================================================= */
const DEFAULT_LINES = ['2号ライン', '3号ライン', '4号ライン', '5号ライン'];
const DEFAULT_AREAS = {
  '製袋部': ['ボビン', 'ボビンブレーキ', 'フィルム繰出し', '熱電対', 'ヒーターカートリッジ', '後サーボローラー', '後サーボギア',
    'Rカット', '駆動チェーン', '減速機チェーン', 'シール', 'メクリ吸引', '受渡し吸引', 'テンション', 'チャック繰出しテンションバー', '印字検査装置'],
  '充填部': ['チャック開口吸盤', 'チャック開口鉄爪', 'レギュレーター', '第3開口吸盤', '案内ベラ', 'アーム爪', '6工程ユニット',
    'トップシール', '冷却シール', '受渡し部カム', 'ベアリング', '減速機チェーン', '受渡し部爪', '8工程爪'],
  '均しコンベア': ['タイミングベルト', 'コンベア'],
  '化粧箱機': ['真空ポンプ', 'テープユニット', 'シート吸引', '箱立て吸引', '移載チャック'],
  '外箱機': ['真空ポンプ', 'ケースシーラー', '集積', 'シート吸引', '積付'],
};
const AREA_ALIASES = { '製袋部': ['製袋'], '充填部': ['充填', '充てん'], '均しコンベア': ['均し', 'ならし'], '化粧箱機': ['化粧箱'], '外箱機': ['外箱'] };
const EQUIP_ALIASES = {
  'チャック開口吸盤': ['開口吸盤', 'チャック吸盤'], '第3開口吸盤': ['第三開口吸盤', '3開口吸盤', '第3吸盤'],
  'チャック開口鉄爪': ['鉄爪', '開口鉄爪'], '後サーボローラー': ['サーボローラー'], '後サーボギア': ['サーボギア', 'サーボギヤ'],
  'ヒーターカートリッジ': ['カートリッジヒーター'], 'チャック繰出しテンションバー': ['テンションバー'],
  '印字検査装置': ['印字検査'], 'タイミングベルト': ['タイミングベルト'], 'ケースシーラー': ['シーラー'], 'Rカット': ['アールカット'],
};
/* 症状をすばやく入れるための言葉 */
const DEFAULT_SYMPTOMS = ['異音', '吸着しない', '開口しない', '破れ', 'シール不良', '停止', '噛み込み', 'ズレ・蛇行', '漏れ', '汚れ'];
/* 入力項目。ここにあるのは、もともとある項目（「設定」で名前を変えたり、使わないようにしたりできる）。
   core は検索とフローの土台なので、消したり任意にしたりできない。「設定」で足した項目の id は x_ で始まる。
   req は既定で必須にする項目（結果・原因の種類・停止時間：AIの答えの精度のため。core と違い「設定」で任意にできる。
   前の版の設定に無ければ、必須で足す） */
const BUILTIN_FIELDS = [
  { id: 'occurredAt', label: '発生日時', short: '発生日時', core: true },
  { id: 'line', label: 'ライン', short: 'ライン' },
  { id: 'area', label: '場所', short: '場所', core: true },
  { id: 'equipment', label: '設備・部位', short: '設備', core: true },
  { id: 'symptom', label: '起きたこと（症状）', short: '症状', core: true },
  { id: 'causeType', label: '原因の種類', short: '原因の種類', req: true },
  { id: 'cause', label: '原因', short: '原因' },
  { id: 'action', label: '対処したこと', short: '対処' },
  { id: 'failed', label: '効かなかった対処', short: '効かなかった対処' },
  { id: 'result', label: '結果', short: '結果', req: true },
  { id: 'downtime', label: '停止時間', short: '停止時間', req: true },
  { id: 'parts', label: '交換した部品（型式・写真）', short: '部品' },
  { id: 'photos', label: '写真（4枚まで）', short: '写真' },
  { id: 'author', label: '記録者', short: '記録者' },
];

/* =========================================================
   4. 端末内の保存（IndexedDB）
   写真も入れるので、容量の小さい localStorage は使いません
   保存は2つに分けています。
   ・trouble_log_v1   ：記録・設定・合言葉など（records・meta）。前の版のアプリと同じ作りで、版1のまま使う（版を上げない）
   ・trouble_log_chats：チャットの履歴（chats）だけ（12-2）
   チャットの履歴を trouble_log_v1 に足すと、その版を上げることになる。版を上げると、
   ・アプリを前の版に戻したとき、前の版は版1で開こうとして開けず（VersionError）、どの端末でも記録が読めなくなる
   ・前の版のアプリを別のタブで開いたままだと、版を上げられずに待たされる（そのタブを閉じてもらうしかない）
   別の保存にしておけば、trouble_log_v1 は版1のまま。前の版に戻しても記録・設定はそのまま読め（前の版は trouble_log_chats を見ないだけ）、
   前の版のタブを開いたままでも、待たずに開ける
   ========================================================= */
const DB_NAME = 'trouble_log_v1', CDB_NAME = 'trouble_log_chats';
// DB：記録・設定の保存へのつなぎ。CDB：チャットの履歴の保存へのつなぎ（開けなければ null のまま。履歴を端末に残さないだけで、ほかはふつうに使える）。
// DB_GONE：新しい版のアプリに譲って閉じた保存の名前（そのあと書こうとしたら知らせる）
let DB = null, CDB = null, dbWarned = false;
const DB_GONE = new Set();
const DB_BLOCKED_MSG = 'ほかのタブで開いているトラブル記録を閉じてから、開き直してください';
const DB_GONE_MSG = 'アプリが新しくなりました。このタブを閉じて、開き直してください（このタブでは端末に保存できません）';
/* 保存を1つ開く。version を渡さなければ、いまの版のまま開く（はじめての端末では版1で作る）。
   upgrade：作るとき（版を上げるとき）に入れ物を作る。set：開いたつなぎを置く（譲って閉じたら null） */
function dbOpenOne(name, version, upgrade, set) {
  return new Promise((resolve, reject) => {
    const req = version ? indexedDB.open(name, version) : indexedDB.open(name);
    req.onupgradeneeded = () => upgrade(req.result);
    // 版を上げるとき、前の版のアプリを別のタブで開いていると、版を上げられずに待つ。画面が空のままにならないよう、閉じてもらう案内を出す。
    // 待っている間は、まだ記録もチャットも読んでいないので、押せないようにする（送ったものが起動の続きで消えないように。起動で戻す）。
    // いまは、どちらの保存も版を上げないので起きない（この先、版を上げるときのために残す）
    req.onblocked = () => { toast(DB_BLOCKED_MSG); $('#view').innerHTML = `<div class="banner">${esc(DB_BLOCKED_MSG)}</div>`; document.body.inert = true; };
    req.onsuccess = () => {
      const db = req.result;
      // 新しい版のアプリが別のタブで、この保存の版を上げようとしたら、こちらは閉じて譲る（向こうを待たせない）。
      // このタブでは、もうこの保存に書けないので、書こうとしたときに知らせる（黙って消えないように）
      db.onversionchange = () => { db.close(); set(null); DB_GONE.add(name); toast(DB_GONE_MSG); };
      set(db);
      resolve(db);
    };
    req.onerror = () => reject(req.error);
  });
}
/* 2つの保存を同時に開く。記録・設定の保存が開けなければ投げる（起動で「保存できません」と知らせる）。
   チャットの履歴の保存は、開けなくても投げない（履歴を残さないだけ） */
function dbOpen() {
  // 版を渡さない：前の版の端末（版1）は版1のまま開く。はじめての端末では、前の版のアプリと同じ作り（records・meta）で版1を作る
  const main = dbOpenOne(DB_NAME, 0, db => {
    if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id' });
    if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
  }, db => { DB = db; });
  const chats = dbOpenOne(CDB_NAME, 1, db => {
    if (!db.objectStoreNames.contains('chats')) db.createObjectStore('chats', { keyPath: 'id' });
  }, db => { CDB = db; }).catch(() => null);
  return Promise.all([main, chats]);
}
/* 入れ物（store）の操作。chats はチャットの履歴の保存、ほかは記録・設定の保存 */
function idb(store, mode, op) {
  const name = store === 'chats' ? CDB_NAME : DB_NAME, db = store === 'chats' ? CDB : DB;
  if (!db) { if (DB_GONE.has(name) && mode === 'readwrite') toast(DB_GONE_MSG); return Promise.resolve(undefined); }
  return new Promise(resolve => {
    try {
      const tx = db.transaction(store, mode), req = op(tx.objectStore(store));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = tx.onabort = () => { if (!dbWarned) { dbWarned = true; toast('端末への保存に失敗しました（空き容量をご確認ください）'); } resolve(undefined); };
      // 書き込みは、すぐ確定させる（閉じる・再読み込みの直前に書いたものが、確定する前に捨てられないように）。
      // どの操作も1回の依頼だけなので、早く確定しても困らない。中止ずみなら投げるが、onabort で知らせる
      if (mode === 'readwrite' && tx.commit) { try { tx.commit(); } catch (e) { /* 中止ずみ：onabort で知らせる */ } }
    } catch (e) { resolve(undefined); }
  });
}
const dbAll = () => idb('records', 'readonly', s => s.getAll());
const dbPut = rec => idb('records', 'readwrite', s => s.put(rec));
const dbDel = id => idb('records', 'readwrite', s => s.delete(id));
const metaGet = k => idb('meta', 'readonly', s => s.get(k));
const metaSet = (k, v) => idb('meta', 'readwrite', s => s.put(v, k));

/* =========================================================
   4-2. 設定（号機・場所・設備・症状の言葉・入力項目）
   設定の変更は「操作」（例：号機「6号ライン」を追加）として持ち、確定している設定にかけて使う。
   共有しているときは、変えた設定を「もとにした版」と一緒に送る。その間にほかの人が変えていたら
   サーバーは保存せずに最新の設定を返すので、それに同じ操作をかけ直して送り直す（同時に変えても両方の変更が残る）。
   消しても、これまでの記録の中身は消さない（記録には、そのときの名前のまま残る）
   ========================================================= */
const CFG = { base: null, rev: 0, pending: [], msg: '' };   // base：確定した設定（共有先。端末内のみのときは端末）、pending：まだ送れていない操作
let CONF = null;
const CUSTOM_ID = /^x_[a-z0-9]{4,20}$/;
const builtinOf = id => BUILTIN_FIELDS.find(f => f.id === id);
const isCustom = f => !!f && f.type !== 'builtin';
const fieldById = id => (CONF ? CONF.fields.find(f => f.id === id) : null) || null;
const inForm = f => !!f && !f.hidden && !f.deleted;                  // 記録する画面に出す項目
const shown = id => inForm(fieldById(id));
/* 短い名前（詳細の「設備」「症状」の札など）。名前を変えていなければ短い名前、変えていればその名前 */
function shortLabel(f) { const b = builtinOf(f.id); return b && f.label === b.label ? b.short : f.label; }
function defaultConfig() {

    symptoms: DEFAULT_SYMPTOMS.slice(),
    fields: BUILTIN_FIELDS.map(f => ({ id: f.id, type: 'builtin', label: f.label, required: !!(f.core || f.req), hidden: false, deleted: false, options: [] })),
    aliases: [],
  };
}
/* 設定の形を確かめて整える（サーバーの cleanConfig_ と同じ決まり）。もともとの項目が抜けていたら、元の並びの位置に足す
   （前の版の設定に無い 結果・原因の種類・停止時間 は、既定の必須で足す）。
   数字の項目の単位（unit・10字）と、設備の別の呼び方（aliases：場所の一覧にある設備のものだけ・60件・呼び方は10個×20字）も残す
   （ここで落とすと、設定を送ったときにサーバーからも消えるため） */
function cleanConfig(c) {
  if (!c || typeof c !== 'object' || Array.isArray(c)) return null;
  const t = (x, n) => (typeof x === 'string' || typeof x === 'number' ? String(x) : '').replace(/\s+/g, ' ').trim().slice(0, n);
  const list = (v, max, n) => { const out = []; (Array.isArray(v) ? v : []).forEach(x => { x = t(x, n); if (x && !out.includes(x) && out.length < max) out.push(x); }); return out; };
  const areas = [];
  (Array.isArray(c.areas) ? c.areas : []).forEach(a => {
    const name = a && typeof a === 'object' ? t(a.name, 20) : '';
    if (name && areas.length < 20 && !areas.some(x => x.name === name)) areas.push({ name, equip: list(a.equip, 60, 40) });
  });
  const fields = [], seen = new Set();
  (Array.isArray(c.fields) ? c.fields : []).forEach(f => {
    if (!f || typeof f !== 'object' || fields.length >= 40) return;
    const id = String(f.id || ''), b = builtinOf(id), label = t(f.label, 20), core = !!(b && b.core);
    if (seen.has(id) || (!b && (!CUSTOM_ID.test(id) || !label))) return;
    seen.add(id);
    const type = b ? 'builtin' : (['text', 'number', 'choice'].includes(f.type) ? f.type : 'text');
    const field = { id, type, label: label || b.label, required: core || f.required === true, hidden: !core && f.hidden === true,
      deleted: !b && f.deleted === true, options: type === 'choice' ? list(f.options, 30, 30) : [] };
    const unit = type === 'number' ? t(f.unit, 10) : '';
    if (unit) field.unit = unit;
    fields.push(field);
  });
  BUILTIN_FIELDS.forEach((b, i) => {
    if (seen.has(b.id)) return;
    const prev = BUILTIN_FIELDS.slice(0, i).map(x => x.id).reverse().find(id => seen.has(id));
    fields.splice(prev ? fields.findIndex(f => f.id === prev) + 1 : 0, 0, { id: b.id, type: 'builtin', label: b.label, required: !!(b.core || b.req), hidden: false, deleted: false, options: [] });
    seen.add(b.id);
  });
  // 設備の別の呼び方。正式名と同じ言葉は除いてから10まで。同じ正式名は最初のものだけ
  const known = new Set(areas.flatMap(a => a.equip)), aliases = [];
  (Array.isArray(c.aliases) ? c.aliases : []).forEach(a => {
    const equip = a && typeof a === 'object' ? t(a.equip, 40) : '';
    if (!equip || !known.has(equip) || aliases.some(x => x.equip === equip) || aliases.length >= 60) return;
    const words = list((Array.isArray(a.words) ? a.words : []).filter(w => t(w, 40) !== equip), 10, 20);
    if (words.length) aliases.push({ equip, words });
  });
  return { v: 1, lines: list(c.lines, 30, 20), areas, symptoms: list((Array.isArray(c.symptoms) ? c.symptoms : []).map(symptomWord), 40, 20), fields, aliases };
}
/* 症状の言葉の「、」「,」は「・」にする（サーバーの symptomWord_ と同じ）。症状の種類はシートで「、」でつなぐので、区切りの文字を含む言葉は
   読み戻すと割れる（チップの on が外れ、同じ症状のまとめも別の言葉で当たる）。設定の言葉と記録の症状の種類を同じ決まりでそろえる */
const symptomWord = x => (typeof x === 'string' ? x.replace(/[、,，]/g, '・') : x);
/* 並べ替えできる一覧と、その見分け方 */

  .map(f => ({ label: f.label.slice(0, 20), value: String(r.extra[f.id]).trim().slice(0, 60), unit: f.type === 'number' ? String(f.unit || '').slice(0, 10) : '' }));
/* まとまりの記録の「設定」で足した項目の内訳（選ぶ項目は値ごとの件数、数字の項目は件数・合計・平均。あわせて6件まで） */
function extrasStats(recs) {
  const out = [], round = v => Math.round(v * 100) / 100;
  for (const f of FIELDS.filter(f => isCustom(f) && !f.deleted && f.label)) {
    if (out.length >= 6) break;
    const vals = recs.map(r => String((r.extra || {})[f.id] || '').trim()).filter(Boolean);
    if (f.type === 'choice' && vals.length) {
      const m = new Map();
      vals.forEach(v => m.set(v, (m.get(v) || 0) + 1));
      out.push({ label: f.label, kind: 'choice', counts: [...m].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([v, n]) => ({ v, n })) });
    } else if (f.type === 'number') {
      const nums = vals.map(numberOf).filter(v => v !== null).map(Number);
      if (!nums.length) continue;
      const sum = nums.reduce((a, b) => a + b, 0);
      out.push({ label: f.label, kind: 'number', n: nums.length, sum: round(sum), avg: round(sum / nums.length), unit: f.unit || '' });
    }
  }
  return out;
}
/* AIに渡す記録（最大15件）と集計。いちばん近い記録のまとまりの内訳を渡し、
   記録は原因ごとの代表（新しい順）を先に入れる（似ている順の上位だけだと、多い原因が抜けることがあるため）。
   サンプルは、表示の設定にかかわらず渡さない（試用のための架空の例なので。サンプルしかなければ記録0件として聞く）。画面の検索結果・フローはそのまま */
function aiInput(m) {
  const pool = RECORDS.filter(r => !r.deleted);
  const { Q, hits: found } = search(m.query, null, pool), hits = found.map(h => h.r);
  if (!hits.length) {
    const recs = Q.equip || Q.areas.length ? nearOf(Q, pool).slice(0, 5) : [];
    return { recs, stats: { total: 0, near: recs.length > 0 } };
  }
  const f = flowsOf(buildFlows(pool), hits.slice(0, 3).map(r => r.id))[0];
  const picked = [], seen = new Set();
  const add = (id, max) => { if (picked.length < max && !seen.has(id)) { seen.add(id); picked.push(id); } };
  if (f) {
    const lists = f.causes.map(c => c.ids);
    for (let i = 0; picked.length < 10 && lists.some(l => i < l.length); i++) for (const l of lists) if (i < l.length) add(l[i], 10);
  }
  hits.forEach(r => add(r.id, 15));
  const partsText = ps => ps.slice(0, 3).map(p => (p.name || '') + (p.model ? '（' + p.model + '）' : '') + (p.count > 1 ? '×' + p.count : '')).join('、');
  const recsOf = ids => ids.map(findRec).filter(Boolean);
  // 対処ごとの結果（直った・直らなかった の件数）と、原因ごとの原因の種類（多い順に3つまで）
  const results = ids => ({ fixed: recsOf(ids).filter(r => r.result === 'fixed').length, notfixed: recsOf(ids).filter(r => r.result === 'notfixed').length });
  const types = ids => {
    const n = new Map();
    recsOf(ids).forEach(r => { if (r.causeType) n.set(r.causeType, (n.get(r.causeType) || 0) + 1); });
    return [...n].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  };
  const flow = f && {
    area: f.area, equipment: f.equipment, symptom: f.symptom, count: f.count,
    causes: f.causes.slice(0, 6).map(c => ({ label: c.label, count: c.count, causeTypes: types(c.ids),
      actions: c.actions.slice(0, 3).map(a => Object.assign({ label: a.label, count: a.count, parts: partsText(a.parts) }, results(a.ids))) })),
    extras: extrasStats(recsOf(f.ids)),   // いちばん近いまとまりの、選ぶ項目の内訳・数字の項目の合計と平均
  };
  return { recs: picked.map(findRec).filter(Boolean), stats: { total: hits.length, flow: flow || null } };
}
async function askAi(m) {
  if (!m || (m.ai && m.ai.state === 'loading')) return;
  if (!navigator.onLine) { toast('オフラインのため、AIには聞けません'); return; }
  // 押した時点の記録で探し直す（同期の前に送った質問でも、チームの最新の記録で聞く。吹き出しの一覧も新しくなる）
  const fresh = answer(m.query);
  for (const k of ['kind', 'ids', 'total', 'near', 'nearLabel']) m[k] = fresh[k];
  // 候補も新しくする。ただし「違った」の印を付けたあとは、印を付けた候補のまま（印が別の候補を指したり消えたりしないように）
  if (!(m.done && m.done.length)) for (const k of ['cands', 'candsHead']) m[k] = fresh[k];
  const { recs, stats } = aiInput(m);
  const refIds = recs.map(r => r.id);   // AIが返す記録番号（1〜）→ この順の記録
  m.ai = { state: 'loading', refIds };
  chatChanged(m);
  render();
  const box = document.getElementById('ai-' + CHAT.indexOf(m));
  if (box) box.scrollIntoView({ block: 'nearest' });
  try {
    // サーバーは80秒以内に必ず返す（AIの時間切れも理由つきで返る）ので、それより長く待つ
    // 写真を送ったときは、本人のひとこと（無ければその旨）を質問にし、写真から読み取ったことを添える（写真そのものは送らない）
    const question = m.photo ? (m.text || PHOTO_ONLY_Q) : m.query;
    // refIds：渡した記録の ID（サーバーの AI履歴 に残す。AIには送らない）
    const res = await gasFetch({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'suggest', key: KEY, question, records: recs.map(aiRecord), stats, vision: visionWire(m), refIds }) }, null, 100000);
    m.ai = { state: 'done', refIds, data: res.suggestion, by: typeof res.by === 'string' ? res.by : '', historyId: historyIdOf(res.historyId) };
  } catch (e) {
    m.ai = { state: 'error', refIds, msg: e.message };
    if (e.code === 'key') SYNC.state = 'key';
  }
  aiAnswered(m);   // 別の画面・別のチャットを見ていたら書き換えない（戻ったときに表示される）
}
/* 対処案の評価（任意）。AIの枠の下に小さく出す。押すとすぐ「ありがとうございます」に変える（押したかどうかはメッセージに覚える）。
   オフライン・送れなかったときは toast で知らせるだけ（作業は止めない。送れなかったときは、また押せるように戻す）。
   k・i：作業手順（'p' とタブの番号）・聞き直し（'n' と回の番号）・調べもの（'l' と 0）の評価。無ければ今までの対処案（m.ai） */
const rateTarget = (m, k, i) => (!m ? null : k === 'p' ? (m.proc && m.proc.items[i]) || null : k === 'n' ? (m.narrow && m.narrow.rounds[i]) || null

function feedbackHtml(m, k, i) {

    `<button type="button" class="chip sug" data-act="ai-rate" ${at} data-v="${v}">${esc(l)}</button>`).join('')}</div>`;

async function rateAi(m, rating, k, i) {
  const a = rateTarget(m, k, i);
  if (!a || a.state !== 'done' || !a.historyId || a.rated || !labelOf(RATINGS, rating)) return;
  if (!navigator.onLine) { toast('オフラインのため、評価は送れませんでした'); return; }
  const redraw = () => { const box = document.getElementById(fbId(m, k, i)); if (box) box.outerHTML = feedbackHtml(m, k, i); };   // 描き直さずに、その所だけ（読んでいる位置を動かさない）
  a.rated = rating;
  redraw();
  chatChanged(m, true);
  try {
    await gasFetch({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'feedback', key: KEY, historyId: a.historyId, rating }) });
  } catch (e) {
    a.rated = '';
    redraw();
    chatChanged(m, true);
    toast('評価を送れませんでした（' + e.message + '）');

/* 写真を送ったときは、写真の読み取りが終わってから（探す言葉があるときだけ）対処案を聞ける */
const canAsk = m => !m.photo || (m.kind !== 'photo' && !(m.vision && m.vision.state === 'loading'));
/* 記録の番号（1〜。refIds の順）→ 記録のチップ（記録2：10/23 4号）。消した記録は出さない */
const liveNums = (refIds, nums) => (Array.isArray(nums) ? nums : []).filter(n => { const id = (refIds || [])[n - 1], r = id && findRec(id); return !!(r && !r.deleted); });

  return `<button type="button" class="rchip" data-rid="${esc(id)}">記録${n}：${esc(fmtDay(r.occurredAt))} ${esc((r.line || '').replace('ライン', ''))}${r.sample ? '（サンプル）' : ''}</button>`;

/* 吹き出しの下のAIの部分。新しい版のサーバー（版4）：候補があれば「AIに作業手順を聞く」、候補が無ければ「AIに聞く」（聞き直し）。

function aiBlock(m, panel) {

  html += hasNarrow(m) ? narrowHtml(m) : !has && fresh && can ? btn('narrow', 'AIに聞く') : '';

  </div>${feedbackHtml(m)}`;

/* =========================================================
   9-2-2. AIの作業手順（①②③）・聞き直し（新しい版のサーバー：版4）
   候補があれば「AIに作業手順を聞く」：候補ごとに、安全 → 確認 → 判断 → 対処 → 復旧確認 の手順を出す（m.proc）。
   ①〜③がどれも違ったとき（次の手の「AIに聞き直す」）と、候補が無いとき（「AIに聞く」）は、
   絞り込みの質問と次に確かめることを出す（m.narrow。質問に答えて、もう一度聞ける。3回まで）。
   AIは押したときだけ聞く（②③の手順も、そのタブか「直らないときは…」を押したときだけ。費用のため）。

const PROC_VERSION = 4;   // 作業手順・聞き直しに対応したサーバーの版（一覧の version がこれ以上）

const OLD_PROC_MSG = 'サーバーの Code.gs が前の版のため、作業手順と聞き直しは使えません。Code.gs を新しい版に貼り替えて、デプロイを更新してください（管理者へ）';

const CAND_MARKS = ['①', '②', '③'];
const NARROW_MAX = 3;   // 聞き直しは3回まで（それ以上は詳しい人に相談）
/* もう聞いたか（手順が1つでもある・聞き直しが1回でもある）。答えの無い入れ物（待っている途中の答えを除いて残したもの）は、聞いていない扱い */
const hasProc = m => !!(m && m.proc && m.proc.items && Object.keys(m.proc.items).length);
const hasNarrow = m => !!(m && m.narrow && Array.isArray(m.narrow.rounds) && m.narrow.rounds.length);

const candShort = c => cutText(c.label || (c.action && c.action.label) || '原因未記入', 8);
/* 「AIに作業手順を聞く」で手順を作る候補：①〜③のうち、まだ「違った」の印が無い最初の候補（カードで「次に確認」と強調している候補。

/* AIに渡す候補（①②③）と記録。target：手順を作る候補（0〜2。聞き直しは -1）。

/* 答えが返らなかったとき。前の版の Code.gs は作業手順・聞き直しを知らない（「知らない操作です」） */
function chatError(e) {

/* AIの答えが返ったとき：答えは、その吹き出しのチャットに残す（待っている間に別のチャットを開いても）。

  else { renderSync(); renderHist(); }
}
/* 答えの形を確かめる（サーバーでも整えているが、念のため。番号は1〜15の整数だけ） */
const aiStr = (x, n) => (typeof x === 'string' ? x.replace(/\s+/g, ' ').trim().slice(0, n) : '');
const aiNums = v => [...new Set((Array.isArray(v) ? v : []).filter(k => Number.isInteger(k) && k >= 1 && k <= 15))];
const aiList = (v, n) => (Array.isArray(v) ? v : []).filter(x => x && typeof x === 'object').slice(0, n);
function procData(d) {
  d = d && typeof d === 'object' ? d : {};
  const steps = aiList(d.steps, 8).map(x => ({ stage: PROC_STAGES.includes(x.stage) ? x.stage : '確認', title: aiStr(x.title, 60), detail: aiStr(x.detail, 200),
    normal: aiStr(x.normal, 100), abnormal: aiStr(x.abnormal, 100), records: aiNums(x.records) })).filter(x => x.title || x.detail);
  return { summary: aiStr(d.summary, 300), steps, safety: aiStr(d.safety, 300), enough_records: d.enough_records === true };
}
function narrowData(d) {
  d = d && typeof d === 'object' ? d : {};
  const questions = aiList(d.questions, 3).map(x => ({ q: aiStr(x.q, 60), options: [...new Set((Array.isArray(x.options) ? x.options : []).map(o => aiStr(o, 20)).filter(Boolean))].slice(0, 4) }))
    .filter(x => x.q && x.options.length >= 2);   // ボタンで答えられる質問だけ
  const checks = aiList(d.checks, 5).map(x => ({ text: aiStr(x.text, 120), records: aiNums(x.records) })).filter(x => x.text);
  return { summary: aiStr(d.summary, 300), questions, checks, safety: aiStr(d.safety, 300) };
}

/* 「AIに作業手順を聞く」・タブ②③・「もう一度聞く」。ti：候補の番号（0〜2） */
async function askProc(m, ti) {
  if (!m) return;
  const cur = m.proc && m.proc.items[ti];
  if (cur && cur.state === 'loading') return;
  if (!aiAvailable()) { toast('いまはAIを使えないため、手順を聞けません'); return; }
  if (!navigator.onLine) { toast('オフラインのため、AIには聞けません'); return; }
  const first = !hasProc(m);
  refreshForAi(m);
  if (ti < 0 || ti >= Math.min(3, m.kind === 'hit' ? candidatesOf(m).length : 0)) { render(); return; }   // 探し直したら候補が無くなった
  const inp = procInput(m, ti);
  const item = { state: 'loading', refIds: inp.recs.map(r => r.id) };   // AIが返す記録番号（1〜）→ この順の記録
  const P = m.proc && m.proc.items ? m.proc : (m.proc = { tab: ti, items: {} });
  if (first) P.first = ti;   // 「AIに作業手順を聞く」で聞いた候補（記録する画面に渡すAI履歴の ID は、この候補の手順）
  P.tab = ti;
  P.items[ti] = item;
  chatChanged(m);
  redrawKeep();
  const box = first && document.getElementById('pr-' + CHAT.indexOf(m));
  if (box) box.scrollIntoView({ block: 'nearest' });
  try {
    const res = await chatPost(m, 'procedure', inp, { target: ti });
    const d = procData(res.procedure);
    if (!d.steps.length) throw new Error('AIの回答に手順がありませんでした。もう一度聞いてください');
    Object.assign(item, { state: 'done', data: d, by: typeof res.by === 'string' ? res.by : '', historyId: historyIdOf(res.historyId) });
  } catch (e) {
    Object.assign(item, { state: 'error', msg: chatError(e) });
  }
  aiAnswered(m);
}
/* タブ①②③・「直らないときは…」。まだ聞いていない候補なら、ここで聞く。toTop：手順の枠の上まで動かす（次の候補の手順を、手順1から読めるように） */
function procTab(m, ti, toTop) {
  if (!hasProc(m) || !candidatesOf(m)[ti]) return;
  if (m.proc.items[ti]) { m.proc.tab = ti; redrawKeep(); }
  else askProc(m, ti);   // 描き直しまでは、すぐ（答えを待たずに）終わる
  const box = toTop && m.proc.tab === ti && document.getElementById('pr-' + CHAT.indexOf(m));
  if (box) box.scrollIntoView({ block: 'start' });
}
/* AIの作業手順の枠（見本2）：見出し・まとめ・タブ①②③・手順（段階・正常／異常・根拠の記録か「一般（要確認）」）・次の候補へ・安全・評価 */
function procHtml(m) {
  const mi = CHAT.indexOf(m), P = m.proc, top = candidatesOf(m).slice(0, 3), marks = m.done || [];
  // 選んでいるタブの答えが無ければ（待っている途中で閉じて残らなかった など）、答えのあるタブを出す
  let ti = Math.min(Math.max(0, Math.floor(+P.tab) || 0), Math.max(0, top.length - 1));
  if (!P.items[ti]) ti = Math.max(0, top.findIndex((c, i) => !!P.items[i]));
  const it = P.items[ti] || null, d = it && it.state === 'done' ? it.data || {} : null;
  const tabs = top.map((c, i) => `<button type="button" class="${i === ti ? 'on' : ''}${marks.includes(c.key) ? ' done' : ''}" data-act="proc-tab" data-mi="${mi}" data-ti="${i}" aria-pressed="${i === ti}">${CAND_MARKS[i]} ${esc(candShort(c))}</button>`).join('');
  let body = '';
  if (!it) body = '<div class="muted" style="font-size:14px">この候補の手順は、まだ聞いていません。</div>';
  else if (it.state === 'loading') body = '<div class="pload"><b>AIが記録を読んで手順を作っています…</b><span class="muted" style="font-size:14px">10〜60秒ほどかかります</span></div>';
  else if (it.state === 'error') {
    body = `<div class="perr"><div>${esc(it.msg)}</div><div class="chips"><button type="button" class="chip" data-act="proc" data-mi="${mi}" data-ti="${ti}">もう一度聞く</button></div></div>`;
  } else {
    const steps = Array.isArray(d.steps) ? d.steps : [];
    body = `<ol class="proc">${steps.map((s, k) => {
      const nums = liveNums(it.refIds, s.records);
      return `<li><div class="pn">${k + 1}</div><div class="pb"><div class="pk">${esc(s.stage)}</div>${s.title ? `<div class="pt">${esc(s.title)}</div>` : ''}${s.detail ? `<div class="pd">${esc(s.detail)}</div>` : ''}
        ${s.normal || s.abnormal ? `<div class="judge">${s.normal ? `<b class="okk">正常</b><span>${esc(s.normal)}</span>` : ''}${s.abnormal ? `<b class="ngk">異常</b><span>${esc(s.abnormal)}</span>` : ''}</div>` : ''}
        <div class="src">${nums.length ? refChips(it.refIds, nums) : '<span class="gen">一般（要確認）</span>'}</div></div></li>`;
    }).join('')}</ol>
      ${d.enough_records ? '' : '<div class="muted" style="font-size:13px">関係する記録が少ないため、一般的な内容が中心です。</div>'}
      ${ti + 1 < top.length ? `<button type="button" class="nextc" data-act="proc-next" data-mi="${mi}" data-ti="${ti + 1}"><span>直らないときは <b>${CAND_MARKS[ti + 1]}${esc(candShort(top[ti + 1]))}</b> の手順へ</span>${ICON.more}</button>` : ''}
      ${d.safety ? `<div class="aisafe">${ICON.warn}<span>${esc(d.safety)}</span></div>` : ''}
      <div class="aifoot">AIによる提案です。「一般（要確認）」の手順は記録に無い内容です。最終判断は担当者が行ってください。${it.by ? `<br>回答したAI：${esc(it.by)}` : ''}</div>
      ${feedbackHtml(m, 'p', ti)}`;
  }
  return `<div class="aibox${it && it.state === 'loading' ? ' busy' : ''}" id="pr-${mi}">
    <div class="aih">${ICON.bulb}AIの作業手順<span class="badge">参考</span></div>
    ${d && d.summary ? `<div class="ais">${esc(d.summary)}</div>` : ''}
    <div class="ptabs">${tabs}</div>
    ${body}
  </div>`;
}

/* 聞き直し：いままでの答え（送った答え）と、いま選んでいる答え [{ q, a }] */
function narrowAnswers(m) {
  const N = hasNarrow(m) ? m.narrow : null, last = N && N.rounds[N.rounds.length - 1];
  if (!last) return [];
  const out = (last.answers || []).slice();
  const qs = last.state === 'done' && last.data ? last.data.questions || [] : [];
  qs.forEach((q, qi) => { const a = own(N.picks || {}, qi); if (a) out.push({ q: String(q.q || '').slice(0, 60), a: String(a).slice(0, 20) }); });
  return out;
}
/* 聞き直しの1回目（次の手の「AIに聞き直す」・候補が無いときの「AIに聞く」） */
function startNarrow(m) {
  if (!m || hasNarrow(m)) return;
  if (!aiAvailable()) { toast('いまはAIを使えないため、聞けません'); return; }
  if (!navigator.onLine) { toast('オフラインのため、AIには聞けません'); return; }
  refreshForAi(m);
  m.narrow = { rounds: [], picks: {} };
  const r = { state: 'loading', answers: [] };
  m.narrow.rounds.push(r);
  runNarrow(m, r);
}
/* 「この答えでAIに聞く」：いままでの答えと、いま選んだ答えを添えて、次の回を聞く */
function nextNarrow(m) {
  const N = hasNarrow(m) ? m.narrow : null, last = N && N.rounds[N.rounds.length - 1];
  if (!last || last.state !== 'done' || N.rounds.length >= NARROW_MAX || !Object.keys(N.picks || {}).length) return;
  if (!navigator.onLine) { toast('オフラインのため、AIには聞けません'); return; }
  const r = { state: 'loading', answers: narrowAnswers(m).slice(0, 6) };
  N.rounds.push(r);
  N.picks = {};
  runNarrow(m, r);
}
/* 「もう一度聞く」（いちばん新しい回が失敗したとき。同じ答えで聞き直す） */
function retryNarrow(m, ri) {
  const N = hasNarrow(m) ? m.narrow : null, r = N && N.rounds[ri];
  if (!r || r.state !== 'error' || ri !== N.rounds.length - 1) return;
  if (!navigator.onLine) { toast('オフラインのため、AIには聞けません'); return; }
  r.state = 'loading';
  delete r.msg;
  runNarrow(m, r);
}
async function runNarrow(m, r) {
  const inp = procInput(m, -1);
  r.refIds = inp.recs.map(x => x.id);
  chatChanged(m);
  redrawKeep();
  const box = document.getElementById('nr-' + CHAT.indexOf(m) + '-' + m.narrow.rounds.indexOf(r));
  if (box) box.scrollIntoView({ block: 'nearest' });
  try {
    const res = await chatPost(m, 'narrow', inp, { answers: r.answers });
    const d = narrowData(res.narrow);
    if (!d.questions.length && !d.checks.length) throw new Error('AIの回答に質問も確認もありませんでした。もう一度聞いてください');
    Object.assign(r, { state: 'done', data: d, by: typeof res.by === 'string' ? res.by : '', historyId: historyIdOf(res.historyId) });
  } catch (e) {
    Object.assign(r, { state: 'error', msg: chatError(e) });
  }
  aiAnswered(m);
}
/* 質問の答えを選ぶ（もう一度押すと外す）。答えられるのは、いちばん新しい回の質問だけ */
function pickNarrow(m, qi, v) {
  const N = hasNarrow(m) ? m.narrow : null, last = N && N.rounds[N.rounds.length - 1];
  const q = last && last.state === 'done' && last.data && (last.data.questions || [])[qi];
  if (!q || !(q.options || []).includes(v)) return;
  const picks = N.picks || (N.picks = {});
  if (picks[qi] === v) delete picks[qi]; else picks[qi] = v;
  chatChanged(m);   // 選んだ答えも履歴に残す
  redrawKeep();
}
/* AIからの質問の枠（見本6）。回ごとに1つ。前の回の質問は、次の回で送った答えを選んだ形で出す（押せない） */
function narrowHtml(m) {
  const mi = CHAT.indexOf(m), N = m.narrow, rs = N.rounds || [];
  return rs.map((r, ri) => {
    const id = `nr-${mi}-${ri}`, last = ri === rs.length - 1;
    if (r.state === 'loading') return `<div class="aibox busy" id="${id}"><div class="aih">${ICON.bulb}AIが記録を読んで質問を考えています…</div><div class="muted" style="font-size:14px">10〜60秒ほどかかります</div></div>`;
    if (r.state === 'error') {
      return `<div class="aibox err" id="${id}"><div class="aih">${ICON.bulb}AIからの質問を出せませんでした</div><div>${esc(r.msg)}</div>
        ${last ? `<div class="chips"><button type="button" class="chip" data-act="narrow-retry" data-mi="${mi}" data-ri="${ri}">もう一度聞く</button></div>` : ''}</div>`;
    }
    const d = r.data || {}, qs = Array.isArray(d.questions) ? d.questions : [], checks = Array.isArray(d.checks) ? d.checks : [];
    // 次の回の answers は、いままでの答え（この回の answers）＋この回で選んだ答え。同じ質問がまた出たときに前の回の答えを出さないよう、この回の分だけを見る
    const sent = (((rs[ri + 1] || {}).answers) || []).slice((r.answers || []).length);
    const chosen = (q, qi) => (last ? own(N.picks || {}, qi) : (sent.find(a => a.q === String(q.q || '').slice(0, 60)) || {}).a);
    const qhtml = qs.map((q, qi) => `<div class="qa"><div class="qt">${qi + 1}. ${esc(q.q)}</div><div class="chips">${(q.options || []).map(o => {
      const on = chosen(q, qi) === o;
      return `<button type="button" class="chip${on ? ' on' : ''}" aria-pressed="${on}"${last ? ` data-act="narrow-pick" data-mi="${mi}" data-qi="${qi}" data-v="${esc(o)}"` : ' disabled'}>${esc(o)}</button>`;
    }).join('')}</div></div>`).join('');
    const withRec = checks.filter(c => liveNums(r.refIds, c.records).length), general = checks.filter(c => !liveNums(r.refIds, c.records).length);
    const picked = last && Object.keys(N.picks || {}).length;
    return `<div class="aibox" id="${id}">
      <div class="aih">${ICON.bulb}AIからの質問<span class="badge">参考</span></div>
      ${d.summary ? `<div class="ais" style="font-size:15px">${esc(d.summary)}</div>` : ''}
      ${qhtml}
      ${withRec.length ? `<div class="h3">記録にもとづく確認</div><ol class="nchk">${withRec.map(c => `<li>${esc(c.text)}<div class="rchips">${refChips(r.refIds, c.records)}</div></li>`).join('')}</ol>` : ''}
      ${general.length ? `<div class="h3">記録にない確認<span class="gen">一般（要確認）</span></div><ul class="aigen">${general.map(c => `<li>${esc(c.text)}</li>`).join('')}</ul>` : ''}
      ${d.safety ? `<div class="aisafe">${ICON.warn}<span>${esc(d.safety)}</span></div>` : ''}
      <div class="aifoot">「一般（要確認）」は記録に無い内容です。最終判断は担当者が行ってください。${r.by ? `<br>回答したAI：${esc(r.by)}` : ''}</div>
      ${feedbackHtml(m, 'n', ri)}
    </div>${!last ? '' : rs.length >= NARROW_MAX ? '<div class="nend">これ以上は、詳しい人に相談してください。</div>'
      : picked ? `<div class="chips naskb"><button type="button" class="chip aichip" data-act="narrow-next" data-mi="${mi}">${ICON.bulb}この答えでAIに聞く</button></div>` : ''}`;
  }).join('');
}
/* 記録する画面に渡すAI履歴の ID：「AIに作業手順を聞く」で聞いた候補の手順（ふつうは①。①に印を付けてから聞いたら②など）、
   なければ いちばん新しい聞き直し、なければ 今までの対処案 */
function aiHistoryOf(m) {
  const p = m.proc && m.proc.items && m.proc.items[m.proc.first || 0];
  if (p && p.state === 'done' && p.historyId) return p.historyId;
  const rs = ((m.narrow && m.narrow.rounds) || []).filter(r => r.state === 'done' && r.historyId);
  if (rs.length) return rs[rs.length - 1].historyId;
  return m.ai && m.ai.state === 'done' && m.ai.historyId ? m.ai.historyId : '';
}

/* =========================================================
   9-2-3. 調べもの（Web）（新しい版のサーバー：版5）
   入力欄の上の［調べる］にして送ると、AI（Claude）がWebで型式・定格などを調べ、出典つきで答える（1〜3分）。
   AIは、送ったときと「もう一度調べる」を押したときだけ聞く。答えは吹き出しに持ち、この端末の履歴に残す（サーバーの「AI履歴」にも残る）。
   トラブルのチャットで調べたことは、「この内容で記録する」で記録の「調べたこと」に入る（ほかには残さない）。
   切り替えは、サーバーが調べものに対応していて（一覧の features.lookup）、AIが使えるときだけ出す（前の版のサーバー・端末内のみでは出さない）
   ========================================================= */
const LOOKUP_VERSION = 5;   // 調べものに対応したサーバーの版（一覧の version がこれ以上）
const lookupOn = () => aiAvailable() && SYNC.version !== null && SYNC.version >= LOOKUP_VERSION && !!(SYNC.features && SYNC.features.lookup);
// 入力欄の送り方：search（探す）・lookup（調べる）。新しいチャット・別のチャットを開いたら「探す」に戻す（タブを替えても残す）
let MODE = 'search';
const curMode = () => (MODE === 'lookup' && lookupOn() ? 'lookup' : 'search');   // 使えなくなったら「探す」として動く
const LOOK_LOST = '調べている途中でアプリを閉じたため、答えを受け取れませんでした';
const OLD_LOOK_MSG = 'サーバーの Code.gs が前の版のため、調べもの（Web）は使えません。Code.gs を新しい版に貼り替えて、デプロイを更新してください（管理者へ）';
// もう一度押しても変わらない失敗（上限・設定・合言葉・前の版のサーバー）。ほかの失敗（AI・時間切れ・通信）は「もう一度調べる」を出す
const LOOK_NO_RETRY = ['lookup-limit', 'ai-limit', 'lookup-off', 'key', 'setup', 'ai-setup', 'old'];
const lookRetry = l => !!l && l.state === 'error' && !LOOK_NO_RETRY.includes(l.code);
// 「終わっていればすぐ出ます（費用は増えません）」は、アプリがサーバーの答えを受け取れなかったときだけ（通信が切れた・待ちきれなかった・
// 待つ間にアプリを閉じた・同じ調べものをサーバーがまだ処理中）。サーバーが失敗を返したとき（時間切れ・控えた・長すぎた など）は控えに残らないので、
// もう一度押すとAIにもう一度聞く（費用もかかる）
const lookLate = l => l.code === 'net' || l.code === 'ai-busy' || l.msg === LOOK_LOST;
const LOOK_PH = '例：FR-E820-7.5K の定格電流は？', LOOK_PH_NEXT = '続けて聞く（例：LD と ND はどう選ぶ？）';
/* https のリンクだけ（500字まで）。使えなければ null */
function httpsUrl(u) {
  if (typeof u !== 'string' || u.length > 500 || !/^https:\/\//i.test(u)) return null;
  try { const x = new URL(u); return x.protocol === 'https:' && x.hostname ? x : null; } catch (e) { return null; }

const isPdf = u => /\.pdf$/i.test(u.pathname);
/* 調べものの答えを確かめて整える（サーバーでも整えているが、念のため）。リンクは https だけ・出す場所の名前（ホスト）はリンクから作り直す
   （出す名前と開く先を同じにする）・長さと数の上限・出典の番号（1〜10）。答えの文が無ければ null。
   サーバーは http の出典も返すことがある（LOOKUP_SPEC 1-5）。https でない出典を除いたら、番号を 1, 2, … に詰め直す（出典の番号が飛ばないように） */
function lookData(d) {
  if (!isObj(d)) return null;
  const num = (v, max) => (typeof v === 'number' && Number.isFinite(v) && v >= 0 ? Math.min(max, Math.round(v)) : 0);
  const sources = [], nums = new Map();   // サーバーの番号 → 出す番号
  for (const x of (Array.isArray(d.sources) ? d.sources : []).slice(0, 10)) {
    const u = isObj(x) ? httpsUrl(x.url) : null, n = isObj(x) ? x.n : 0;
    if (!u || !Number.isInteger(n) || n < 1 || n > 10 || nums.has(n)) continue;
    nums.set(n, sources.length + 1);
    const title = (typeof x.title === 'string' ? x.title : '').replace(/\s+/g, ' ').trim().slice(0, 120);
    sources.push({ n: sources.length + 1, title: title || u.hostname, url: u.href, host: u.hostname, pdf: isPdf(u) });
  }
  // 答え：区切りごとの文（改行は残す）と、その区切りの出典の番号（ある出典だけ・小さい順）。あわせて2000字まで（超えたら最後を「…」）
  const answer = [];
  let left = 2000;
  for (const x of (Array.isArray(d.answer) ? d.answer : []).slice(0, 80)) {
    if (!isObj(x) || typeof x.text !== 'string' || left <= 0) continue;
    let text = x.text.replace(/\r\n?/g, '\n');
    if (text.length > left) text = text.slice(0, left - 1) + '…';
    left -= text.length;
    const cites = [...new Set((Array.isArray(x.cites) ? x.cites : []).filter(n => nums.has(n)).map(n => nums.get(n)))].sort((a, b) => a - b);

/* =========================================================
   10. 写真（縮小して保存。送信後は小さな縮小画像だけ端末に残す）
   ========================================================= */
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
function toJpeg(img, max, quality) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}
async function makePhoto(file, withView) {
  const img = await loadImage(file);
  const p = { id: newId('p'), data: toJpeg(img, 1280, 0.8), thumb: toJpeg(img, 240, 0.7), driveId: null };
  if (withView) p.view = toJpeg(img, 480, 0.75);   // 会話の吹き出し用（描き直すたびに大きな画像を並べ直さないため）
  return p;
}
const safeData = u => (typeof u === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) ? u : '';

const fullSrc = p => p ? (safeData(p.data) || driveUrl(p.driveId, 1600) || safeData(p.thumb)) : '';
function resolvePhoto(ref) {
  const [src, kind, i] = String(ref).split(':');
  if (src === 'chat') { const m = CHAT.find(x => x.role === 'me' && x.photo && x.photo.id === kind); return m ? m.photo : null; }   // 「探す」で送った写真
  const obj = src === 'form' ? FORM : findRec(src);
  if (!obj) return null;
  return kind === 'photo' ? (obj.photos || [])[+i] : ((obj.parts || [])[+i] || {}).photo;
}
function openLightbox(ref) {
  const src = fullSrc(resolvePhoto(ref));
  if (!src) return;
  const lb = $('#lb');
  lb.textContent = '';
  const img = document.createElement('img');
  img.alt = '拡大写真'; img.src = src;
  lb.appendChild(img);
  lb.classList.add('show');
}
function imgHtml(p, ref, alt) {
  const src = thumbSrc(p);
  return src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" data-photo="${esc(ref)}">` : '';
}

/* 「可能性の高い順」の部分（見出し・①②③のカード・ほかの候補・どれでもなかった）。allDone：①〜③（3つ未満ならそのすべて）に「違った」の印がある */

/* 候補のカード1枚。i：0 からの番号、label：小さな札、top：強調する（いま確かめる候補） */
function candCard(m, c, i, label, top) {
